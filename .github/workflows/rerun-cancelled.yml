# Re-runs CI jobs that were cancelled or never started (GitHub runner outages), so that
# auto-merge can still complete without anyone watching. Real test failures are NOT re-run.
name: Rerun cancelled CI

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    runs-on: ubuntu-24.04
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'cancelled' ||
       github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'timed_out') &&
      github.event.workflow_run.run_attempt < 4
    steps:
      - name: Re-run cancelled jobs (not real failures)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # Only the newest CI run of this branch is worth re-running.
          latest=$(gh run list -R "$REPO" --workflow CI --branch "$BRANCH" --limit 1 --json databaseId -q '.[0].databaseId')
          if [ "$latest" != "$RUN_ID" ]; then echo "Newer run $latest exists - skip."; exit 0; fi
          jobs=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")
          # A job that failed in one of its steps is a real failure: leave it red.
          real=$(echo "$jobs" | jq '[.jobs[] | select(.conclusion == "failure") | select([.steps[]? | select(.conclusion == "failure")] | length > 0)] | length')
          infra=$(echo "$jobs" | jq '[.jobs[] | select(.conclusion == "cancelled" or .conclusion == "timed_out" or (.conclusion == "failure" and ([.steps[]? | select(.conclusion == "failure")] | length == 0)))] | length')
          echo "real failures: $real, cancelled/never started: $infra"
          if [ "$real" -gt 0 ]; then echo "Real test failure - no re-run."; exit 0; fi
          if [ "$infra" -eq 0 ]; then echo "Nothing to re-run."; exit 0; fi
          sleep 120   # give the runners a moment after an outage
          gh run rerun "$RUN_ID" -R "$REPO" --failed
