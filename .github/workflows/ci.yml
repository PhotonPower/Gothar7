name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # Binary cache: vcpkg stores built packages as files, actions/cache persists them between runs
      # (the former x-gha backend was removed from vcpkg).
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite"
    steps:
      - uses: actions/checkout@v4

      # Each run saves a new cache entry (keys are immutable); restore takes the newest matching one.
      # PR runs can read caches saved on main.
      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ github.job }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ github.job }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-${{ github.job }}-
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        shell: bash
        run: |
          mkdir -p vcpkg-binary-cache  # relative to the workspace (the working directory)
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          if [ "$RUNNER_OS" = "Windows" ]; then "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics; else "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics; fi

      - name: Setup MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # SDL3 (ADR 0011) needs X11/Wayland development packages to build on Linux.
      - name: Install Ninja and SDL3 build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config autoconf autoconf-archive automake libtool libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libudev-dev xvfb libgl1-mesa-dri

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      # GPU tests (label "gpu") need OpenGL 4.5+: Mesa llvmpipe under Xvfb on Linux; the Windows
      # runners have no OpenGL driver, so they are excluded there (ADR 0003).
      - name: Test (Linux, incl. OpenGL via Mesa llvmpipe)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a ctest --preset debug

      - name: Test (Windows, without GPU tests)
        if: runner.os == 'Windows'
        run: ctest --preset debug -LE gpu

      - name: Smoke test
        shell: bash
        run: ./build/debug/game/gothar --smoke-test

      - name: Smoke test with window and OpenGL (Linux, Xvfb + llvmpipe)
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a ./build/debug/game/gothar --frames=10 --verbose

      - name: Smoke test with window, no rendering (Windows, offscreen video driver)
        if: runner.os == 'Windows'
        shell: bash
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: ./build/debug/game/gothar --frames=10 --no-render

  # Test coverage of core (M0 DoD: > 80 % lines). Fails below the threshold.
  coverage:
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      # Binary cache: vcpkg stores built packages as files, actions/cache persists them between runs
      # (the former x-gha backend was removed from vcpkg).
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-binary-cache,readwrite"
    steps:
      - uses: actions/checkout@v4

      # Each run saves a new cache entry (keys are immutable); restore takes the newest matching one.
      # PR runs can read caches saved on main.
      - name: Cache vcpkg binary packages
        uses: actions/cache@v4
        with:
          path: vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ github.job }}-${{ hashFiles('vcpkg.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ github.job }}-${{ hashFiles('vcpkg.json') }}-
            vcpkg-${{ runner.os }}-${{ github.job }}-
            vcpkg-${{ runner.os }}-

      - name: Setup vcpkg
        run: |
          mkdir -p vcpkg-binary-cache  # relative to the workspace (the working directory)
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Install Ninja, SDL3 build dependencies and gcovr
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build pkg-config autoconf autoconf-archive automake libtool libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl1-mesa-dev libgl1-mesa-dev libudev-dev xvfb libgl1-mesa-dri
          pipx install gcovr

      - name: Configure
        run: cmake --preset coverage

      - name: Build
        run: cmake --build --preset coverage

      - name: Test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a ctest --preset coverage

      - name: Coverage report (core, threshold 80 %)
        run: |
          mkdir -p coverage
          gcovr --root . --object-directory build/coverage \
                --filter 'engine/core/' --exclude-unreachable-branches \
                --html-details coverage/index.html \
                --fail-under-line 80 \
                --txt | tee coverage/summary.txt

      - name: Job summary
        if: always()
        run: |
          echo '### Testabdeckung engine/core' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat coverage/summary.txt >> "$GITHUB_STEP_SUMMARY" || echo 'kein Bericht' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-core
          path: coverage/

  # World-track tools (tools/worldgen, Python): lint, format check, tests.
  worldgen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"   # minimum supported version
          - os: windows-2022
            python: "3.12"   # development setup
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/worldgen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: tools/worldgen/pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (format)
        run: ruff format --check .

      - name: Pytest
        run: python -m pytest --cov=gothar_worldgen --cov-report=term-missing
