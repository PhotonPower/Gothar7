# Where things are on screen (M14, docs/modules/ui.md): boxes in UI units (pixels at 1080p), +Y down.
# anchor: top_left, top, top_right, left, center, right, bottom_left, bottom, bottom_right - the same point of the
# parent and of the box; offset moves it; a size <= 0 means the parent's extent plus that value (0 = full).
# Reloaded while the game runs (with [assets] hot_reload).
version = 1

# HUD as in Gothic 1 (owner decision F3): health bottom left, mana bottom right, enemy health top centre.
[hud.hp]
anchor = "bottom_left"
offset = [32, -32]
size = [260, 24]

[hud.mana]
anchor = "bottom_right"
offset = [-32, -32]
size = [260, 24]

[hud.enemy]
anchor = "top"
offset = [0, 24]
size = [360, 18]

[hud.air] # air while diving, above health
anchor = "bottom_left"
offset = [32, -66]
size = [260, 24]

# Screen messages top centre (F7), subtitles bottom centre (F6).
[hud.message]
anchor = "top"
offset = [0, 60]
size = [1200, 40]

[hud.subtitle]
anchor = "bottom"
offset = [0, -110]
size = [1200, 80]

# The sample screen (gothar --ui-sample).
[sample.panel]
anchor = "center"
size = [1100, 640]

[sample.title]
anchor = "top"
offset = [0, 30]
size = [-96, 50]

[sample.body]
anchor = "top"
offset = [0, 92]
size = [-96, 70]

[sample.small]
anchor = "top"
offset = [0, 170]
size = [-96, 26]

[sample.list]
anchor = "top_left"
offset = [48, 210]
size = [440, 290]

[sample.grid]
anchor = "top_right"
offset = [-48, 210]
size = [424, 290]

[sample.chosen]
anchor = "bottom_left"
offset = [48, -36]
size = [500, 28]

[sample.buttons]
anchor = "bottom_right"
offset = [-48, -28]
size = [416, 44]

# Dialogue choices on parchment at the bottom (part C; the spoken line is a subtitle).
[dialog.box]
anchor = "bottom"
offset = [0, -40]
size = [1100, 260]

[dialog.options]
anchor = "center"
size = [-80, -40]

# A letter or book being read.
[document.page]
anchor = "center"
size = [900, 680]

[document.title]
anchor = "top"
offset = [0, 48]
size = [-120, 50]

[document.text]
anchor = "top"
offset = [0, 112]
size = [-140, -170]

[document.hint]
anchor = "bottom"
offset = [0, -36]
size = [-120, 26]

# A choice at a mob (anvil, bed).
[choice.box]
anchor = "right"
offset = [-80, 0]
size = [520, 420]

[choice.title]
anchor = "top"
offset = [0, 36]
size = [-80, 50]

[choice.options]
anchor = "top"
offset = [0, 100]
size = [-80, 220]

[choice.message]
anchor = "bottom"
offset = [0, -64]
size = [-80, 50]

[choice.hint]
anchor = "bottom"
offset = [0, -30]
size = [-80, 26]

# Lockpicking.
[lockpick.box]
anchor = "center"
offset = [0, 200]
size = [640, 300]

[lockpick.title]
anchor = "top"
offset = [0, 30]
size = [-80, 50]

[lockpick.steps]
anchor = "top"
offset = [0, 96]
size = [-80, 44]

[lockpick.picks]
anchor = "top"
offset = [0, 152]
size = [-80, 32]

[lockpick.result]
anchor = "top"
offset = [0, 190]
size = [-80, 30]

[lockpick.hint]
anchor = "bottom"
offset = [0, -26]
size = [-80, 26]

# Inventory, trading, containers (part D, F4/F5): the hero's pane on the right, the trader's or container's on the
# left; inside a pane: title, tabs (hero only), grid, info box (hero only), footer and message.
[inventory]
columns = 5
cell = 104    # UI units, square
spacing = 6
tabs = [      # Gothic 1-like tabs (F4); each Lua item category in exactly one tab (a test checks it)
    { key = "UI_TAB_WEAPONS", categories = ["melee_1h", "melee_2h", "bow", "crossbow", "ammo"] },
    { key = "UI_TAB_ARMOR", categories = ["armor", "helmet"] },
    { key = "UI_TAB_MAGIC", categories = ["rune", "scroll"] },
    { key = "UI_TAB_ARTIFACTS", categories = ["ring", "amulet", "belt"] },
    { key = "UI_TAB_FOOD", categories = ["food", "potion"] },
    { key = "UI_TAB_DOCUMENTS", categories = ["document"] },
    { key = "UI_TAB_MISC", categories = ["key", "torch", "misc"] },
]

[inventory.hero]
anchor = "right"
offset = [-40, 0]
size = [600, 880]

[inventory.other]
anchor = "left"
offset = [40, 0]
size = [600, 880]

[inventory.title]
anchor = "top"
offset = [0, 22]
size = [-60, 44]

[inventory.tab_bar]
anchor = "top"
offset = [0, 76]
size = [-40, 44]

[inventory.grid]
anchor = "top"
offset = [0, 130]
size = [544, 434]

[inventory.info]
anchor = "bottom"
offset = [0, -64]
size = [-40, 240]

[inventory.footer]
anchor = "bottom_left"
offset = [30, -24]
size = [300, 28]

[inventory.message]
anchor = "bottom_right"
offset = [-30, -24]
size = [300, 28]

[inventory.quantity]
anchor = "center"
size = [520, 220]

