# Ambiente (M13 Teil B): je Name eine Schleife (bei Nacht loop_night) und Einzelklänge um den Hörer (bei Nacht
# randoms_night), alle Namen aus data/sounds.toml. Welche gilt, sagt die Zone vom Typ ambient der Weltdatei (world.md
# „Zonen“; ineinander liegende: die kleinste). Nacht: 20-6 Uhr. Felder: loop, loop_night, randoms, randoms_night,
# interval = [min, max] s zwischen Einzelklängen (8-20), distance = [min, max] m vom Hörer (4-15), fade = s Überblenden (2).

[wald]
loop = "amb_wind"
loop_night = "amb_night"
randoms = ["bird"]
randoms_night = ["owl"]
interval = [6, 16]
distance = [8, 25]

[camp]
loop = "amb_camp"
loop_night = "amb_night"
randoms = ["bird"]
randoms_night = ["owl"]
interval = [10, 25]
distance = [10, 25]

# Dungeon unter dem Schloss (welt #458; Zone ambient "gewoelbe"): Raumrauschen, Tropfen, ab und zu ein Knarren.
# Tag und Nacht gleich (kein Himmel); Platzhalter.
[gewoelbe]
loop = "amb_room"
randoms = ["water_drip", "water_drip", "wood_creak"]
interval = [4, 12]
distance = [3, 12]

# Ebene 3 des Dungeons (welt, Thema „zisterne“): Hall und Wasser an den Stegen, Tropfen in tiefes Wasser und an den
# Wänden. Tag und Nacht gleich; Platzhalter.
[zisterne]
loop = "amb_cistern"
randoms = ["water_drop_deep", "water_drop_deep", "water_drip"]
interval = [3, 9]
distance = [4, 18]

# Ebene 4 des Dungeons (welt, Thema „beinhaus“): trocken und hohl, Wind durch einen Schacht, ab und zu rutschen
# Knochen nach. Tag und Nacht gleich; Platzhalter.
[beinhaus]
loop = "amb_ossuary"
randoms = ["bone_rattle", "bone_rattle", "wood_creak"]
interval = [6, 16]
distance = [3, 12]

# Ebene 5 des Dungeons (welt, Thema „werkstatt“): fern ein tickendes Uhrwerk, Tropfen, knarrendes Gebälk, ab und zu
# fernes Metall. Tag und Nacht gleich; Platzhalter.
[werkstatt]
loop = "amb_workshop"
randoms = ["metal_clang_far", "water_drip", "wood_creak", "wood_creak"]
interval = [4, 12]
distance = [4, 20]

# Ebene 6 des Dungeons (welt, Thema „labyrinth“): dumpf und orientierungslos - leiser Luftzug, Schritte und Schleifen
# irgendwo in den Gängen (große, wechselnde Abstände, damit sie von überall zu kommen scheinen), selten ein Tropfen.
# Tag und Nacht gleich; Platzhalter.
[labyrinth]
loop = "amb_labyrinth"
randoms = ["steps_distant", "steps_distant", "stone_scrape", "water_drip"]
interval = [5, 14]
distance = [6, 24]

# Ebene 7 des Dungeons (welt, Thema „grotte“, Kristallgrotte): weite Höhle mit langem Hall und leise plätscherndem See,
# hallende Tropfen ins Wasser, selten ein leises gläsernes Klingen der Kristalle oder fernes Grollen im Fels.
# Tag und Nacht gleich; Platzhalter.
[grotte]
loop = "amb_grotto"
randoms = ["water_drop_deep", "water_drop_deep", "water_drop_deep", "crystal_ring", "crystal_ring", "rumble_far"]
interval = [3, 10]
distance = [5, 25]

# Ebene 8 des Dungeons (welt, Thema „hort“, Hort der Kellermutter): bedrückend, großes Gewölbe mit nass pulsierender
# Brut und tiefem Grollen, fern klickendes Chitin, tropfender Schleim, selten Grollen im Fels. Tag und Nacht gleich;
# Platzhalter.
[hort]
loop = "amb_hoard"
randoms = ["chitin_click", "chitin_click", "slime_drip", "slime_drip", "rumble_far"]
interval = [3, 9]
distance = [4, 22]

# Leonberg (Zonen von welt: world.md „Zonen“) - feld ist die Vorgabe-Box über die Welt.
[feld]
loop = "amb_field"
loop_night = "amb_night"
randoms = ["bird", "crow"]
randoms_night = ["owl"]
interval = [8, 20]
distance = [10, 30]

[stadt_gasse]
loop = "amb_town"
loop_night = "amb_wind"
randoms = ["dog_bark", "wood_creak"]
randoms_night = ["dog_bark"]
interval = [12, 30]
distance = [8, 20]

[stadt_markt]
loop = "amb_market"
loop_night = "amb_wind"
randoms = ["dog_bark", "bird"]
randoms_night = ["owl"]
interval = [10, 25]
distance = [8, 20]

[schlossgarten]
loop = "amb_field"
loop_night = "amb_night"
randoms = ["bird"]
randoms_night = ["owl"]
interval = [4, 10]
distance = [6, 18]

[ufer]
loop = "amb_water"
randoms = ["frog", "bird"]
randoms_night = ["frog"]
interval = [6, 15]
distance = [5, 15]

[brunnen]
loop = "amb_fountain"

[stadtmauer]
loop = "amb_wind"
randoms = ["crow"]
randoms_night = ["owl"]
interval = [10, 25]
distance = [10, 30]

# Räume: schmiede_esse und gasthaus_stube als eigene ambient-Boxen von welt (kleiner als der Raum: sie gehen vor);
# alle anderen Räume (indoor-Zonen) bekommen „innen“, das Ambiente von draußen leise und gedämpft dahinter.
[schmiede_esse]
loop = "amb_fire"
randoms = ["anvil_hit"]
interval = [6, 14]
distance = [1, 3]

[gasthaus_stube]
loop = "amb_tavern"
randoms = ["mug_clink", "wood_creak"]
interval = [5, 12]
distance = [2, 5]

[innen]
loop = "amb_room"
randoms = ["wood_creak"]
interval = [15, 40]
distance = [1, 4]

# Schloss (welt W7 D1b, #447): Keller und Küche; Platzhalter-Klänge, bis eigene da sind.
[keller_gewoelbe]
loop = "amb_room"
randoms = ["wood_creak"]
interval = [20, 45]
distance = [3, 8]

[keller_luftzug]
loop = "amb_wind"
randoms = ["wood_creak"]
interval = [15, 35]
distance = [2, 6]

[schloss_kueche]
loop = "amb_fire"
randoms = ["mug_clink", "wood_creak"]
interval = [6, 15]
distance = [1, 4]