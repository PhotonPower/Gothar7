# Klänge (M13 Teil A, ADR 0007): Name -> Dateien (eine zufällig), Lautstärke, Streuung, Reichweite, Bus.
# Die Namen sind die der Anim-Events `sound:<name>` (figuren) und der Sprüche (sounds = { cast, impact }).
# Alle Dateien sind vorerst Platzhalter aus tools/audio (Entscheidung Projektinhaber); echte Klänge ersetzen sie unter
# gleichem Namen. Felder: files, volume (1), volume_jitter, pitch_jitter (Anteil), min_distance (1 m),
# max_distance (30 m; ab da still), bus (music, effects, voice, ambient, ui; Vorgabe effects), loop.

[anvil_hit]
files = ["sounds/anvil_hit.wav"]
volume = 0.8
pitch_jitter = 0.06
max_distance = 30

[wood_chop]
files = ["sounds/wood_chop.wav"]
volume = 0.8
pitch_jitter = 0.08
max_distance = 25

[schinder_call]
files = ["sounds/schinder_call.wav"]
pitch_jitter = 0.08
max_distance = 60

[quaderbuckel_grind]
