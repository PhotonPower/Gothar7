# Mobs: user slots and clips per mob type (contract characters-pipeline.md §3.1; engine reads it in M8 C).
# Owned by engine; figuren maintains the slots (welt may propose values, the sizes belong to its models).
# Axes: Y up, mob origin on the ground, the front of the mob faces +Z. A slot is the foot point of the
# figure in mob metres (`pos`) and its horizontal view direction (`facing`). Clips live in
# characters/anims/human/mob.glb (set "mob") – names without the "mob/<type>/" prefix; empty = none.
# Test sizes: chest 0.9 x 0.6 x 0.6 m, anvil working height 0.8 m, bed 2.0 x 0.9 m (lying surface 0.45 m),
# door handle 1.0 m, bench seat 0.45 m high, 0.35 m deep, 1.5 m long. The bed runs along X, long side
# to +Z, head end (Kopfende) at -X: the figure lies along X with its head at -X (to the left seen from
# the slot).
version = 1

[mobs.chest]
clips = "mob/chest"
enter = "t_open"
loop = "s_open"
leave = "t_close"
extra = { picklock = "s_picklock" }
[[mobs.chest.slots]]
name = "front"
pos = [0.0, 0.0, 0.65]       # 0.35 m in front of the chest (front face at z = 0.3)
facing = [0.0, 0.0, -1.0]

[mobs.anvil]
clips = "mob/anvil"
enter = "t_start"
loop = "s_work"
leave = "t_stop"
[[mobs.anvil.slots]]
name = "front"
pos = [0.0, 0.0, 0.6]
facing = [0.0, 0.0, -1.0]

[mobs.bed]
clips = "mob/bed"            # t_lie_down / t_stand_up carry root motion onto the bed and back
enter = "t_lie_down"
loop = "s_lie"
leave = "t_stand_up"
[[mobs.bed.slots]]
name = "side"
pos = [0.0, 0.0, 0.75]       # beside the bed (long side faces +Z, depth 0.9 m; head end -X)
facing = [0.0, 0.0, -1.0]

[mobs.bench]
clips = "mob/bench"          # sitting down, sitting, standing up; no root motion (the pelvis moves back)
enter = "t_sit"
loop = "s_sit"
leave = "t_stand"
[[mobs.bench.slots]]
name = "front"
pos = [0.0, 0.0, 0.38]       # test bench: seat height 0.45, depth 0.35, length 1.5 m; the pelvis lands
facing = [0.0, 0.0, 1.0]     # 0.33 m behind the feet; the figure faces away from the bench (facing is
                             # its view direction, not necessarily towards the mob)

[mobs.door]
clips = "mob/door"           # one clip opens and closes; the door stays as it is between uses
enter = "t_open"
loop = ""
leave = ""
[[mobs.door.slots]]
name = "front"
pos = [0.5, 0.0, 0.6]        # door blade from the hinge (origin) along +X, ~1.0 m wide
facing = [0.0, 0.0, -1.0]
[[mobs.door.slots]]
name = "back"
pos = [0.5, 0.0, -0.6]
facing = [0.0, 0.0, 1.0]

[mobs.table]                 # welt's table (#197): top 1.6 x 0.8 m, 0.75 m high; benches with their middle at
clips = "mob/bench"          # z = +-0.62 m. Sitting at the table with the bench clips: the pelvis lands 0.33 m
enter = "t_sit"              # behind the feet, so the feet stand at z = +-0.29, facing the middle (the knees pass
loop = "s_sit"               # under the top while sitting down - a placeholder until a clip of its own)
leave = "t_stand"
[[mobs.table.slots]]
name = "front_left"
pos = [-0.4, 0.0, 0.29]
facing = [0.0, 0.0, -1.0]
[[mobs.table.slots]]
name = "front_right"
pos = [0.4, 0.0, 0.29]
facing = [0.0, 0.0, -1.0]
[[mobs.table.slots]]
name = "back_left"
pos = [-0.4, 0.0, -0.29]
facing = [0.0, 0.0, 1.0]
[[mobs.table.slots]]
name = "back_right"
pos = [0.4, 0.0, -0.29]
facing = [0.0, 0.0, 1.0]
