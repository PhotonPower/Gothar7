# Tag und Nacht (world.md „Spielzeit & Umgebung“): Schlüsselbilder je Uhrzeit, zyklisch und weich
# interpoliert. Farben in sRGB 0..1 (wie aus einer Farbwahl), Stärken linear. Werte sind Spielgefühl –
# Abnahme durch den Projektinhaber (M4): Nacht und Morgen so; Mittagsdunst reduziert.
#   sun_*/moon_*      Richtungslicht (tagsüber Sonne, nachts Mond, mit Schatten)
#   ambient_sky/_ground  Umgebungslicht von oben/unten
#   fog_color         Nebel und Horizont des Himmels (gleich, damit Fernes in den Himmel übergeht)
#   fog_density       Faktor auf [render] fog_density (Morgendunst > 1)
#   sky_zenith        Himmel senkrecht oben; stars 0..1
version = 1

[indoor]              # Räume (Zonen vom Typ indoor, world.md „Zonen“): Umgebungslicht drinnen = Faktor mal draußen,
ambient = 0.35        # je Fläche (die Straße bleibt hell, der Raum von draußen dunkel); Spielgefühl, Projektinhaber

[orbit]
sunrise = 6.0         # Uhr
sunset = 18.5
noon_elevation = 55.0 # Grad über dem Südhorizont
moon_elevation = 40.0 # Grad, um Mitternacht

# Reserviert (M17): Überschreibungen je Zone bzw. Welt, z. B. [zone.hoehle] mit eigenen [[zone.hoehle.key]].
# Noch ohne Wirkung.
