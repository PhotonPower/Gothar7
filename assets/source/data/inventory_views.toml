# Inventory cell views (M14) - proposal, contract figuren -> engine: docs/modules/ui.md "Inventar-Ansichten".
# Every item model is shown as a 3D model in its cell, centred on its projected contour. The view of a
# model: [default] <- [category.<c>] <- [model."<mesh>"], field by field. <c> = the model's own
# `category` if it has one, else the Lua item's category; <mesh> = the Lua `mesh` path.
#   yaw   degrees about the item's own +Y (grip axis); 90 turns its +X side (the flat of a blade)
#         towards the viewer and its +Z (edge, front) to the right
#   pitch degrees about the view X axis; positive tilts the top towards the viewer (seen from above)
#   roll  degrees in the image plane, positive counter-clockwise; -45 = diagonal, tip upper right
#   fill  share of the cell the model's projected contour (all LOD 0 vertices) takes in its
#         larger direction (version 2; version 1 measured the front of the rotated bounding box)
# Order: R = Rz(roll) * Rx(pitch) * Ry(yaw). Reference implementation: tools/chargen inventory.py;
# review sheet: gothar-chargen inventory-sheet.
version = 2

[camera]
fov = 30.0 # degrees, square cell, perspective; camera on view +Z looking down -Z

[default]
yaw = 25.0
pitch = 15.0
roll = 0.0
fill = 0.75

# --- per category (all Lua item categories; armor, helmet, belt have no item model yet) ----------

