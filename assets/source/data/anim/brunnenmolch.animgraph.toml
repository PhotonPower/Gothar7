# Animations-Zustandsautomat: Brunnenmolch (Dungeon; figuren #472): blinder Riesen-Höhlenmolch, schwimmt nicht
# (Projektinhaber 2026-11-24): lauert flach, halb untergetaucht im seichten Wasser (s_dormant). Muster wie
# mauerkriecher.animgraph.toml:
#   dormant  Ruhe-Schleife solange gesetzt (bool, zs_dormant)
#   action   5 Auftauchen (t_wake, Event splash), 12 nach oben schnappen (t_snap_up), 13 zurücksinken
#            (t_submerge), 14 lauschen (t_listen)
version = 1
sets = ["characters/monsters/brunnenmolch/anims/brunnenmolch.glb"]
start = "move"

[look_at] # Kopf zum Ziel (Spieler, Beute)
bones = ["neck_01", "head"]
shares = [0.4, 0.6]
max_yaw = 60.0
max_pitch = 30.0

# --- Zustände ---
[[state]]
name = "move"
blend = "speed"
root_motion = true
points = [
    { value = 0.0, clip = "brunnenmolch/s_idle" },
    { value = 0.6, clip = "brunnenmolch/s_walk" },
    { value = 1.8, clip = "brunnenmolch/s_run" },
]

[[state]]
name = "turn_l"
clip = "brunnenmolch/t_turn_l"
root_motion = true

[[state]]
name = "turn_r"
clip = "brunnenmolch/t_turn_r"
root_motion = true

[[state]]
name = "attack_1"
clip = "brunnenmolch/t_attack_1"

[[state]]
name = "attack_2"
clip = "brunnenmolch/t_attack_2"

[[state]]
name = "hit"
clip = "brunnenmolch/t_hit"

[[state]]
name = "threaten"
clip = "brunnenmolch/t_threaten"

[[state]]
name = "eat"
clip = "brunnenmolch/s_eat"

[[state]]
name = "sleep"
clip = "brunnenmolch/s_sleep"

[[state]] # bleibt am Ende liegen
name = "die"
clip = "brunnenmolch/t_die"

[[state]] # Ruhe (zs_dormant): flach, halb untergetaucht im seichten Wasser
name = "dormant"
clip = "brunnenmolch/s_dormant"

[[state]]
name = "wake"
clip = "brunnenmolch/t_wake"

[[state]] # schnappt am Ort senkrecht nach oben (Held auf dem Steg; Treffer an socket_mouth)
name = "snap_up"
clip = "brunnenmolch/t_snap_up"

[[state]] # sinkt zurück ins Wasser (endet in der Ruhe-Pose)
name = "submerge"
clip = "brunnenmolch/t_submerge"

[[state]] # blind: hebt den Kopf und lauscht
name = "listen"
clip = "brunnenmolch/t_listen"

# --- Übergänge (Reihenfolge = Vorrang) ---
[[transition]]
from = "*"
to = "die"
when = ["dead"]
blend = 0.1

[[transition]]
from = "*"
to = "hit"
when = ["action == 3", "!dead"]
blend = 0.05

[[transition]]
from = "*"
to = "attack_1"
when = ["action == 1", "!dead"]
blend = 0.1

[[transition]]
from = "*"
to = "attack_2"
when = ["action == 2", "!dead"]
blend = 0.1

[[transition]]
from = "*"
to = "threaten"
when = ["action == 4", "!dead"]
blend = 0.15

[[transition]]
from = "*"
to = "wake"
when = ["action == 5", "!dead"]
blend = 0.1

[[transition]]
from = "*"
to = "snap_up"
when = ["action == 12", "!dead"]
blend = 0.1

[[transition]]
from = "*"
to = "submerge"
when = ["action == 13", "!dead"]
blend = 0.2

[[transition]]
from = "*"
to = "listen"
when = ["action == 14", "!dead"]
blend = 0.2

[[transition]]
from = "submerge"
to = "dormant"
when = ["end", "dormant"]
blend = 0.2

[[transition]]
from = "move"
to = "dormant"
when = ["dormant"]
blend = 0.5

[[transition]]
from = "dormant"
to = "move"
when = ["!dormant"]
blend = 0.3

[[transition]]
from = "move"
to = "eat"
when = ["eat"]
blend = 0.3

[[transition]]
from = "move"
to = "sleep"
when = ["sleep"]
blend = 0.5

[[transition]]
from = "eat"
to = "move"
when = ["!eat"]
blend = 0.3

[[transition]]
from = "sleep"
to = "move"
when = ["!sleep"]
blend = 0.5

[[transition]]
from = "move"
to = "turn_l"
when = ["turn < -0.5"]
blend = 0.15

[[transition]]
from = "move"
to = "turn_r"
when = ["turn > 0.5"]
blend = 0.15

# Einmal-Aktionen und Drehungen: zurück zur Fortbewegung
[[transition]]
from = "turn_l"
to = "move"
when = ["end"]
blend = 0.15

[[transition]]
from = "turn_r"
to = "move"
when = ["end"]
blend = 0.15

[[transition]]
from = "attack_1"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "attack_2"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "hit"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "threaten"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "wake"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "snap_up"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "submerge"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "listen"
to = "move"
when = ["end"]
blend = 0.2
