# Animations-Zustandsautomat: Kellermutter (Dungeon-Boss; figuren #471): Stammmutter der Mauerkriecher, kauert über
# dem Hort (s_dormant). Muster wie mauerkriecher.animgraph.toml:
#   dormant  Ruhe-Schleife solange gesetzt (bool, zs_dormant); guard: über dem Schatz (s_guard, Phase 3)
#   action   5 Erwachen (t_wake), 9 Rufen (t_call: Event spawn_brood), 10 Phasenwechsel (t_rage),
#            11 Taumeln (t_stagger: schwerer Treffer auf die offene Schwachstelle)
# Noch nicht verwendet: t_scythe_l/r (Sensenhiebe von der Seite).
version = 1
sets = ["characters/monsters/kellermutter/anims/kellermutter.glb"]
start = "move"

[look_at] # Kopf zum Ziel (Spieler, Beute)
bones = ["neck_01", "head"]
shares = [0.4, 0.6]
max_yaw = 60.0
max_pitch = 30.0

# --- Zustände ---
[[state]]
name = "move"
blend = "speed"
root_motion = true
points = [
    { value = 0.0, clip = "kellermutter/s_idle" },
    { value = 0.6, clip = "kellermutter/s_walk" },
    { value = 1.5, clip = "kellermutter/s_run" },
]

[[state]]
name = "turn_l"
clip = "kellermutter/t_turn_l"
root_motion = true

[[state]]
name = "turn_r"
clip = "kellermutter/t_turn_r"
root_motion = true

[[state]]
name = "attack_1"
clip = "kellermutter/t_attack_1"

[[state]]
name = "attack_2"
clip = "kellermutter/t_attack_2"

[[state]]
name = "hit"
clip = "kellermutter/t_hit"

[[state]]
name = "threaten"
clip = "kellermutter/t_threaten"

[[state]]
name = "eat"
clip = "kellermutter/s_eat"

[[state]]
name = "sleep"
clip = "kellermutter/s_sleep"

[[state]] # bleibt am Ende liegen
name = "die"
clip = "kellermutter/t_die"

[[state]] # Ruhe (zs_dormant): über dem Hort gekauert
name = "dormant"
clip = "kellermutter/s_dormant"

[[state]]
name = "wake"
clip = "kellermutter/t_wake"

[[state]] # ruft die Brut aus den Wänden: Event spawn_brood
name = "call"
clip = "kellermutter/t_call"

[[state]] # Phasenwechsel
name = "rage"
clip = "kellermutter/t_rage"

[[state]] # schwerer Treffer auf die offene Schwachstelle
name = "stagger"
clip = "kellermutter/t_stagger"

[[state]] # über dem Schatz (Phase 3), solange gesetzt
name = "guard"
clip = "kellermutter/s_guard"

# --- Übergänge (Reihenfolge = Vorrang) ---
[[transition]]
from = "*"
to = "die"
when = ["dead"]
blend = 0.1

[[transition]]
from = "*"
to = "hit"
when = ["action == 3", "!dead"]
blend = 0.05

[[transition]]
from = "*"
to = "attack_1"
when = ["action == 1", "!dead"]
blend = 0.1

[[transition]]
from = "*"
to = "attack_2"
when = ["action == 2", "!dead"]
blend = 0.1

[[transition]]
from = "*"
to = "threaten"
when = ["action == 4", "!dead"]
blend = 0.15

[[transition]]
from = "*"
to = "wake"
when = ["action == 5", "!dead"]
blend = 0.1

[[transition]]
from = "*"
to = "stagger"
when = ["action == 11", "!dead"]
blend = 0.05

[[transition]]
from = "*"
to = "rage"
when = ["action == 10", "!dead"]
blend = 0.1

[[transition]]
from = "*"
to = "call"
when = ["action == 9", "!dead"]
blend = 0.15

[[transition]]
from = "move"
to = "guard"
when = ["guard"]
blend = 0.4

[[transition]]
from = "guard"
to = "move"
when = ["!guard"]
blend = 0.3

[[transition]]
from = "move"
to = "dormant"
when = ["dormant"]
blend = 0.5

[[transition]]
from = "dormant"
to = "move"
when = ["!dormant"]
blend = 0.3

[[transition]]
from = "move"
to = "eat"
when = ["eat"]
blend = 0.3

[[transition]]
from = "move"
to = "sleep"
when = ["sleep"]
blend = 0.5

[[transition]]
from = "eat"
to = "move"
when = ["!eat"]
blend = 0.3

[[transition]]
from = "sleep"
to = "move"
when = ["!sleep"]
blend = 0.5

[[transition]]
from = "move"
to = "turn_l"
when = ["turn < -0.5"]
blend = 0.15

[[transition]]
from = "move"
to = "turn_r"
when = ["turn > 0.5"]
blend = 0.15

# Einmal-Aktionen und Drehungen: zurück zur Fortbewegung
[[transition]]
from = "turn_l"
to = "move"
when = ["end"]
blend = 0.15

[[transition]]
from = "turn_r"
to = "move"
when = ["end"]
blend = 0.15

[[transition]]
from = "attack_1"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "attack_2"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "hit"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "threaten"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "wake"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "call"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "rage"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "stagger"
to = "move"
when = ["end"]
blend = 0.2
