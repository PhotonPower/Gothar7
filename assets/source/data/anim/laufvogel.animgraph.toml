# Animations-Zustandsautomat: Laufvogel (M6 Teil D3; Rig und Clips characters-pipeline.md §7.1, Platzhalter).
# Gleiches Muster für alle Tiere; Verhalten (wann es geht, angreift ...) setzt mit M9 die KI über die Parameter:
#   speed   vorwärts in m/s (Blend Stand/Gehen/Rennen; die Punkte sind die Eigengeschwindigkeiten der Clips)
#   turn    -1 links / 1 rechts (Drehen am Ort)
#   action  einen Schritt lang: 1 Angriff 1, 2 Angriff 2, 3 Treffer, 4 Drohen
#   eat, sleep  Schleifen solange gesetzt (bool)        dead  stirbt und bleibt liegen (bool)
# Gehen, Rennen und Drehen bewegen die Figur über die Root Motion des Clips (Vertrag §7.1).
version = 1
sets = ["characters/monsters/laufvogel/anims/laufvogel.glb"]
start = "move"

[look_at] # Kopf zum Ziel (Spieler, Beute)
bones = ["neck_01", "head"]
shares = [0.4, 0.6]
max_yaw = 60.0
max_pitch = 30.0

# --- Zustände ---
[[state]]
name = "move"
blend = "speed"
root_motion = true
points = [
    { value = 0.0, clip = "laufvogel/s_idle" },
    { value = 1.30, clip = "laufvogel/s_walk" },
    { value = 6.50, clip = "laufvogel/s_run" },
]

[[state]]
name = "turn_l"
clip = "laufvogel/t_turn_l"
root_motion = true

[[state]]
name = "turn_r"
clip = "laufvogel/t_turn_r"
root_motion = true

[[state]]
name = "attack_1"
clip = "laufvogel/t_attack_1"

[[state]]
name = "attack_2"
clip = "laufvogel/t_attack_2"

[[state]]
name = "hit"
clip = "laufvogel/t_hit"

[[state]]
name = "threaten"
clip = "laufvogel/t_threaten"

[[state]]
name = "eat"
clip = "laufvogel/s_eat"

[[state]]
name = "sleep"
clip = "laufvogel/s_sleep"

[[state]] # bleibt am Ende liegen
name = "die"
clip = "laufvogel/t_die"

# --- Übergänge (Reihenfolge = Vorrang) ---
[[transition]]
from = "*"
to = "die"
when = ["dead"]
blend = 0.1

[[transition]]
from = "*"
to = "hit"
when = ["action == 3", "!dead"]
blend = 0.05

[[transition]]
from = "*"
to = "attack_1"
when = ["action == 1", "!dead"]
blend = 0.1

[[transition]]
from = "*"
to = "attack_2"
when = ["action == 2", "!dead"]
blend = 0.1

[[transition]]
from = "*"
to = "threaten"
when = ["action == 4", "!dead"]
blend = 0.15

[[transition]]
from = "move"
to = "eat"
when = ["eat"]
blend = 0.3

[[transition]]
from = "move"
to = "sleep"
when = ["sleep"]
blend = 0.5

[[transition]]
from = "eat"
to = "move"
when = ["!eat"]
blend = 0.3

[[transition]]
from = "sleep"
to = "move"
when = ["!sleep"]
blend = 0.5

[[transition]]
from = "move"
to = "turn_l"
when = ["turn < -0.5"]
blend = 0.15

[[transition]]
from = "move"
to = "turn_r"
when = ["turn > 0.5"]
blend = 0.15

# Einmal-Aktionen und Drehungen: zurück zur Fortbewegung
[[transition]]
from = "turn_l"
to = "move"
when = ["end"]
blend = 0.15

[[transition]]
from = "turn_r"
to = "move"
when = ["end"]
blend = 0.15

[[transition]]
from = "attack_1"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "attack_2"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "hit"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "threaten"
to = "move"
when = ["end"]
blend = 0.2
