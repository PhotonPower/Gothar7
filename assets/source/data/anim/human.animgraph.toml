# --- Übergänge (Reihenfolge = Vorrang) ---
[[transition]] # Klettern hat Vorrang vor allem
from = "*"
to = "climb_low"
when = ["climb == 1"]
blend = 0.1

[[transition]]
from = "*"
to = "climb_mid"
when = ["climb == 2"]
blend = 0.1

[[transition]]
from = "*"
to = "climb_high"
when = ["climb == 3"]
blend = 0.1

[[transition]]
from = "*"
to = "dive"
when = ["dive"]
blend = 0.4

[[transition]]
from = "*"
to = "swim"
when = ["swim"]
blend = 0.3

[[transition]]
from = "*"
to = "slide"
when = ["slide"]
blend = 0.2

[[transition]] # Waffe ziehen und wegstecken
from = "move"
to = "draw_1h"
when = ["weapon == 1"]
blend = 0.15

[[transition]]
from = "draw_1h"
to = "move_1h"
when = ["end"]
blend = 0.2

[[transition]]
from = "move"
to = "draw_fist"
when = ["weapon == 2"]
blend = 0.15

[[transition]]
from = "draw_fist"
to = "move_fist"
when = ["end"]
blend = 0.2

[[transition]]
from = "move_1h"
to = "sheath_1h"
when = ["weapon < 0.5"]
blend = 0.15

[[transition]]
from = "sheath_1h"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "move_fist"
to = "sheath_fist"
when = ["weapon < 0.5"]
blend = 0.15

[[transition]]
from = "sheath_fist"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "move"
to = "pickup"
when = ["pickup"]
blend = 0.2

[[transition]] # Ende des Kletterns, Schwimmens, Rutschens, Aufhebens
from = "pickup"
to = "move"
when = ["end"]
blend = 0.25

[[transition]]
from = "climb_low"
to = "move"
when = ["end"]
blend = 0.15

[[transition]]
from = "climb_mid"
to = "move"
when = ["end"]
blend = 0.15

[[transition]]
from = "climb_high"
to = "move"
when = ["end"]
blend = 0.15

[[transition]]
from = "swim"
to = "move"
when = ["!swim", "!dive"]
blend = 0.3

[[transition]]
from = "dive"
to = "swim"
when = ["!dive"]
blend = 0.4

[[transition]]
from = "slide"
to = "move"
when = ["!slide"]
blend = 0.2

# Springen und Fallen
[[transition]]
from = "move"
to = "jump_run"
when = ["jump", "speed > 3.0"]
blend = 0.1

[[transition]]
from = "move"
to = "jump"
when = ["jump"]
blend = 0.1

[[transition]]
from = "sneak"
to = "jump"
when = ["jump"]
blend = 0.1

[[transition]] # von einer Kante gelaufen: kurze Stufen ohne Sprunghaltung
from = "move"
to = "airborne"
when = ["air > 0.25"]
blend = 0.2

[[transition]]
from = "sneak"
to = "airborne"
when = ["air > 0.25"]
blend = 0.2

[[transition]]
from = "jump"
to = "airborne"
when = ["air", "end"]
blend = 0.15

[[transition]]
from = "jump_run"
to = "airborne"
when = ["air", "end"]
blend = 0.15

[[transition]]
from = "airborne"
to = "fall"
when = ["fall > 0.8"]
blend = 0.3

[[transition]]
from = "fall"
to = "land_hard"
when = ["landed", "hard"]
blend = 0.05

[[transition]] # kleine Stufen und Absätze ohne Landeanimation
from = "*"
to = "land"
when = ["landed > 0.3"]
blend = 0.05

[[transition]]
from = "land"
to = "move"
when = ["end"]
blend = 0.15

[[transition]]
from = "land_hard"
to = "move"
when = ["end"]
blend = 0.2

# Am Boden: schleichen, seitwärts, drehen, zurück zur Fortbewegung
[[transition]]
from = "move"
to = "sneak"
when = ["sneak"]
blend = 0.25

[[transition]]
from = "sneak"
to = "move"
when = ["!sneak"]
blend = 0.25

[[transition]]
from = "move"
to = "strafe_l"
when = ["strafe < -0.1"]
blend = 0.15

[[transition]]
from = "move"
to = "strafe_r"
when = ["strafe > 0.1"]
blend = 0.15

[[transition]]
from = "strafe_l"
to = "move"
when = ["strafe > -0.1"]
blend = 0.15

[[transition]]
from = "strafe_r"
to = "move"
when = ["strafe < 0.1"]
blend = 0.15

[[transition]]
from = "move"
to = "turn_l"
when = ["turn < -0.5", "speed < 0.1", "speed > -0.1"]
blend = 0.1

[[transition]]
from = "move"
to = "turn_r"
when = ["turn > 0.5", "speed < 0.1", "speed > -0.1"]
blend = 0.1

[[transition]]
from = "turn_l"
to = "move"
when = ["end"]
blend = 0.1

[[transition]]
from = "turn_r"
to = "move"
when = ["end"]
blend = 0.1

[[transition]]
from = "turn_l"
to = "move"
when = ["speed > 0.1"]
blend = 0.15

[[transition]]
from = "turn_r"
to = "move"
when = ["speed > 0.1"]
blend = 0.15
