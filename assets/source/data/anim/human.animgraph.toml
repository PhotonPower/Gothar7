# Animations-Zustandsautomat der Menschen (animation.md „Zustandsautomat“, M6). Clips: characters-pipeline.md §3,
# animation-list.md. Parameter setzt das Gameplay je Schritt:
#   speed   vorwärts in m/s (rückwärts negativ)    strafe  seitwärts in m/s (rechts positiv)
#   turn    -1 links / 1 rechts (Drehen im Stand, Tasten)   jump  Absprung (bool, einen Schritt)
#   air     s in der Luft (0 am Boden)              fall    s im freien Fall (sinkend)
#   landed  Fallhöhe der Landung in m (einen Schritt, sonst 0)   hard  die Landung kostete LP (bool, mit landed)
#   climb   Kantenklasse 1/2/3 (0 = nicht)
#   swim    an der Oberfläche (bool)                dive    unter Wasser (bool)        slide  rutscht (bool)
#   pickup  hebt einen Gegenstand auf (bool, bis das Event „pickup“ ihn genommen hat; M8)
#   weapon  gezogene Waffe: 0 keine, 1 Einhandwaffe, 2 Fäuste (M9 Teil C)
# Übergänge: erster passender in Dateireihenfolge; Bedingungen: "name", "!name", "name > 1.5", "end".
version = 1
sets = [
    "characters/anims/human/none.glb",
    "characters/anims/human/swim.glb",
    "characters/anims/human/dive.glb",
    "characters/anims/human/mob.glb",
    "characters/anims/human/amb.glb",
    "characters/anims/human/1h.glb",
    "characters/anims/human/fist.glb",
]
start = "move"
# Abspielrate = Parameter / Eigengeschwindigkeit der Clips (`speed` in <set>.events.toml), damit die Füße nicht
# gleiten; Zustände mit `rate = "<parameter>"`. Grenzen:
rate_range = [0.6, 2.0] # 2,0: Seitwärts (2 m/s, Clip 1 m/s) ohne Gleiten (Koordinator 2026-10-03)

[face] # Gesicht (Morph-Targets characters-pipeline.md §6.1)
blink_min = 2.0           # s zwischen zwei Lidschlägen, zufällig zwischen min und max
blink_max = 6.0
blink_seconds = 0.15      # Schließen und Öffnen zusammen
visemes_per_second = 8.0  # Mundformen beim Sprechen (grob, bis Lippensynchronisation mit M13)
talk_weight = 0.8
expression_seconds = 0.3  # Ein- und Ausblenden von Ausdrücken

[look_at] # Kopf zum Ziel (Gesprächspartner): Anteile der Drehung je Knochen, Grenzen in Grad
bones = ["neck", "head"]
shares = [0.4, 0.6]
max_yaw = 70.0
max_pitch = 35.0
behind = 40.0             # Ziel weiter hinten als max_yaw + behind: Kopf zurück zur Mitte
degrees_per_second = 240.0

# --- Zustände ---
[[state]] # Fortbewegung: rückwärts, Stand, gehen, rennen nach der Geschwindigkeit
name = "move"
blend = "speed"
rate = "speed"
points = [
    { value = -1.4, clip = "none/s_walk_back" },
    { value = 0.0, clip = "none/s_idle" },
    { value = 1.6, clip = "none/s_walk" },
    { value = 4.0, clip = "none/s_run" },
]

[[state]] # mit gezogener Einhandwaffe (M9 Teil C; Kampf mit M11)
name = "move_1h"
blend = "speed"
rate = "speed"
points = [
    { value = -1.4, clip = "1h/s_walk_back" },
    { value = 0.0, clip = "1h/s_idle" },
    { value = 1.6, clip = "1h/s_walk" },
    { value = 4.0, clip = "1h/s_run" },
]

[[state]] # mit erhobenen Fäusten
name = "move_fist"
blend = "speed"
rate = "speed"
points = [
    { value = -1.4, clip = "fist/s_walk_back" },
    { value = 0.0, clip = "fist/s_idle" },
    { value = 1.6, clip = "fist/s_walk" },
    { value = 4.0, clip = "fist/s_run" },
]

[[state]] # Waffe ziehen bzw. wegstecken (figuren: Events draw/sheath, dort erscheint bzw. verschwindet sie)
name = "draw_1h"
clip = "1h/t_draw"

[[state]]
name = "sheath_1h"
clip = "1h/t_sheath"

[[state]]
name = "draw_fist"
clip = "fist/t_draw"

[[state]]
name = "sheath_fist"
clip = "fist/t_sheath"

[[state]]
name = "sneak"
blend = "speed"
rate = "speed"
points = [{ value = 0.0, clip = "none/s_idle" }, { value = 1.1, clip = "none/s_sneak" }]

[[state]]
name = "strafe_l"
clip = "none/s_strafe_l"
rate = "strafe"

[[state]]
name = "strafe_r"
clip = "none/s_strafe_r"
rate = "strafe"

[[state]] # Drehen im Stand wie Gothic (Entscheidung Projektinhaber)
name = "turn_l"
clip = "none/t_turn_l"

[[state]]
name = "turn_r"
clip = "none/t_turn_r"

[[state]]
name = "jump"
clip = "none/t_jump_start"

[[state]]
name = "jump_run"
clip = "none/t_jump_run"

[[state]]
name = "airborne"
clip = "none/s_jump_air"

[[state]]
name = "fall"
clip = "none/s_fall"

[[state]]
name = "land"
clip = "none/t_jump_land"
speed = 1.5

[[state]]
name = "land_hard"
clip = "none/t_fall_land_hard"

[[state]] # Klettern: der Clip bewegt die Figur (root motion, auf die Kante skaliert)
name = "climb_low"
clip = "none/t_climb_low"
root_motion = true

[[state]]
name = "climb_mid"
clip = "none/t_climb_mid"
root_motion = true

[[state]]
name = "climb_high"
clip = "none/t_climb_high"
root_motion = true

[[state]]
name = "slide"
clip = "none/s_slide"

[[state]] # Aufheben (M8): das Event „pickup“ nimmt den Gegenstand, am Ende zurück in die Fortbewegung
name = "pickup"
clip = "none/t_pickup_ground"

# Benutzen und Taschendiebstahl (M8 Teil D): die Engine schaltet diese Zustände selbst, Event „use“ = Wirkung.
[[state]]
name = "use_eat"
clip = "none/t_eat"

[[state]]
name = "use_drink"
clip = "none/t_drink"

[[state]]
name = "use_read"
clip = "none/t_read_scroll"

[[state]]
name = "pickpocket"
clip = "none/t_pickpocket"

# Mobs (M8 Teil C): Die Engine schaltet diese Zustände selbst (<typ>_enter/_loop/_leave/_<extra>, Clips nach
# data/mobs.toml); ohne Übergänge, am Ende geht es zurück nach „move“.
[[state]]
name = "chest_enter"
clip = "mob/chest/t_open"

[[state]]
name = "chest_loop"
clip = "mob/chest/s_open"

[[state]]
name = "chest_leave"
clip = "mob/chest/t_close"

[[state]]
name = "chest_picklock"
clip = "mob/chest/s_picklock"

[[state]]
name = "door_enter"
clip = "mob/door/t_open"

[[state]] # Amboss (C2): hit_anvil je Schlag
name = "anvil_enter"
clip = "mob/anvil/t_start"

[[state]]
name = "anvil_loop"
clip = "mob/anvil/s_work"

[[state]]
name = "anvil_leave"
clip = "mob/anvil/t_stop"

[[state]] # Bett (C2): die Clips tragen die Figur aufs Bett (Wurzel im Clip) und zurück
name = "bed_enter"
clip = "mob/bed/t_lie_down"

[[state]]
name = "bed_loop"
clip = "mob/bed/s_lie"

[[state]]
name = "bed_leave"
clip = "mob/bed/t_stand_up"

[[state]]
name = "swim"
blend = "speed"
rate = "speed"
points = [
    { value = -0.9, clip = "swim/s_back" },
    { value = 0.0, clip = "swim/s_idle" },
    { value = 1.6, clip = "swim/s_forward" },
]

[[state]]
name = "dive"
blend = "speed"
rate = "speed"
points = [{ value = 0.0, clip = "dive/s_idle" }, { value = 1.6, clip = "dive/s_forward" }]

