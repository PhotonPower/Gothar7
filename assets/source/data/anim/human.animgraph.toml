# Animations-Zustandsautomat der Menschen (animation.md „Zustandsautomat“, M6). Clips: characters-pipeline.md §3,
# animation-list.md. Parameter setzt das Gameplay je Schritt:
#   speed   vorwärts in m/s (rückwärts negativ)    strafe  seitwärts in m/s (rechts positiv)
#   turn    -1 links / 1 rechts (Drehen im Stand, Tasten)   jump  Absprung (bool, einen Schritt)
#   air     s in der Luft (0 am Boden)              fall    s im freien Fall (sinkend)
#   landed  Fallhöhe der Landung in m (einen Schritt, sonst 0)   hard  die Landung kostete LP (bool, mit landed)
#   climb   Kantenklasse 1/2/3 (0 = nicht)
#   swim    an der Oberfläche (bool)                dive    unter Wasser (bool)        slide  rutscht (bool)
#   pickup  hebt einen Gegenstand auf (bool, bis das Event „pickup“ ihn genommen hat; M8)
#   weapon  gezogene Waffe: 0 keine, 1 Einhand, 2 Fäuste (M9 Teil C), 3 Bogen, 4 Armbrust, 5 Zweihand, 6 Magie
# Übergänge: erster passender in Dateireihenfolge; Bedingungen: "name", "!name", "name > 1.5", "end".
version = 1
sets = [
    "characters/anims/human/none.glb",
    "characters/anims/human/swim.glb",
    "characters/anims/human/dive.glb",
    "characters/anims/human/mob.glb",
    "characters/anims/human/amb.glb",
    "characters/anims/human/1h.glb",
    "characters/anims/human/fist.glb",
    "characters/anims/human/2h.glb",
    "characters/anims/human/bow.glb",
    "characters/anims/human/cbow.glb",
    "characters/anims/human/mag.glb",
    "characters/anims/human/torch.glb",
    "characters/anims/human/gait.glb",
    "characters/anims/human/dlg.glb",
]
start = "move"
# Abspielrate = Parameter / Eigengeschwindigkeit der Clips (`speed` in <set>.events.toml), damit die Füße nicht
# gleiten; Zustände mit `rate = "<parameter>"`. Grenzen:
rate_range = [0.6, 2.0] # 2,0: Seitwärts (2 m/s, Clip 1 m/s) ohne Gleiten (Koordinator 2026-10-03)

[face] # Gesicht (Morph-Targets characters-pipeline.md §6.1)
blink_min = 2.0           # s zwischen zwei Lidschlägen, zufällig zwischen min und max
blink_max = 6.0
blink_seconds = 0.15      # Schließen und Öffnen zusammen
visemes_per_second = 8.0  # Mundformen beim Sprechen (grob, bis Lippensynchronisation mit M13)
talk_weight = 0.8
expression_seconds = 0.3  # Ein- und Ausblenden von Ausdrücken

[look_at] # Kopf zum Ziel (Gesprächspartner): Anteile der Drehung je Knochen, Grenzen in Grad
bones = ["neck", "head"]
shares = [0.4, 0.6]
max_yaw = 70.0
max_pitch = 35.0
behind = 40.0             # Ziel weiter hinten als max_yaw + behind: Kopf zurück zur Mitte
degrees_per_second = 240.0

# --- Zustände ---
[[state]] # Fortbewegung: rückwärts, Stand, gehen, rennen nach der Geschwindigkeit
name = "move"
blend = "speed"
rate = "speed"
points = [
    { value = -1.4, clip = "none/s_walk_back" },
    { value = 0.0, clip = "none/s_idle" },
    { value = 1.6, clip = "none/s_walk" },
    { value = 4.0, clip = "none/s_run" },
]

[[state]] # mit gezogener Einhandwaffe (M9 Teil C; Kampf mit M11)
name = "move_1h"
blend = "speed"
rate = "speed"
points = [
    { value = -1.4, clip = "1h/s_walk_back" },
    { value = 0.0, clip = "1h/s_idle" },
    { value = 1.6, clip = "1h/s_walk" },
    { value = 4.0, clip = "1h/s_run" },
]

[[state]] # mit erhobenen Fäusten
name = "move_fist"
blend = "speed"
rate = "speed"
points = [
    { value = -1.4, clip = "fist/s_walk_back" },
    { value = 0.0, clip = "fist/s_idle" },
    { value = 1.6, clip = "fist/s_walk" },
    { value = 4.0, clip = "fist/s_run" },
]

[[state]] # Waffe ziehen bzw. wegstecken (figuren: Events draw/sheath, dort erscheint bzw. verschwindet sie)
name = "draw_1h"
clip = "1h/t_draw"

[[state]]
name = "sheath_1h"
clip = "1h/t_sheath"

[[state]]
name = "draw_fist"
clip = "fist/t_draw"

[[state]]
name = "sheath_fist"
clip = "fist/t_sheath"

[[state]]
name = "sneak"
blend = "speed"
rate = "speed"
points = [{ value = 0.0, clip = "none/s_idle" }, { value = 1.1, clip = "none/s_sneak" }]

[[state]]
name = "strafe_l"
clip = "none/s_strafe_l"
rate = "strafe"

[[state]]
name = "strafe_r"
clip = "none/s_strafe_r"
