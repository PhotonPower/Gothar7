# Animations-Zustandsautomat: Kristallkrebs (Dungeon; figuren #463): großer Höhlenkrebs, läuft seitwärts
# (Creatures.kristallkrebs.move_axis = "x"), liegt zwischen den Kristallen (s_dormant). Muster wie
# mauerkriecher.animgraph.toml:
#   dormant  Ruhe-Schleife solange gesetzt (bool, zs_dormant)
#   action   5 Erwachen (t_wake), 7 Festhalten (t_grab: Events grab/release), 8 Zauber zurückwerfen (t_reflect)
version = 1
sets = ["characters/monsters/kristallkrebs/anims/kristallkrebs.glb"]
start = "move"

[look_at] # Kopf zum Ziel (Spieler, Beute)
bones = ["neck_01", "head"]
shares = [0.4, 0.6]
max_yaw = 60.0
max_pitch = 30.0

# --- Zustände ---
[[state]]
name = "move"
blend = "speed"
root_motion = true
points = [
    { value = 0.0, clip = "kristallkrebs/s_idle" },
    { value = 0.8, clip = "kristallkrebs/s_walk" },
    { value = 2.5, clip = "kristallkrebs/s_run" },
]

[[state]]
name = "turn_l"
clip = "kristallkrebs/t_turn_l"
root_motion = true

[[state]]
name = "turn_r"
clip = "kristallkrebs/t_turn_r"
root_motion = true

[[state]]
name = "attack_1"
clip = "kristallkrebs/t_attack_1"

[[state]]
name = "attack_2"
clip = "kristallkrebs/t_attack_2"

[[state]]
name = "hit"
clip = "kristallkrebs/t_hit"

[[state]]
name = "threaten"
clip = "kristallkrebs/t_threaten"

[[state]]
name = "eat"
clip = "kristallkrebs/s_eat"

[[state]]
name = "sleep"
clip = "kristallkrebs/s_sleep"

[[state]] # bleibt am Ende liegen
name = "die"
clip = "kristallkrebs/t_die"

[[state]] # Ruhe (zs_dormant): zwischen den Kristallen an den Boden gedrückt
name = "dormant"
clip = "kristallkrebs/s_dormant"

[[state]]
name = "wake"
clip = "kristallkrebs/t_wake"

[[state]] # festhalten: Events grab ... release (Creatures.kristallkrebs.grab)
name = "grab"
clip = "kristallkrebs/t_grab"

[[state]] # Zauber zurückwerfen: Event reflect (Creatures.kristallkrebs.reflect)
name = "reflect"
clip = "kristallkrebs/t_reflect"

# --- Übergänge (Reihenfolge = Vorrang) ---
[[transition]]
from = "*"
to = "die"
when = ["dead"]
blend = 0.1

[[transition]]
from = "*"
to = "hit"
when = ["action == 3", "!dead"]
blend = 0.05

[[transition]]
from = "*"
to = "attack_1"
when = ["action == 1", "!dead"]
blend = 0.1

[[transition]]
from = "*"
to = "attack_2"
when = ["action == 2", "!dead"]
blend = 0.1

[[transition]]
from = "*"
to = "threaten"
when = ["action == 4", "!dead"]
blend = 0.15

[[transition]]
from = "*"
to = "wake"
when = ["action == 5", "!dead"]
blend = 0.1

[[transition]]
from = "*"
to = "grab"
when = ["action == 7", "!dead"]
blend = 0.1

[[transition]]
from = "*"
to = "reflect"
when = ["action == 8", "!dead"]
blend = 0.05

[[transition]]
from = "move"
to = "dormant"
when = ["dormant"]
blend = 0.5

[[transition]]
from = "dormant"
to = "move"
when = ["!dormant"]
blend = 0.3

[[transition]]
from = "move"
to = "eat"
when = ["eat"]
blend = 0.3

[[transition]]
from = "move"
to = "sleep"
when = ["sleep"]
blend = 0.5

[[transition]]
from = "eat"
to = "move"
when = ["!eat"]
blend = 0.3

[[transition]]
from = "sleep"
to = "move"
when = ["!sleep"]
blend = 0.5

[[transition]]
from = "move"
to = "turn_l"
when = ["turn < -0.5"]
blend = 0.15

[[transition]]
from = "move"
to = "turn_r"
when = ["turn > 0.5"]
blend = 0.15

# Einmal-Aktionen und Drehungen: zurück zur Fortbewegung
[[transition]]
from = "turn_l"
to = "move"
when = ["end"]
blend = 0.15

[[transition]]
from = "turn_r"
to = "move"
when = ["end"]
blend = 0.15

[[transition]]
from = "attack_1"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "attack_2"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "hit"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "threaten"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "wake"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "grab"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "reflect"
to = "move"
when = ["end"]
blend = 0.2
