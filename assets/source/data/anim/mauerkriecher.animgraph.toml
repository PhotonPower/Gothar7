# Animations-Zustandsautomat: Mauerkriecher (Dungeon; figuren #440): asselartiger Kriecher, sitzt flach in Ritzen
# (s_dormant) und kommt bei Licht und Lärm heraus (t_emerge statt t_wake). Muster wie gatterbock.animgraph.toml:
#   dormant  Ruhe-Schleife solange gesetzt (bool, zs_dormant)
#   action   5 Herauskommen (t_emerge)
#   curled   eingerollt nach einem schweren Treffer (bool, Creatures.mauerkriecher.curl): t_curl -> s_curled -> t_uncurl
# Noch nicht verwendet: t_wake.
version = 1
sets = ["characters/monsters/mauerkriecher/anims/mauerkriecher.glb"]
start = "move"

[look_at] # Kopf zum Ziel (Spieler, Beute)
bones = ["neck_01", "head"]
shares = [0.4, 0.6]
max_yaw = 60.0
max_pitch = 30.0

# --- Zustände ---
[[state]]
name = "move"
blend = "speed"
root_motion = true
points = [
    { value = 0.0, clip = "mauerkriecher/s_idle" },
    { value = 1.2, clip = "mauerkriecher/s_walk" },
    { value = 5.0, clip = "mauerkriecher/s_run" },
]

[[state]]
name = "turn_l"
clip = "mauerkriecher/t_turn_l"
root_motion = true

[[state]]
name = "turn_r"
clip = "mauerkriecher/t_turn_r"
root_motion = true

[[state]]
name = "attack_1"
clip = "mauerkriecher/t_attack_1"

[[state]]
name = "attack_2"
clip = "mauerkriecher/t_attack_2"

[[state]]
name = "hit"
clip = "mauerkriecher/t_hit"

[[state]]
name = "threaten"
clip = "mauerkriecher/t_threaten"

[[state]]
name = "eat"
clip = "mauerkriecher/s_eat"

[[state]]
name = "sleep"
clip = "mauerkriecher/s_sleep"

[[state]] # bleibt am Ende liegen
name = "die"
clip = "mauerkriecher/t_die"

[[state]] # Ruhe (zs_dormant): flach in der Ritze
name = "dormant"
clip = "mauerkriecher/s_dormant"

[[state]]
name = "wake"
clip = "mauerkriecher/t_emerge"

[[state]] # schwerer Treffer: rollt sich ein (der Panzer schützt)
name = "curl"
clip = "mauerkriecher/t_curl"

[[state]]
name = "curled"
clip = "mauerkriecher/s_curled"

[[state]]
name = "uncurl"
clip = "mauerkriecher/t_uncurl"

# --- Übergänge (Reihenfolge = Vorrang) ---
[[transition]]
from = "*"
to = "die"
when = ["dead"]
blend = 0.1

[[transition]]
from = "move"
to = "curl"
when = ["curled", "!dead"]
blend = 0.1

[[transition]]
from = "turn_l"
to = "curl"
when = ["curled", "!dead"]
blend = 0.1

[[transition]]
from = "turn_r"
to = "curl"
when = ["curled", "!dead"]
blend = 0.1

[[transition]]
from = "attack_1"
to = "curl"
when = ["curled", "!dead"]
blend = 0.1

[[transition]]
from = "attack_2"
to = "curl"
when = ["curled", "!dead"]
blend = 0.1

[[transition]]
from = "hit"
to = "curl"
when = ["curled", "!dead"]
blend = 0.1

[[transition]]
from = "threaten"
to = "curl"
when = ["curled", "!dead"]
blend = 0.1

[[transition]]
from = "eat"
to = "curl"
when = ["curled", "!dead"]
blend = 0.1

[[transition]]
from = "sleep"
to = "curl"
when = ["curled", "!dead"]
blend = 0.1

[[transition]]
from = "wake"
to = "curl"
when = ["curled", "!dead"]
blend = 0.1

[[transition]]
from = "uncurl"
to = "curl"
when = ["curled", "!dead"]
blend = 0.1

[[transition]]
from = "curl"
to = "curled"
when = ["end"]
blend = 0.1

[[transition]]
from = "curled"
to = "uncurl"
when = ["!curled"]
blend = 0.15

[[transition]]
from = "uncurl"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "*"
to = "hit"
when = ["action == 3", "!dead"]
blend = 0.05

[[transition]]
from = "*"
to = "attack_1"
when = ["action == 1", "!dead"]
blend = 0.1

[[transition]]
from = "*"
to = "attack_2"
when = ["action == 2", "!dead"]
blend = 0.1

[[transition]]
from = "*"
to = "threaten"
when = ["action == 4", "!dead"]
blend = 0.15

[[transition]]
from = "*"
to = "wake"
when = ["action == 5", "!dead"]
blend = 0.1

[[transition]]
from = "move"
to = "dormant"
when = ["dormant"]
blend = 0.5

[[transition]]
from = "dormant"
to = "move"
when = ["!dormant"]
blend = 0.3

[[transition]]
from = "move"
to = "eat"
when = ["eat"]
blend = 0.3

[[transition]]
from = "move"
to = "sleep"
when = ["sleep"]
blend = 0.5

[[transition]]
from = "eat"
to = "move"
when = ["!eat"]
blend = 0.3

[[transition]]
from = "sleep"
to = "move"
when = ["!sleep"]
blend = 0.5

[[transition]]
from = "move"
to = "turn_l"
when = ["turn < -0.5"]
blend = 0.15

[[transition]]
from = "move"
to = "turn_r"
when = ["turn > 0.5"]
blend = 0.15

# Einmal-Aktionen und Drehungen: zurück zur Fortbewegung
[[transition]]
from = "turn_l"
to = "move"
when = ["end"]
blend = 0.15

[[transition]]
from = "turn_r"
to = "move"
when = ["end"]
blend = 0.15

[[transition]]
from = "attack_1"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "attack_2"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "hit"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "threaten"
to = "move"
when = ["end"]
blend = 0.2

[[transition]]
from = "wake"
to = "move"
when = ["end"]
blend = 0.2
