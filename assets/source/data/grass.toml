# Gras je Splat-Schicht des Geländes (M17 Teil G2, docs/modules/render.md „Gras“).
# Vertrag mit welt (coordination.md): Die Schicht wird über ihren Namen in der Weltdatei gefunden
# (terrain.splat.layers[].name). Wiese voll, Waldboden ein Viertel, Matsch ein Zehntel (Feldwege sind Matsch: etwas
# Gras in der Mitte); alle anderen Schichten (Kopfstein, Kies, Acker, Fels) haben kein Gras. Das Testlager nennt seine
# Wiese "grass" (zweiter gültiger Name, Entscheidung Koordinator 2026-11-23).
# Optional multipliziert terrain.grass_mask (8-bit-Bild in Splat-Auflösung, 0 kein Gras .. 255 volle Dichte) die
# Dichte; welt erzeugt sie aus OSM-Flächen.
#
# density  0..1 der Büschel je m² der Qualitätsstufe (bei vollem Schichtgewicht)
# height   [kleinstes, größtes] Büschel in Metern (höchstens 1,2)
# foot/tip Farbe am Fuß und an den Spitzen, linear (nicht sRGB)
# flowers  ein kleiner Anteil (5 %) blühender Büschel (Entscheidung 3: auf Wiesen)

version = 1

[layer.Wiese]
aliases = ["grass"]
density = 1.0
height = [0.25, 0.6]
foot = [0.035, 0.06, 0.012]
tip = [0.16, 0.22, 0.055]
flowers = true

[layer.Waldboden]
density = 0.25
height = [0.1, 0.3]
foot = [0.03, 0.04, 0.015]
tip = [0.09, 0.12, 0.04]

[layer.Matsch]
density = 0.1
height = [0.15, 0.35]
foot = [0.04, 0.05, 0.015]
tip = [0.15, 0.17, 0.06]
