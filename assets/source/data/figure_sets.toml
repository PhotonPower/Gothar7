# Figure sets (contract figuren -> engine, F3v): an NPC with `figure_set` and without its own
# `figure` gets one of these manifests, chosen at random but stable per NPC. Paths relative to
# assets/source. Named figures (smith, innkeeper, market_woman, gate_guard, guard_captain) are
# not in a set: they belong to one NPC each (Npc.figure).

[sets]
citizen = [
    "characters/figures/citizen_m_1.figure.toml",
    "characters/figures/citizen_m_2.figure.toml",
    "characters/figures/citizen_m_3.figure.toml",
