# Bewegung der Spielfigur und Third-Person-Kamera (gameplay.md „Bewegung & Kamera“). Spielgefühl:
# Startwerte vom Projektinhaber freigegeben (M5 Teil C), Anpassung nach Probespielen ohne Code –
# die Datei wird im laufenden Spiel neu geladen (Hot-Reload).
version = 1

[speed]            # m/s; Standard ist Rennen, gehalten „walk“ (Shift) = Gehen, „sneak“ = Schleichen
run = 4.0
walk = 1.6
sneak = 1.1
backward = 1.4     # nie schneller als die Gangart
strafe = 2.0       # Seitwärtsschritte (klassisch Q/E)
acceleration = 12.0  # m/s² auf eine höhere Geschwindigkeit
deceleration = 16.0  # m/s² bremsen

[turn]
keys_degrees_per_second = 180.0  # klassisch A/D
mouse_degrees_per_pixel = 0.15

[ground]
step_height = 0.4        # m, höchste Stufe, die man hinaufgeht (scharfe Grenze)
max_slope_degrees = 50.0 # steiler: man rutscht ab und kommt nicht hinauf
stick_to_floor = 0.5     # m, bergab und über kleine Absätze am Boden bleiben

[jump]                   # Taste jump (klassisch Alt, modern Leertaste); keine Steuerung in der Luft
stand_height = 0.9       # m Scheitel der Füße aus Stand und Gehen
run_height = 1.1         # m aus dem Rennen (höher und damit weiter; Entscheidung Projektinhaber)
cooldown = 0.2           # s nach der Landung bis zum nächsten Sprung

[climb]                  # vor einer Kante klettert jump statt zu springen (bis M6 entlang einer Bahn)
low_max = 1.0            # m, Klasse niedrig (hinaufsteigen)
mid_max = 1.6            # m, mittel (hochziehen)
high_max = 2.2           # m, hoch (aus dem Sprung greifen); höher ist nicht erreichbar
reach = 0.6              # m zwischen Figur und Wand
low_seconds = 0.6
mid_seconds = 1.0
high_seconds = 1.4

[fall]                   # Lebenspunkte kommen mit M8; bis dahin meldet das Log den Schaden
safe_height = 4.0        # m ohne Schaden; Rutschen am Hang zählt nicht
damage_per_meter = 10.0  # Lebenspunkte je Meter darüber

[swim]                   # Schwimmen ab hüfttiefem Wasser; sneak (X) taucht ab, jump (Alt) hält: auftauchen
speed = 1.6              # m/s
slow_speed = 0.9         # m/s mit walk (Shift)
dive_speed = 1.0         # m/s abwärts (sneak gehalten)
rise_speed = 1.2         # m/s aufwärts (jump gehalten)
float_speed = 0.5        # m/s aufwärts, wenn unter Wasser nichts gedrückt ist
start_depth = 0.9        # m Wasser über den Füßen (Hüfthöhe), ab dem man schwimmt
eyes_above_surface = 0.2 # m, Augen beim Schwimmen an der Oberfläche
eye_height = 1.62        # m über den Füßen (gemessen an den Figuren)
air_seconds = 30.0       # Luftvorrat unter Wasser
refill_seconds = 3.0     # s von leer bis voll an der Oberfläche
drown_damage_per_second = 10.0  # Lebenspunkte je Sekunde ohne Luft (Log bis M8)

[camera]
distance = 3.0           # m hinter dem Blickpunkt
target_height = 1.55     # m über den Füßen (knapp unter Augenhöhe 1,62)
pitch_degrees = 12.0     # Grundneigung nach unten
min_pitch_degrees = -40.0
max_pitch_degrees = 60.0
position_lag = 0.12      # s, Trägheit beim Folgen
yaw_lag = 0.25           # s, Trägheit beim Drehen hinter die Figur
collision_radius = 0.2   # m
min_distance = 0.6       # m
mouse_degrees_per_pixel = 0.15
return_lag = 0.25        # s: nach einer Wand weich zurück (hinein sofort, damit sie nie durch Wände schaut)

[camera.indoor]          # unter einem Dach (Häuser, Höhle): näher und tiefer, weich überblendet
distance = 1.9           # m (welts Räume sind 4-8 m breit)
target_height = 1.5      # m
min_distance = 0.4       # m
collision_radius = 0.15  # m
ceiling = 4.0            # m über den Füßen: ein Dach darunter heißt „drinnen“ (Räume 2,4-2,9 m hoch)
blend_seconds = 0.5      # s, Zeitkonstante des Wechsels

[camera.combat]          # Kampf (M11, K5): Waffe gezogen und ein Gegner im Ziel-Lock – näher, etwas tiefer
distance = 2.4           # m (drinnen gilt der nähere Abstand)
target_height = 1.45     # m
min_distance = 0.5       # m
blend_seconds = 0.4      # s
