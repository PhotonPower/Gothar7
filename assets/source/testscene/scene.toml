# M2 test scene (Definition of Done): a small camp with huts around a fire, a market, a fence and a
# forest - sun, shadows, torch light and fog. Models: Kenney Fantasy Town Kit and Nature Kit (CC0,
# assets/LICENSES.md). One Kenney unit = 1 tile; huts are scaled by 3 (3 m walls).
#
#   gothar --scene=<path>/scene.toml               fly around (F1 panel, F2 debug draw)
#   gothar --scene=<path>/scene.toml --benchmark   frame times from the viewpoints below
#
# Format: docs/05-build.md ("Testszenen"). Positions in metres, rotation_y in degrees.

ground = { size = 640.0, color = [0.34, 0.31, 0.24] }

# Late evening: weaker sun so the torches stand out, Gothic-like dense fog (90 % at 200 m, so the
# ground plate's edge at 320 m disappears in the horizon).
[environment]
sun_intensity = 1.1
fog_start = 20.0
fog_density = 0.00843

# Hut of 1 x 2 tiles along +Z: plank walls, door at -X, a shuttered window, gable roof.
[prefab.hut]

[[prefab.hut.part]]
mesh = "town/wall-wood.glb"
[[prefab.hut.part]]
mesh = "town/wall-wood-door.glb"
rotation_y = 180
[[prefab.hut.part]]
mesh = "town/roof-gable.glb"
