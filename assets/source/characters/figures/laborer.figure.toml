    "parts/cloth_m_heavy/elvs_crude_t-shirt_male.glb",
    "parts/cloth_m_heavy/culturalibre_male_boots.glb",
]

[palette]
cloth_elvs_crude_t-shirt_male = "#8a8070"
cloth_culturalibre_male_boots = "#4a3a2c"
