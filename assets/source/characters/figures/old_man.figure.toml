cloth = [
    "parts/cloth_m_thin/elvs_crude_t-shirt_male.glb",
    "parts/cloth_m_thin/toigo_mj_cloth_shoes.glb",
]

[palette]
cloth_elvs_crude_t-shirt_male = "#b0a184"
cloth_toigo_mj_cloth_shoes = "#5a4b3b"
