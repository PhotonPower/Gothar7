# Hair kit (F3v) fitted to head_m_old: every style and beard is its own part
# (parts/hair_m_old/<name>.glb, roles hair and beard in figure manifests). Neutral grey textures
# shared by name across the kits: the figure palette gives the colour (keys hair, beard; the
# texture mean is 0.55). CC0 only, file headers checked: MakeHuman Hair 01, Bodyparts 05, system assets.
version = 1
fit_to = "head_m_old"
parts = ["hair"]
triangles = 1200

[assets]
hairs = [
    "hair/long01/long01.mhclo",
    "hair/short04/short04.mhclo",
    "hair/short02/short02.mhclo",
]

[names]
long01 = "hair_long"
short04 = "hair_buzz"
short02 = "hair_short"
