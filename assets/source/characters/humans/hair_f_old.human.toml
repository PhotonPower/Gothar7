# Hair kit (F3v) fitted to head_f_old: every style and beard is its own part
# (parts/hair_f_old/<name>.glb, roles hair and beard in figure manifests). Neutral grey textures
# shared by name across the kits: the figure palette gives the colour (keys hair, beard; the
# texture mean is 0.55). CC0 only, file headers checked: MakeHuman Hair 01, Bodyparts 05, system assets.
version = 1
fit_to = "head_f_old"
parts = ["hair"]
triangles = 1200

[assets]
hairs = [
    "hair/ponytail01/ponytail01.mhclo",
    "hair/bob02/bob02.mhclo",
    "hair/braid01/braid01.mhclo",
]

[names]
ponytail01 = "hair_ponytail"
bob02 = "hair_bob"
braid01 = "hair_braid"
