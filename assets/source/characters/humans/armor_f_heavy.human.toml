# Armour kit (F3g) fitted to body_f_heavy: light and medium pieces, every piece its own part
# (parts/armor_f_heavy/<piece>.glb), combined in figure manifests ([parts] cloth).
# Armour keeps its colour textures (owner decision 2026-10-03); the palette may tint it.
# CC0 pieces only (file header and pack metadata, assets/LICENSES.md), with neutral names.
# light: leather_vest (own, derived from the kit shirt; ambientCG CC0 leather), gloves_short
# medium: mail_tunic, wrapped_trousers, wrapped_boots, gloves_medium
# heavy (F3l, over the medium line): breastplate and pauldrons as own shells from the skin (smooth,
# domed, folded edge), greaves and gauntlets from the boots and gloves; dark iron (ambientCG Metal 021)
version = 1
fit_to = "body_f_heavy"
parts = ["cloth"]
triangles = 16000
neutral = false

[assets]
clothes = [
    "clothes/rehmanpolanski_viking_tunic/rehmanpolanski_viking_tunic.mhclo",
    "clothes/rehmanpolanski_viking_pants/rehmanpolanski_viking_pants.mhclo",
    "clothes/rehmanpolanski_viking_boots/rehmanpolanski_viking_boots.mhclo",
    "clothes/toigo_gloves_short/toigo_gloves_short.mhclo",
    "clothes/toigo_gloves_medium/toigo_gloves_medium.mhclo",
]

[names]
rehmanpolanski_viking_tunic = "mail_tunic"
rehmanpolanski_viking_pants = "wrapped_trousers"
rehmanpolanski_viking_boots = "wrapped_boots"
toigo_gloves_short = "gloves_short"
toigo_gloves_medium = "gloves_medium"

[budget]
mail_tunic = 3000
wrapped_trousers = 1500
wrapped_boots = 1500
gloves_short = 1000
gloves_medium = 1200
leather_vest = 1500
breastplate = 1200
pauldrons = 800
greaves = 600
gauntlets = 1200

[retouch]  # the source's emblem on the chest (owner decision 2026-10-03): mail from the back panel
mail_tunic = [[0.16, 0.24, 0.26, 0.345, 0.48, 0.0]]

[derive.leather_vest]
from = "clothes/joepal_crude_t-shirt_female/joepal_crude_t-shirt_female.mhclo"
cut = ["upperarm", "lowerarm"]
offset = 0.008
texture = "gothar/ambientcg/Leather033A/Leather033A_1K-JPG_Color.jpg"
normal = "gothar/ambientcg/Leather033A/Leather033A_1K-JPG_NormalGL.jpg"
uv_scale = 2.0

[derive.breastplate]
from = "basemesh"
group = "body"
keep = ["spine"]
smooth = 50
flatten = 1.0
offset = 0.035
rim = 0.012
texture = "gothar/ambientcg/Metal021/Metal021_1K-JPG_Color.jpg"
normal = "gothar/ambientcg/Metal021/Metal021_1K-JPG_NormalGL.jpg"
uv_scale = 3.0

[derive.pauldrons]
from = "basemesh"
group = "body"
keep = ["clavicle", "upperarm"]
near = ["upperarm_l", "upperarm_r"]
radius = 0.12
smooth = 15
offset = 0.035
bulge = 0.025
rim = 0.01
bones = ["clavicle", "upperarm"]
texture = "gothar/ambientcg/Metal021/Metal021_1K-JPG_Color.jpg"
normal = "gothar/ambientcg/Metal021/Metal021_1K-JPG_NormalGL.jpg"
uv_scale = 3.0

[derive.greaves]
from = "clothes/rehmanpolanski_viking_boots/rehmanpolanski_viking_boots.mhclo"
keep = ["calf"]
smooth = 8
offset = 0.01
bones = ["calf"]
texture = "gothar/ambientcg/Metal021/Metal021_1K-JPG_Color.jpg"
normal = "gothar/ambientcg/Metal021/Metal021_1K-JPG_NormalGL.jpg"
uv_scale = 3.0

[derive.gauntlets]
from = "clothes/toigo_gloves_medium/toigo_gloves_medium.mhclo"
offset = 0.002
texture = "gothar/ambientcg/Metal021/Metal021_1K-JPG_Color.jpg"
normal = "gothar/ambientcg/Metal021/Metal021_1K-JPG_NormalGL.jpg"
uv_scale = 3.0
