# Head of the farmer (the player figure of M6), style A: head (with face morphs, teeth, tongue) and hair.
# Until F3j the farmer was a whole MPFB human with clothes baked into its body; it is now assembled from
# parts like every figure (figures/farmer.figure.toml): base body, this head, kit garments.
# Fits every male base body (assembly snaps the neck; the head is built at the bodies' neck height).
version = 1
triangles = 6000
parts = ["head", "hair"]

[macro]
gender = 1.0
age = 0.75
muscle = 0.65
weight = 0.55
proportions = 0.5
height = 0.62
race = { caucasian = 1.0 }

[assets]
skin = "skins/middleage_caucasian_male/middleage_caucasian_male.mhmat"
eyes = "eyes/low-poly/low-poly.mhclo"
eyebrows = "eyebrows/eyebrow001/eyebrow001.mhclo"
eyelashes = "eyelashes/eyelashes01/eyelashes01.mhclo"
teeth = "teeth/teeth_base/teeth_base.mhclo"
tongue = "tongue/tongue01/tongue01.mhclo"
hair = "hair/cortu_short_messy_hair/cortu_short_messy_hair.mhclo"

[tint]
cortu_short_messy_hair = "#5a3d29"
