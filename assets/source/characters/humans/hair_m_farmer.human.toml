# Hair kit (F3v) fitted to head_m_farmer: every style and beard is its own part
# (parts/hair_m_farmer/<name>.glb, roles hair and beard in figure manifests). Neutral grey textures
# shared by name across the kits: the figure palette gives the colour (keys hair, beard; the
# texture mean is 0.55). CC0 only, file headers checked: MakeHuman Hair 01, Bodyparts 05, system assets.
version = 1
fit_to = "head_m_farmer"
parts = ["hair", "beard"]
triangles = 1200

[assets]
hairs = [
    "hair/long01/long01.mhclo",
    "hair/ponytail01/ponytail01.mhclo",
    "hair/short02/short02.mhclo",
]
beards = [
    "clothes/rehmanpolanski_beard_viking/rehmanpolanski_beard_viking.mhclo",
    "clothes/rehmanpolanski_moustache_viking/rehmanpolanski_moustache_viking.mhclo",
]

[names]
long01 = "hair_long"
ponytail01 = "hair_ponytail"
short02 = "hair_short"
rehmanpolanski_beard_viking = "beard_goatee"
rehmanpolanski_moustache_viking = "beard_moustache"
