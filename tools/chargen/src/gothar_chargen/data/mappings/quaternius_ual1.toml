# Bone mapping: Quaternius rig with the old Rigify-style naming (Universal Animation Library 1 before
# v2.0, as published on opengameart.org) -> reference rig. Source: CC0 1.0.
# Rest pose and bone axes are identical to UAL2 / the reference rig: clips transfer by renaming only.

