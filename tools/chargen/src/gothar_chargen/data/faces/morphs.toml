# Face morph targets of human heads (contract with engine, characters-pipeline.md §6, agreed
# 2026-10-03). Order = order in the glTF (mesh.extras.targetNames); engine allows at most 16.
#
# Each target mixes MPFB2 face targets (CC0 asset packs "Visemes 02" and "Faceunits 01", installed
# into the MPFB user data): mix = { <mpfb target> = <weight> }. Weights may be tuned freely.
# ARKit "Left" is the character's left (+X), like *_l in the rig.

version = 1

# --- visemes (lip sync); "rest" is all visemes at 0 ---

[[morph]]
name = "vis_aa"
mix = { viseme_aa = 1.0 }

[[morph]]
name = "vis_ee"
mix = { viseme_E = 1.0 }

[[morph]]
name = "vis_ih"
mix = { viseme_I = 1.0 }

[[morph]]
name = "vis_oh"
mix = { viseme_O = 1.0 }

[[morph]]
name = "vis_ou"
mix = { viseme_U = 1.0 }

[[morph]]
name = "vis_mbp"
mix = { viseme_PP = 1.0 }

[[morph]]
name = "vis_fv"
mix = { viseme_FF = 1.0 }

[[morph]]
name = "vis_l"
mix = { viseme_nn = 1.0 }          # Meta "nn" covers n and l

# --- blinking ---

[[morph]]
name = "blink_l"
mix = { eyeBlinkLeft = 1.0 }

[[morph]]
name = "blink_r"
mix = { eyeBlinkRight = 1.0 }

# --- expressions (mixed from ARKit face units) ---

[[morph]]
name = "expr_angry"
mix = { browDownLeft = 1.0, browDownRight = 1.0, noseSneerLeft = 0.5, noseSneerRight = 0.5, mouthPressLeft = 0.6, mouthPressRight = 0.6, eyeSquintLeft = 0.4, eyeSquintRight = 0.4, mouthFrownLeft = 0.3, mouthFrownRight = 0.3 }

[[morph]]
name = "expr_friendly"
mix = { mouthSmileLeft = 0.8, mouthSmileRight = 0.8, cheekSquintLeft = 0.5, cheekSquintRight = 0.5, eyeSquintLeft = 0.3, eyeSquintRight = 0.3, browInnerUp = 0.15 }

[[morph]]
name = "expr_fear"
mix = { browInnerUp = 1.0, browOuterUpLeft = 0.6, browOuterUpRight = 0.6, eyeWideLeft = 0.8, eyeWideRight = 0.8, mouthStretchLeft = 0.6, mouthStretchRight = 0.6, jawOpen = 0.15 }

[[morph]]
name = "expr_pain"
mix = { browDownLeft = 0.6, browDownRight = 0.6, browInnerUp = 0.7, eyeSquintLeft = 0.8, eyeSquintRight = 0.8, eyeBlinkLeft = 0.4, eyeBlinkRight = 0.4, mouthStretchLeft = 0.7, mouthStretchRight = 0.7, noseSneerLeft = 0.5, noseSneerRight = 0.5, jawOpen = 0.1 }

[[morph]]
name = "expr_sleep"
mix = { eyeBlinkLeft = 1.0, eyeBlinkRight = 1.0, jawOpen = 0.05 }
