# Set "cbow" -> assets/source/characters/anims/human/cbow.glb (Prio B, placeholders)
# Crossbow: stance = Quaternius UAL1 Pistol_Idle_Loop (both hands forward).
# Locomotion: arms and head from the stance, legs, pelvis and spine from the none clips
# (keeps the spine counter-rotation of strafe/turn; the stance's spine posture is dropped).

set = "cbow"
depends = ["none"]

[sources.ual1]
file = "AnimationLibrary_Godot_Standard.glb"
mapping = "quaternius_ual1"

# The crossbow is held by its stock in the fist (item +Y = stock forward): the pistol grip of the
# UAL clips (fist axis down) turned at the right hand by a constant offset (grid search: socket +Y
# forward, +Z up in cbow/s_aim).
[[clip]]
name = "cbow/s_idle_src"
from = "ual1:Pistol_Idle_Loop"
helper = true

[[clip]]
name = "cbow/s_idle"
keyframe = "keyposes"
[clip.params]
base = "cbow/s_idle_src"
keys = [[0, "grip"], [50, "grip"]]
[clip.params.poses.grip]
rotate = { hand_r = [["X", 30], ["Y", 30], ["Z", -105]] }

[[clip]]
name = "cbow/s_walk"
layer = ["none/s_walk", "cbow/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "cbow/s_run"
layer = ["none/s_run", "cbow/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "cbow/s_walk_back"
layer = ["none/s_walk_back", "cbow/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "cbow/s_strafe_l"
layer = ["none/s_strafe_l", "cbow/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "cbow/s_strafe_r"
layer = ["none/s_strafe_r", "cbow/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "cbow/t_turn_l"
layer = ["none/t_turn_l", "cbow/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "cbow/t_turn_r"
layer = ["none/t_turn_r", "cbow/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

# --- combat (M11): aiming, shooting, reloading – Quaternius UAL1 pistol clips (both hands forward)

[[clip]]
name = "cbow/t_aim_src"
from = "ual1:Pistol_Aim_Neutral"
helper = true

[[clip]]
name = "cbow/t_aim_hold"
keyframe = "hold"
params = { base = "cbow/t_aim_src", frame = 0, frames = 60 }
helper = true

[[clip]]
name = "cbow/t_shoot_src"
from = "ual1:Pistol_Shoot"
helper = true

[[clip]]
name = "cbow/t_reload_src"
from = "ual1:Pistol_Reload"
helper = true

[[clip]]
name = "cbow/s_aim"
keyframe = "keyposes"
[clip.params]
base = "cbow/t_aim_hold"
keys = [[0, "grip"], [60, "grip"]]
[clip.params.poses.grip]
rotate = { hand_r = [["X", 30], ["Y", 30], ["Z", -105]] }

[[clip]]
name = "cbow/t_shoot"
markers = { release = 2 }
keyframe = "keyposes"
[clip.params]
base = "cbow/t_shoot_src"
keys = [[0, "grip"], [19, "grip"]]
[clip.params.poses.grip]
rotate = { hand_r = [["X", 30], ["Y", 30], ["Z", -105]] }

[[clip]]
name = "cbow/t_reload"
keyframe = "keyposes"
[clip.params]
base = "cbow/t_reload_src"
keys = [[0, "grip"], [50, "grip"]]
[clip.params.poses.grip]
rotate = { hand_r = [["X", 30], ["Y", 30], ["Z", -105]] }
