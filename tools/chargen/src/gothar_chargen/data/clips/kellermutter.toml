# Set "kellermutter" (boss of the dungeon, mother of the Mauerkriecher; arthropod plan,
# characters-pipeline.md §7.5) -> monsters/kellermutter/anims/kellermutter.glb
# Own creature (gothar-chargen creature kellermutter, 2026-11-23): the clip source only holds the
# still action "rest". Walk and run are own gait cycles on the four spread legs (splay); the brood
# sac drags behind and pulses (sac, abdomen_03). Everything else is keyframed.
# Dungeon (#422): s_dormant crouched over the hoard (`zs_dormant`), t_wake; §7.5: t_scythe_l/r
# (hit points socket_claw_l/r), t_call (event spawn_brood: a wave of Mauerkriecher), t_rage
# (phase change like the Bergleu), s_guard (over the treasure), t_stagger. The weak spot on the sac
# is socket_weak (engine checks hits by distance and angle).
#
# Key poses rotate about world axes at rest (X = left, -Y = forward, Z = up; +X pitches a bone
# pointing forwards down - the scythes strike with +X, -X raises them back; Y swings a leg pointing
# sideways up (-) or down (+) on the left, +Z turns left) and move root/pelvis.

set = "kellermutter"
rig = "kellermutter"

[sources.src]
file = "kellermutter_clips.blend"
mapping = "identity"

[[clip]]
name = "kellermutter/s_rest"
from = "src:rest"
helper = true

[[clip]]
name = "kellermutter/s_idle"       # breathing sac, scythes twitching, the crowned head sways
keyframe = "keyposes"
[clip.params]
base = "kellermutter/s_rest"
keys = [[0, "rest"], [30, "breathe_l"], [60, "rest"], [90, "breathe_r"], [120, "rest"]]
[clip.params.poses.breathe_l]
rotate = { head = [["Z", 8]], sac = [["X", -4]], abdomen_03 = [["X", -2.0]], arm_upper_l = [["X", -6]], mandible_l = [["Z", 10]], mandible_r = [["Z", -10]] }
move = { pelvis = [0, 0, 0.02] }
[clip.params.poses.breathe_r]
rotate = { head = [["Z", -8]], sac = [["X", -4]], abdomen_03 = [["X", -2.0]], arm_upper_r = [["X", -6]] }
move = { pelvis = [0, 0, 0.02] }

