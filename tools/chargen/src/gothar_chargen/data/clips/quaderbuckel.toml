# Set "quaderbuckel" (monster contract, characters-pipeline.md §7) -> monsters/quaderbuckel/anims/
# Own creature (gothar-chargen creature quaderbuckel): the clip source only holds the still action
# "rest". Gaits are own cycles (gait), everything else keyframe placeholders.
# Agreed with engine (2026-10-07): walk 0.8, run 3.5 m/s (root motion), s_charge 4.5 m/s in place
# (natural speed from the feet); t_attack_1 = ram (hit_start/hit_end, engine knocks down);
# t_block_in, s_block, t_block_out = head pulled under the brow shield; t_warn = stamping and
# grinding plates.
#
# Key poses rotate about world axes at rest (X = left, -Y = forward, Z = up; +X pitches the head
# down, opens the jaw, swings a leg back and lifts the tail, +Z turns left) and move root/pelvis.

set = "quaderbuckel"
rig = "quaderbuckel"

[sources.src]
file = "quaderbuckel_clips.blend"
mapping = "identity"

[[clip]]
name = "quaderbuckel/s_rest"
from = "src:rest"
helper = true

[[clip]]
name = "quaderbuckel/s_idle"       # standing heavily, slow breathing, head swaying
keyframe = "keyposes"
[clip.params]
base = "quaderbuckel/s_rest"
keys = [[0, "stand"], [20, "breathe"], [40, "look"], [60, "stand"]]
[clip.params.poses.stand]
rotate = { neck_01 = [["X", 4]], tail_01 = [["X", -4]] }
[clip.params.poses.breathe]
move = { pelvis = [0, 0, 0.006] }
rotate = { chest = [["X", -1]], neck_01 = [["X", 2]], head = [["X", -2]], tail_01 = [["X", -2]] }
[clip.params.poses.look]
rotate = { neck_01 = [["X", 4], ["Z", 14]], head = [["Z", 6]], brow_shield = [["Z", 6]], tail_01 = [["Z", -6]] }

# --- locomotion ---

[[clip]]
name = "quaderbuckel/s_walk"       # heavy, plodding walk (lateral sequence)
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 0.8
period = 24                         # phases and duty on whole frames
duty = 0.6667
lift = 0.06
crouch = 0.01
bob = 0.012
pitch = 1.5
nod = { bone = "neck_01", degrees = 2.0, phase = 0.0 }
tail = { bones = ["tail_01", "tail_02"], degrees = 4, lag = 0.1 }
legs = [
    { upper = "back_upper_l", lower = "back_lower_l", foot = "back_foot_l", phase = 0.0, curl = 20 },
    { upper = "front_upper_l", lower = "front_lower_l", foot = "front_foot_l", phase = 0.25, curl = -30 },
    { upper = "back_upper_r", lower = "back_lower_r", foot = "back_foot_r", phase = 0.5, curl = 20 },
    { upper = "front_upper_r", lower = "front_lower_r", foot = "front_foot_r", phase = 0.75, curl = -30 },
]

[[clip]]
name = "quaderbuckel/s_run"        # lumbering trot, quick short steps (slower than the hero)
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 3.5
period = 8
duty = 0.375
lift = 0.08
crouch = 0.02
bob = 0.02
pitch = 2.0
nod = { bone = "neck_01", degrees = 3.0, phase = 0.25 }
tail = { bones = ["tail_01", "tail_02"], degrees = 6, lag = 0.1 }
legs = [
    { upper = "back_upper_l", lower = "back_lower_l", foot = "back_foot_l", phase = 0.0, curl = 20 },
    { upper = "front_upper_r", lower = "front_lower_r", foot = "front_foot_r", phase = 0.0, curl = -30 },
    { upper = "back_upper_r", lower = "back_lower_r", foot = "back_foot_r", phase = 0.5, curl = 20 },
    { upper = "front_upper_l", lower = "front_lower_l", foot = "front_foot_l", phase = 0.5, curl = -30 },
]

[[clip]]
name = "quaderbuckel/s_charge"     # charging with the shield lowered, in place (natural speed 4.5)
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 4.5
in_place = true
period = 8
duty = 0.25
lift = 0.1
crouch = 0.03
bob = 0.025
bob_cycles = 1
pitch = 3.0
flex = { bone = "spine_01", degrees = 4.0, phase = 0.25 }
tail = { bones = ["tail_01", "tail_02"], degrees = 8, lag = 0.1 }
pose = { chest = [["X", 5]], neck_01 = [["X", 18]], head = [["X", -8]], tail_01 = [["X", 10]] }
legs = [
    { upper = "back_upper_l", lower = "back_lower_l", foot = "back_foot_l", phase = 0.0, curl = 20 },
    { upper = "back_upper_r", lower = "back_lower_r", foot = "back_foot_r", phase = 0.125, curl = 20 },
    { upper = "front_upper_l", lower = "front_lower_l", foot = "front_foot_l", phase = 0.5, curl = -30 },
    { upper = "front_upper_r", lower = "front_lower_r", foot = "front_foot_r", phase = 0.625, curl = -30 },
]

[[clip]]
name = "quaderbuckel/s_step_inplace"   # base of the turns
keyframe = "gait"
helper = true
[clip.params]
