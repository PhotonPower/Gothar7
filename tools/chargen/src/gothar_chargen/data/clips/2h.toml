# Set "2h" -> assets/source/characters/anims/human/2h.glb (Prio B, placeholders)
# Two-handed weapon: no CC0 source -> keyframe stance (platzhalter-K), hands together at the right hip.
# Locomotion: arms and head from the stance, legs, pelvis and spine from the none clips
# (keeps the spine counter-rotation of strafe/turn; the stance's spine posture is dropped).

set = "2h"
depends = ["none"]

[sources.ual1]
file = "AnimationLibrary_Godot_Standard.glb"
mapping = "quaternius_ual1"

[sources.ual2]
file = "UAL2_Standard.glb"
mapping = "quaternius_ual2"

[[clip]]
name = "2h/s_stance"
keyframe = "pose"
helper = true

[clip.params]
frames = 60

[clip.params.rotations]
upperarm_r = [["Y", -70], ["Z", 30]]
lowerarm_r = [["Z", 70]]
upperarm_l = [["Y", 70], ["Z", -50]]
lowerarm_l = [["Z", -80]]
spine_02 = [["Z", 15]]
head = [["Z", -10]]

[[clip]]
name = "2h/s_idle"
layer = ["none/s_idle", "2h/s_stance"]

[[clip]]
name = "2h/s_walk"
layer = ["none/s_walk", "2h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "2h/s_run"
layer = ["none/s_run", "2h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "2h/s_walk_back"
layer = ["none/s_walk_back", "2h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "2h/s_strafe_l"
layer = ["none/s_strafe_l", "2h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "2h/s_strafe_r"
layer = ["none/s_strafe_r", "2h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "2h/t_turn_l"
layer = ["none/t_turn_l", "2h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "2h/t_turn_r"
layer = ["none/t_turn_r", "2h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

# --- combat (M11, contract with engine 2026-10-05): as 1h (every attack starts and ends in
# 2h/s_idle; hit_start/hit_end, combo_start = hit_end .. combo_end ~80 %), the left hand on the grip
# below the right one (recipe two_hands), wider and heavier swings.

[[clip]]
name = "2h/t_combo1_src"
concat = ["ual2:Sword_Regular_A", "ual2:Sword_Regular_A_Rec"]
helper = true

[[clip]]
name = "2h/t_combo1_low"         # the cut from above carried through to hip height (sweep vs. animals)
keyframe = "keyposes"
helper = true
[clip.params]
base = "2h/t_combo1_src"
keys = [[0, "rest"], [22, "rest"], [31, "low"], [35, "low"], [43, "rest"]]
[clip.params.poses.low]
rotate = { spine_02 = [["X", 20]], hand_r = [["X", 20], ["Y", 5], ["Z", -31]] }

[[clip]]
name = "2h/t_combo1_grip"
keyframe = "two_hands"
params = { base = "2h/t_combo1_low" }
helper = true

[[clip]]
name = "2h/t_attack_combo1"
keyframe = "framed"
markers = { hit_start = 22, hit_end = 32, combo_start = 32, combo_end = 38, "sound:swing" = 18 }
params = { base = "2h/t_combo1_grip", stance = "2h/s_idle", fade_in = 5, fade_out = 8, soften = ["spine_03", "neck", "head", "upperarm_l", "lowerarm_l"] }

[[clip]]
name = "2h/t_block_src"
from = "ual2:Sword_Block[0:15]"
helper = true

[[clip]]
name = "2h/t_block_grip"
keyframe = "two_hands"
params = { base = "2h/t_block_src" }
helper = true

[[clip]]
name = "2h/t_parry"               # ~0.6 s (engine sets the block window)
keyframe = "framed"
params = { base = "2h/t_block_grip", stance = "2h/s_idle", fade_in = 5, fade_out = 6, soften = ["spine_02", "spine_03", "neck", "head"] }

[[clip]]
name = "2h/t_combo2_src"
concat = ["ual2:Sword_Regular_B", "ual2:Sword_Regular_B_Rec"]
helper = true

[[clip]]
name = "2h/t_combo2_low"         # the slash bent down to wolf height (animals' bodies, sweep M11)
keyframe = "keyposes"
helper = true
[clip.params]
base = "2h/t_combo2_src"
keys = [[0, "rest"], [4, "rest"], [7, "low"], [10, "low"], [16, "rest"], [48, "rest"]]
[clip.params.poses.low]
rotate = { spine_02 = [["X", 12]], hand_r = [["X", 10], ["Y", -13], ["Z", 8]] }

[[clip]]
name = "2h/t_combo2_grip"
keyframe = "two_hands"
params = { base = "2h/t_combo2_low" }
helper = true

[[clip]]
name = "2h/t_attack_combo2"       # wide horizontal cut
keyframe = "framed"
markers = { hit_start = 6, hit_end = 9, combo_start = 9, combo_end = 38, "sound:swing" = 2 }
params = { base = "2h/t_combo2_grip", stance = "2h/s_idle", fade_in = 6, fade_out = 8, soften = ["spine_03", "neck", "head", "upperarm_l", "lowerarm_l"] }

# own swings over the upright none/s_idle (right arm; the left hand follows on the grip)
[[clip]]
name = "2h/t_chop"
keyframe = "keyposes"
helper = true
[clip.params]
base = "none/s_idle"
keys = [[0, "rest"], [12, "raise"], [19, "chop"], [24, "chop"], [40, "rest"]]
[clip.params.poses.raise]
rotate = { upperarm_r = [["X", -150], ["Z", -25]], lowerarm_r = [["X", -60]], spine_02 = [["Z", -20], ["X", -8]], spine_01 = [["Z", -8]], hand_r = [["X", 37], ["Y", 45], ["Z", -78]] }
move = { pelvis = [0, 0.04, -0.02], root = [0, -0.1, 0] }
[clip.params.poses.chop]
rotate = { upperarm_r = [["X", -40], ["Z", 20]], lowerarm_r = [["X", -10]], spine_02 = [["Z", 15], ["X", 18]], spine_01 = [["Z", 6], ["X", 8]], hand_r = [["X", 1], ["Y", -93], ["Z", -62]] }
