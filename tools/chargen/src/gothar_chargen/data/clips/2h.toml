params = { base = "2h/t_t_swing_r_grip", stance = "2h/s_idle", fade_in = 6, fade_out = 8 }

[[clip]]
name = "2h/t_combo4_src"
from = "ual1:Sword_Attack"
helper = true

[[clip]]
name = "2h/t_combo4_grip"
keyframe = "two_hands"
params = { base = "2h/t_combo4_src" }
helper = true

[[clip]]
name = "2h/t_attack_combo4"       # heavy finisher
keyframe = "framed"
markers = { hit_start = 9, hit_end = 13, combo_start = 13, combo_end = 37, "sound:swing" = 5 }
params = { base = "2h/t_combo4_grip", stance = "2h/s_idle", fade_in = 5, fade_out = 8, soften = ["spine_03", "neck", "head", "upperarm_l", "lowerarm_l"] }

[[clip]]
name = "2h/t_dodge_back"          # jump backwards, root motion 0.8 m (no events)
keyframe = "keyposes"
[clip.params]
base = "2h/s_idle"
keys = [[0, "rest"], [5, "crouch"], [11, "air"], [16, "land"], [24, "back"]]
[clip.params.poses.crouch]
rotate = { spine_02 = [["X", 10]], thigh_l = [["X", -20]], thigh_r = [["X", -20]], calf_l = [["X", 30]], calf_r = [["X", 30]] }
move = { pelvis = [0, 0.02, -0.08] }
[clip.params.poses.air]
rotate = { spine_02 = [["X", -8]], thigh_l = [["X", -30]], thigh_r = [["X", -10]], calf_l = [["X", 40]], calf_r = [["X", 25]] }
move = { root = [0, 0.4, 0], pelvis = [0, 0, 0.06] }
[clip.params.poses.land]
rotate = { spine_02 = [["X", 12]], thigh_l = [["X", -25]], thigh_r = [["X", -25]], calf_l = [["X", 35]], calf_r = [["X", 35]] }
move = { root = [0, 0.8, 0], pelvis = [0, 0.02, -0.09] }
[clip.params.poses.back]
move = { root = [0, 0.8, 0] }
