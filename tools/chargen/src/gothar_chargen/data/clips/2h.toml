helper = true
[clip.params]
base = "2h/t_wide"
keys = [[0, "rest"], [16, "rest"], [23, "low"], [26, "low"], [32, "rest"], [34, "rest"]]
[clip.params.poses.low]
rotate = { spine_02 = [["X", 10]], thigh_l = [["X", -35]], thigh_r = [["X", -35]], calf_l = [["X", 55]], calf_r = [["X", 55]], hand_r = [["X", 35], ["Y", 7], ["Z", 10]] }
move = { pelvis = [0, 0, -0.24], root = [0, -1.05, 0] }

[[clip]]
