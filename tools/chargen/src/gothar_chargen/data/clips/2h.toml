helper = true
[clip.params]
base = "none/s_idle"
keys = [[0, "rest"], [10, "wind"], [16, "cut"], [21, "through"], [38, "rest"]]
[clip.params.poses.wind]
rotate = { upperarm_r = [["X", -75], ["Z", 65]], lowerarm_r = [["X", -70]], spine_02 = [["Z", 35]], spine_01 = [["Z", 15]], hand_r = [["X", 75], ["Y", 29], ["Z", -65]] }
