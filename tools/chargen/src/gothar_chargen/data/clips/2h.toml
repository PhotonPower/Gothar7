base = "none/s_idle"
keys = [[0, "rest"], [10, "wind"], [16, "cut"], [21, "through"], [38, "rest"]]
[clip.params.poses.wind]
rotate = { upperarm_r = [["X", -80], ["Z", -75]], lowerarm_r = [["X", -40]], spine_02 = [["Z", -35]], spine_01 = [["Z", -15]] }
[clip.params.poses.cut]
rotate = { upperarm_r = [["X", -85], ["Z", 5]], lowerarm_r = [["X", -10]], spine_02 = [["Z", 5]], spine_01 = [["Z", 2]] }
move = { pelvis = [0, -0.06, -0.03] }
[clip.params.poses.through]
rotate = { upperarm_r = [["X", -70], ["Z", 70]], lowerarm_r = [["X", -40]], spine_02 = [["Z", 35]], spine_01 = [["Z", 15]] }
move = { pelvis = [0, -0.05, -0.03] }

[[clip]]
name = "2h/t_swing_r"
keyframe = "keyposes"
helper = true
[clip.params]
base = "none/s_idle"
keys = [[0, "rest"], [10, "wind"], [16, "cut"], [21, "through"], [38, "rest"]]
[clip.params.poses.wind]
rotate = { upperarm_r = [["X", -75], ["Z", 65]], lowerarm_r = [["X", -70]], spine_02 = [["Z", 35]], spine_01 = [["Z", 15]] }
[clip.params.poses.cut]
rotate = { upperarm_r = [["X", -85], ["Z", -5]], lowerarm_r = [["X", -10]], spine_02 = [["Z", -5]], spine_01 = [["Z", -2]] }
move = { pelvis = [0, -0.06, -0.03] }
[clip.params.poses.through]
rotate = { upperarm_r = [["X", -70], ["Z", -70]], lowerarm_r = [["X", -15]], spine_02 = [["Z", -35]], spine_01 = [["Z", -15]] }
move = { pelvis = [0, -0.05, -0.03] }

[[clip]]
name = "2h/t_t_chop_grip"
keyframe = "two_hands"
params = { base = "2h/t_chop" }
helper = true

[[clip]]
name = "2h/t_attack_combo3"  # diagonal overhead chop
keyframe = "framed"
markers = { hit_start = 16, hit_end = 21, combo_start = 21, combo_end = 32, "sound:swing" = 12 }
params = { base = "2h/t_t_chop_grip", stance = "2h/s_idle", fade_in = 6, fade_out = 8 }

[[clip]]
name = "2h/t_t_swing_l_grip"
keyframe = "two_hands"
params = { base = "2h/t_swing_l" }
helper = true

[[clip]]
name = "2h/t_attack_l"  # directional swing to the left
keyframe = "framed"
markers = { hit_start = 14, hit_end = 19, "sound:swing" = 10 }
params = { base = "2h/t_t_swing_l_grip", stance = "2h/s_idle", fade_in = 6, fade_out = 8 }

[[clip]]
name = "2h/t_t_swing_r_grip"
keyframe = "two_hands"
params = { base = "2h/t_swing_r" }
helper = true

[[clip]]
name = "2h/t_attack_r"  # directional swing to the right
keyframe = "framed"
