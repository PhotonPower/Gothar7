rotate = { upperarm_r = [["X", -70], ["Z", -70]], lowerarm_r = [["X", -15]], spine_02 = [["Z", -35], ["X", 15]], spine_01 = [["Z", -15]], hand_r = [["X", 65], ["Y", 34], ["Z", -139]] }
move = { pelvis = [0, -0.05, -0.03], root = [0, -0.7, 0] }

[[clip]]
name = "2h/t_t_chop_grip"
keyframe = "two_hands"
params = { base = "2h/t_chop" }
helper = true

[[clip]]
name = "2h/t_attack_combo3"  # diagonal overhead chop
keyframe = "framed"
markers = { hit_start = 15, hit_end = 19, combo_start = 19, combo_end = 32, "sound:swing" = 11 }
params = { base = "2h/t_t_chop_grip", stance = "2h/s_idle", fade_in = 6, fade_out = 8 }

[[clip]]
