[[clip]]
name = "2h/t_attack_combo1_framed"
keyframe = "framed"
helper = true
params = { base = "2h/t_combo1_grip", stance = "2h/s_idle", fade_in = 5, fade_out = 8, soften = ["spine_03", "neck", "head", "upperarm_l", "lowerarm_l"] }

[[clip]]
name = "2h/t_attack_combo1"                 # feet planted, steps instead of sliding (F4)
keyframe = "plant"
markers = { hit_start = 19, hit_end = 25, combo_start = 25, combo_end = 30, "sound:swing" = 15 }
