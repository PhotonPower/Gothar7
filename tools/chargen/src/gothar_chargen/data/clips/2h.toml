# Set "2h" -> assets/source/characters/anims/human/2h.glb (Prio B, placeholders)
# Two-handed weapon: no CC0 source -> keyframe stance (platzhalter-K), hands together at the right hip.
# Locomotion: arms and head from the stance, legs, pelvis and spine from the none clips
# (keeps the spine counter-rotation of strafe/turn; the stance's spine posture is dropped).

set = "2h"
depends = ["none"]

[sources.ual1]
file = "AnimationLibrary_Godot_Standard.glb"
mapping = "quaternius_ual1"

[sources.ual2]
file = "UAL2_Standard.glb"
mapping = "quaternius_ual2"

[sources.cmu]                  # CMU mocap retargeted by `gothar-chargen cmu` (F4, LICENSES.md)
file = "cmu_combat.blend"
mapping = "identity"

[[clip]]
name = "2h/s_stance"
keyframe = "pose"
helper = true

[clip.params]
frames = 60

[clip.params.rotations]
upperarm_r = [["Y", -70], ["Z", 30]]
lowerarm_r = [["Z", 70]]
upperarm_l = [["Y", 70], ["Z", -50]]
lowerarm_l = [["Z", -80]]
spine_02 = [["Z", 15]]
head = [["Z", -10]]

[[clip]]
name = "2h/s_idle"
layer = ["none/s_idle", "2h/s_stance"]

[[clip]]
name = "2h/s_walk"
layer = ["none/s_walk", "2h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "2h/s_run"
layer = ["none/s_run", "2h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "2h/s_walk_back"
layer = ["none/s_walk_back", "2h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "2h/s_strafe_l"
layer = ["none/s_strafe_l", "2h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "2h/s_strafe_r"
layer = ["none/s_strafe_r", "2h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "2h/t_turn_l"
layer = ["none/t_turn_l", "2h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "2h/t_turn_r"
layer = ["none/t_turn_r", "2h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

# --- combat (M11, contract with engine 2026-10-05): as 1h (every attack starts and ends in
# 2h/s_idle; hit_start/hit_end, combo_start = hit_end .. combo_end ~80 %), the left hand on the grip
# below the right one (recipe two_hands), wider and heavier swings.

[[clip]]
name = "2h/s_grip"                # closed sword grip for the mocap hands (CMU has no fingers)
from = "ual1:Sword_Idle"
helper = true

[[clip]]
name = "2h/t_overhead_mocap"            # cut from above
from = "cmu:sword2h_overhead"           # CMU 02_07, frames 340-480 (F4 mocap, two-handed)
helper = true

[[clip]]
name = "2h/t_overhead"                # CMU has no fingers: closed grip from 2h/s_grip
layer = ["2h/t_overhead_mocap", "2h/s_grip"]
from_bone = ["thumb_01_l", "index_01_l", "middle_01_l", "ring_01_l", "pinky_01_l", "thumb_01_r", "index_01_r", "middle_01_r", "ring_01_r", "pinky_01_r"]
helper = true

[[clip]]
name = "2h/t_overhead_low"         # lunge and wolf height by key poses over the mocap
keyframe = "keyposes"
helper = true
[clip.params]
base = "2h/t_overhead"
keys = [[0, "rest"], [18, "rest"], [25, "low"], [29, "low"], [34, "rest"], [35, "rest"]]
[clip.params.poses.low]
rotate = { spine_02 = [["X", 20]], hand_r = [["X", -3], ["Y", -10], ["Z", -24]] }
move = { root = [0, -0.7, 0] }

[[clip]]
name = "2h/t_wide_mocap"            # wide horizontal cut from right to left
from = "cmu:sword2h_wide"           # CMU 02_07, frames 1652-1788 (F4 mocap, two-handed)
helper = true

[[clip]]
name = "2h/t_wide"                # CMU has no fingers: closed grip from 2h/s_grip
layer = ["2h/t_wide_mocap", "2h/s_grip"]
from_bone = ["thumb_01_l", "index_01_l", "middle_01_l", "ring_01_l", "pinky_01_l", "thumb_01_r", "index_01_r", "middle_01_r", "ring_01_r", "pinky_01_r"]
