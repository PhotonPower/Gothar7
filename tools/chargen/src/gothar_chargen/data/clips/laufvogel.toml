# Set "laufvogel" (large running bird; monster contract, characters-pipeline.md §7)
# -> monsters/laufvogel/anims/laufvogel.glb
# Source: Quaternius "5 Low poly animals" (Animals Pack), Chick, CC0 1.0 – only one action, a
# walk cycle in place (gothar-chargen monster turns it into laufvogel_clips.blend on the contract
# rig); everything else is a keyframe placeholder (animation-list.md status "platzhalter-K").
#
# Key poses rotate about world axes at rest (X = left, -Y = forward, Z = up; +X pitches the
# head down and swings a leg back, +Z turns left) and move root/pelvis in metres.

set = "laufvogel"
rig = "laufvogel"

[sources.src]
file = "laufvogel_clips.blend"
mapping = "identity"

# --- locomotion (root moves forward: contract §7) ---

[[clip]]
name = "laufvogel/s_walk_inplace"
from = "src:walk"
helper = true

[[clip]]
name = "laufvogel/s_idle"         # breathing, looking around
keyframe = "keyposes"
[clip.params]
keys = [[0, "rest"], [20, "look_l"], [40, "rest"], [60, "look_r"], [80, "rest"]]
[clip.params.poses.look_l]
rotate = { spine_01 = [["X", -2]], neck_01 = [["Z", 12]], head = [["Z", 10], ["X", -5]] }
[clip.params.poses.look_r]
rotate = { spine_01 = [["X", -2]], neck_01 = [["Z", -12]], head = [["Z", -10], ["X", 5]] }

# Own gait cycles (gaits.py): feet planted at exactly the clip speed, legs solved with IK.
# Speeds agreed with engine (2026-10-05): walk 1.3, run 6.5 m/s.

[[clip]]
name = "laufvogel/s_walk"         # long steps, the head bobs with every step
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 1.3
period = 16
duty = 0.625
lift = 0.08
bob = 0.015
nod = { bone = "neck_01", degrees = 5.0, phase = 0.25 }
legs = [
    { upper = "thigh_l", lower = "calf_l", foot = "foot_l", phase = 0.0, curl = 50 },
    { upper = "thigh_r", lower = "calf_r", foot = "foot_r", phase = 0.5, curl = 50 },
]

[[clip]]
name = "laufvogel/s_run"          # running with a flight phase, body leaning forward
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 6.5
period = 10
duty = 0.3
lift = 0.18
bob = 0.03
pitch = 3.0
nod = { bone = "neck_01", degrees = 6.0, phase = 0.5 }
legs = [
    { upper = "thigh_l", lower = "calf_l", foot = "foot_l", phase = 0.0, curl = 50 },
    { upper = "thigh_r", lower = "calf_r", foot = "foot_r", phase = 0.5, curl = 50 },
]

[[clip]]
name = "laufvogel/t_turn_l"
keyframe = "keyposes"
events = "footsteps"
[clip.params]
base = "laufvogel/s_walk_inplace"
keys = [[0, "rest"], [30, "turned"]]
[clip.params.poses.turned]
rotate = { root = [["Z", 90]] }

[[clip]]
name = "laufvogel/t_turn_r"
keyframe = "keyposes"
events = "footsteps"
[clip.params]
base = "laufvogel/s_walk_inplace"
keys = [[0, "rest"], [30, "turned"]]
[clip.params.poses.turned]
rotate = { root = [["Z", -90]] }

# --- combat ---

[[clip]]
name = "laufvogel/t_attack_1"     # beak strike forward
keyframe = "keyposes"
markers = { hit_start = 11, hit_end = 15 }
[clip.params]
keys = [[0, "rest"], [8, "wind_up"], [12, "strike"], [15, "strike"], [26, "rest"]]
[clip.params.poses.wind_up]
move = { pelvis = [0, 0.06, 0] }
rotate = { spine_01 = [["X", -10]], neck_01 = [["X", -20]], head = [["X", -10]] }
[clip.params.poses.strike]
move = { pelvis = [0, -0.12, -0.03] }
rotate = { spine_01 = [["X", 15]], neck_01 = [["X", 35]], head = [["X", 15]] }

[[clip]]
name = "laufvogel/t_attack_2"     # kick with the right foot
keyframe = "keyposes"
markers = { hit_start = 10, hit_end = 14 }
[clip.params]
keys = [[0, "rest"], [7, "lift"], [11, "kick"], [14, "kick"], [24, "rest"]]
[clip.params.poses.lift]
move = { pelvis = [0, 0.05, 0] }
rotate = { spine_01 = [["X", -8]], thigh_r = [["X", -45]], calf_r = [["X", 60]], neck_01 = [["X", -10]] }
[clip.params.poses.kick]
move = { pelvis = [0, 0.03, 0] }
rotate = { spine_01 = [["X", -12]], thigh_r = [["X", -60]], calf_r = [["X", -10]], foot_r = [["X", -20]], neck_01 = [["X", -15]] }

[[clip]]
name = "laufvogel/t_hit"
keyframe = "keyposes"
[clip.params]
keys = [[0, "rest"], [4, "flinch"], [16, "rest"]]
[clip.params.poses.flinch]
move = { pelvis = [0, 0.06, 0.02] }
rotate = { spine_01 = [["X", -10], ["Z", 6]], neck_01 = [["X", -20], ["Z", 10]], head = [["X", -15]] }

[[clip]]
name = "laufvogel/t_die"          # stagger, fall onto the side
keyframe = "keyposes"
[clip.params]
keys = [[0, "rest"], [8, "stagger"], [22, "fallen"], [36, "fallen_limp"]]
[clip.params.poses.stagger]
move = { pelvis = [0, 0.04, -0.08] }
rotate = { root = [["Y", 12]], neck_01 = [["X", 25]], head = [["X", 15]], thigh_l = [["X", -20]], calf_l = [["X", 30]] }
[clip.params.poses.fallen]
move = { root = [0, 0, 0.45] }
rotate = { root = [["Y", 88]], neck_01 = [["X", 40], ["Z", -20]], head = [["X", 10]], thigh_l = [["X", -30]], thigh_r = [["X", -10]], calf_l = [["X", 40]], calf_r = [["X", 20]] }
[clip.params.poses.fallen_limp]
move = { root = [0, 0, 0.44] }
rotate = { root = [["Y", 90]], neck_01 = [["X", 50], ["Z", -25]], head = [["X", 15]], thigh_l = [["X", -35]], thigh_r = [["X", -15]], calf_l = [["X", 45]], calf_r = [["X", 25]] }

# --- behaviour ---

[[clip]]
name = "laufvogel/s_eat"          # pecking at the ground (loop)
keyframe = "keyposes"
[clip.params]
keys = [[0, "low"], [8, "peck"], [16, "low"], [24, "peck"], [40, "low"]]
[clip.params.poses.low]
move = { pelvis = [0, 0.02, 0] }
rotate = { spine_01 = [["X", 20]], neck_01 = [["X", 45]], head = [["X", 20]] }
[clip.params.poses.peck]
move = { pelvis = [0, 0, 0] }
rotate = { spine_01 = [["X", 22]], neck_01 = [["X", 50]], head = [["X", 25]] }

[[clip]]
name = "laufvogel/s_sleep"        # sitting on folded legs, head tucked, breathing
keyframe = "keyposes"
[clip.params]
keys = [[0, "sit"], [40, "sit_in"], [80, "sit"]]
[clip.params.poses.sit]
move = { pelvis = [0, 0, -0.27] }
rotate = { thigh_l = [["X", -70]], thigh_r = [["X", -70]], calf_l = [["X", 150]], calf_r = [["X", 150]], foot_l = [["X", -60]], foot_r = [["X", -60]], neck_01 = [["X", 30]], head = [["X", 20]] }
[clip.params.poses.sit_in]
move = { pelvis = [0, 0, -0.26] }
rotate = { thigh_l = [["X", -70]], thigh_r = [["X", -70]], calf_l = [["X", 150]], calf_r = [["X", 150]], foot_l = [["X", -60]], foot_r = [["X", -60]], spine_01 = [["X", -2]], neck_01 = [["X", 28]], head = [["X", 20]] }

[[clip]]
name = "laufvogel/t_threaten"     # stretch tall, neck forward, hissing bob
keyframe = "keyposes"
[clip.params]
keys = [[0, "rest"], [10, "tall"], [18, "hiss"], [26, "tall"], [34, "hiss"], [44, "rest"]]
[clip.params.poses.tall]
move = { pelvis = [0, 0, 0.05] }
rotate = { spine_01 = [["X", -12]], neck_01 = [["X", 15]], head = [["X", -15]] }
[clip.params.poses.hiss]
move = { pelvis = [0, -0.03, 0.04] }
rotate = { spine_01 = [["X", -10]], neck_01 = [["X", 25]], head = [["X", -25]] }
