# Set "laufvogel" (large running bird; monster contract, characters-pipeline.md §7)
# -> monsters/laufvogel/anims/laufvogel.glb
# Own bird (gothar-chargen creature laufvogel, 2026-10-08): the clip source only holds the still
# action "rest". Walk and run are own gait cycles (gait); everything else is keyframed. neck_02,
# jaw (beak) and wing_l/r were added with engine; clip names, events and speeds stay as agreed.
#
# Key poses rotate about world axes at rest (X = left, -Y = forward, Z = up; +X pitches the
# head down, opens the beak and swings a leg back, +Z turns left; +Y on wing_l lifts the left
# wing) and move root/pelvis in metres.

set = "laufvogel"
rig = "laufvogel"

[sources.src]
file = "laufvogel_clips.blend"
mapping = "identity"

[[clip]]
name = "laufvogel/s_rest"
from = "src:rest"
helper = true

# --- locomotion (root moves forward: contract §7) ---

[[clip]]
name = "laufvogel/s_idle"         # breathing, jerky looks around, ruffling the wings
keyframe = "keyposes"
[clip.params]
base = "laufvogel/s_rest"
keys = [[0, "rest"], [14, "look_l"], [26, "look_l2"], [40, "rest"], [54, "look_r"], [64, "ruffle"], [80, "rest"]]
[clip.params.poses.look_l]
rotate = { spine_01 = [["X", -2]], neck_01 = [["Z", 10]], neck_02 = [["Z", 8]], head = [["Z", 12], ["X", -5]] }
[clip.params.poses.look_l2]
rotate = { spine_01 = [["X", -2]], neck_01 = [["Z", 10]], neck_02 = [["Z", 8]], head = [["Z", 20], ["Y", 12]] }
[clip.params.poses.look_r]
rotate = { spine_01 = [["X", -2]], neck_01 = [["Z", -12]], neck_02 = [["Z", -8]], head = [["Z", -10], ["X", 5]] }
[clip.params.poses.ruffle]
rotate = { neck_01 = [["Z", -6]], wing_l = [["Y", 12]], wing_r = [["Y", -12]] }

# Own gait cycles (gaits.py): feet planted at exactly the clip speed, legs solved with IK.
# Speeds agreed with engine (2026-10-05): walk 1.3, run 6.5 m/s.

[[clip]]
name = "laufvogel/s_walk"         # long steps, the head bobs with every step
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 1.3
period = 16
duty = 0.625
lift = 0.08
bob = 0.015
nod = { bone = "neck_02", degrees = 5.0, phase = 0.25 }
legs = [
    { upper = "thigh_l", lower = "calf_l", foot = "foot_l", phase = 0.0, curl = 50 },
    { upper = "thigh_r", lower = "calf_r", foot = "foot_r", phase = 0.5, curl = 50 },
]

[[clip]]
name = "laufvogel/s_run"          # running with a flight phase, body and neck stretched forward
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 6.5
period = 10
duty = 0.3
lift = 0.18
bob = 0.03
pitch = 3.0
nod = { bone = "neck_02", degrees = 6.0, phase = 0.5 }
pose = { neck_01 = [["X", 18]], neck_02 = [["X", 8]], head = [["X", -14]], wing_l = [["Y", 15]], wing_r = [["Y", -15]] }
legs = [
    { upper = "thigh_l", lower = "calf_l", foot = "foot_l", phase = 0.0, curl = 50 },
    { upper = "thigh_r", lower = "calf_r", foot = "foot_r", phase = 0.5, curl = 50 },
]

[[clip]]
name = "laufvogel/s_step_inplace" # base of the turns: stepping on the spot
keyframe = "gait"
helper = true
[clip.params]
speed = 0.0
period = 16
duty = 0.625
lift = 0.07
legs = [
    { upper = "thigh_l", lower = "calf_l", foot = "foot_l", phase = 0.0, curl = 50 },
    { upper = "thigh_r", lower = "calf_r", foot = "foot_r", phase = 0.5, curl = 50 },
]

[[clip]]
name = "laufvogel/t_turn_l"
keyframe = "keyposes"
events = "footsteps"
[clip.params]
base = "laufvogel/s_step_inplace"
keys = [[0, "rest"], [32, "turned"]]
[clip.params.poses.turned]
rotate = { root = [["Z", 90]] }

[[clip]]
name = "laufvogel/t_turn_r"
keyframe = "keyposes"
events = "footsteps"
[clip.params]
base = "laufvogel/s_step_inplace"
keys = [[0, "rest"], [32, "turned"]]
[clip.params.poses.turned]
rotate = { root = [["Z", -90]] }

