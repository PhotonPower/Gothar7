# Set "schinder" (monster contract, characters-pipeline.md §7) -> monsters/schinder/anims/schinder.glb
# Own creature (gothar-chargen creature schinder): the clip source schinder_clips.blend only holds the
# still action "rest" (bind pose). Gaits are own cycles (gait), everything else keyframe placeholders.
# Speeds agreed with engine (2026-10-07): walk 1.3, run 6.5, sneak 0.7 m/s; attacks with
# hit_start/hit_end like the wolf; extra clips s_sneak, t_call (event call), s_cower.
#
# Key poses rotate about world axes at rest (X = left, -Y = forward, Z = up; +X pitches the head
# down, opens the jaw, swings a leg back and lifts the tail, +Z turns left) and move root/pelvis.

set = "schinder"
rig = "schinder"

[sources.src]
file = "schinder_clips.blend"
mapping = "identity"

[[clip]]
name = "schinder/s_rest"
from = "src:rest"
helper = true

[[clip]]
name = "schinder/s_idle"           # standing, head low, sniffing and looking about
keyframe = "keyposes"
[clip.params]
base = "schinder/s_rest"
keys = [[0, "stand"], [12, "sniff"], [22, "stand"], [34, "look"], [46, "look_ear"], [60, "stand"]]
[clip.params.poses.stand]
rotate = { neck_01 = [["X", 8]], head = [["X", 4]], tail_01 = [["X", 8]] }
[clip.params.poses.sniff]
move = { pelvis = [0, 0, -0.008] }
rotate = { spine_01 = [["X", 1.5]], neck_01 = [["X", 18]], head = [["X", 10]], ear_l = [["X", -10]], ear_r = [["X", -10]], tail_01 = [["X", 6]] }
[clip.params.poses.look]
rotate = { neck_01 = [["X", 4], ["Z", 18]], head = [["Z", 10], ["X", -4]], ear_l = [["Z", 10]], tail_01 = [["X", 8], ["Z", -8]] }
[clip.params.poses.look_ear]
rotate = { neck_01 = [["X", 4], ["Z", 14]], head = [["Z", 8], ["X", -2]], ear_l = [["Z", 20], ["X", -15]], ear_r = [["X", 10]], tail_01 = [["X", 10], ["Z", 6]] }

# --- locomotion (root moves forward: contract §7) ---

[[clip]]
name = "schinder/s_walk"           # lateral-sequence walk, head nodding low
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 1.3
period = 16                         # phases and duty on whole frames
duty = 0.625
lift = 0.06
crouch = 0.02
bob = 0.01
nod = { bone = "neck_01", degrees = 3.0, phase = 0.0 }
tail = { bones = ["tail_01", "tail_02", "tail_03"], degrees = 5, lag = 0.08 }
legs = [
    { upper = "back_upper_l", lower = "back_lower_l", foot = "back_foot_l", phase = 0.0, curl = 35 },
    { upper = "front_upper_l", lower = "front_lower_l", foot = "front_foot_l", phase = 0.25, curl = -70 },
    { upper = "back_upper_r", lower = "back_lower_r", foot = "back_foot_r", phase = 0.5, curl = 35 },
    { upper = "front_upper_r", lower = "front_lower_r", foot = "front_foot_r", phase = 0.75, curl = -70 },
]

[[clip]]
name = "schinder/s_run"            # loping gallop, the spine flexes
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 6.5
period = 10
duty = 0.22
lift = 0.12
crouch = 0.05
bob = 0.03
bob_cycles = 1
pitch = 4.0
flex = { bone = "spine_01", degrees = 8.0, phase = 0.25 }
nod = { bone = "neck_01", degrees = 6.0, phase = 0.5 }
tail = { bones = ["tail_01", "tail_02", "tail_03"], degrees = 10, lag = 0.08 }
legs = [
    { upper = "back_upper_l", lower = "back_lower_l", foot = "back_foot_l", phase = 0.0, curl = 35 },
    { upper = "front_upper_l", lower = "front_lower_l", foot = "front_foot_l", phase = 0.6, curl = -70 },
    { upper = "back_upper_r", lower = "back_lower_r", foot = "back_foot_r", phase = 0.1, curl = 35 },
    { upper = "front_upper_r", lower = "front_lower_r", foot = "front_foot_r", phase = 0.5, curl = -70 },
]

[[clip]]
name = "schinder/s_sneak"          # circling prey: crouched, head low and forward, ears back
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 0.7
period = 20                         # duty * period on whole frames
duty = 0.7
lift = 0.05
crouch = 0.09
bob = 0.005
nod = { bone = "neck_01", degrees = 1.5, phase = 0.0 }
tail = { bones = ["tail_01", "tail_02", "tail_03"], degrees = 3, lag = 0.08 }
pose = { spine_02 = [["X", 4]], neck_01 = [["X", 22]], head = [["X", -14]], ear_l = [["X", 30]], ear_r = [["X", 30]], tail_01 = [["X", 20]] }
legs = [
    { upper = "back_upper_l", lower = "back_lower_l", foot = "back_foot_l", phase = 0.0, curl = 35 },
    { upper = "front_upper_l", lower = "front_lower_l", foot = "front_foot_l", phase = 0.25, curl = -70 },
    { upper = "back_upper_r", lower = "back_lower_r", foot = "back_foot_r", phase = 0.5, curl = 35 },
    { upper = "front_upper_r", lower = "front_lower_r", foot = "front_foot_r", phase = 0.75, curl = -70 },
]

[[clip]]
name = "schinder/s_step_inplace"   # base of the turns
keyframe = "gait"
helper = true
[clip.params]
speed = 0.0
period = 30
duty = 0.7
lift = 0.05
crouch = 0.02
legs = [
    { upper = "back_upper_l", lower = "back_lower_l", foot = "back_foot_l", phase = 0.0, curl = 35 },
    { upper = "front_upper_l", lower = "front_lower_l", foot = "front_foot_l", phase = 0.25, curl = -70 },
    { upper = "back_upper_r", lower = "back_lower_r", foot = "back_foot_r", phase = 0.5, curl = 35 },
    { upper = "front_upper_r", lower = "front_lower_r", foot = "front_foot_r", phase = 0.75, curl = -70 },
]

[[clip]]
name = "schinder/t_turn_l"
keyframe = "keyposes"
events = "footsteps"
[clip.params]
base = "schinder/s_step_inplace"
keys = [[0, "rest"], [30, "turned"]]
[clip.params.poses.turned]
rotate = { root = [["Z", 90]] }

[[clip]]
name = "schinder/t_turn_r"
keyframe = "keyposes"
events = "footsteps"
[clip.params]
base = "schinder/s_step_inplace"
keys = [[0, "rest"], [30, "turned"]]
[clip.params.poses.turned]
rotate = { root = [["Z", -90]] }

