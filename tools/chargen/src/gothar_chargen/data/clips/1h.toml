# Set "1h" -> assets/source/characters/anims/human/1h.glb (Prio B, placeholders)
# One-handed weapon: stance = Quaternius UAL1 Sword_Idle.
# Locomotion: arms and head from the stance, legs, pelvis and spine from the none clips
# (keeps the spine counter-rotation of strafe/turn; the stance's spine posture is dropped).

set = "1h"
depends = ["none"]

[sources.ual1]
file = "AnimationLibrary_Godot_Standard.glb"
mapping = "quaternius_ual1"

[[clip]]
name = "1h/s_idle"
from = "ual1:Sword_Idle"

[[clip]]
name = "1h/s_walk"
layer = ["none/s_walk", "1h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "1h/s_run"
layer = ["none/s_run", "1h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "1h/s_walk_back"
layer = ["none/s_walk_back", "1h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "1h/s_strafe_l"
layer = ["none/s_strafe_l", "1h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "1h/s_strafe_r"
layer = ["none/s_strafe_r", "1h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "1h/t_turn_l"
layer = ["none/t_turn_l", "1h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "1h/t_turn_r"
layer = ["none/t_turn_r", "1h/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

# --- drawing and sheathing (M9 C1; played as an overlay from spine_02, no root motion) ---------
# The right hand reaches across the belly towards the grip at socket_hip_1h (event draw: the engine
# moves the weapon into socket_hand_r), then lifts it into the stance. Sheathing runs backwards.

[[clip]]
name = "1h/s_reach"
keyframe = "keyposes"
params = { base = "none/s_idle", keys = [[0, "reach"], [10, "reach"]], poses = { reach = { rotate = { spine_02 = [["Z", 45]], clavicle_r = [["Z", 20]], upperarm_r = [["X", -30], ["Y", 30], ["Z", 30]], lowerarm_r = [["X", 30], ["Y", -30]] } } } }
helper = true

[[clip]]
name = "1h/t_reach"
blend = ["none/s_idle", "1h/s_reach"]
frames = 10
helper = true

[[clip]]
name = "1h/t_lift"
blend = ["1h/s_reach", "1h/s_idle"]
frames = 14
helper = true

[[clip]]
name = "1h/t_draw"
chain = ["1h/t_reach", "1h/t_lift"]
markers = { draw = 10 }

[[clip]]
name = "1h/t_sheath"
reverse = "1h/t_draw"
markers = { sheath = 15 }
