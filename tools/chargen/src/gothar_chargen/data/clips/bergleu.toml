# Set "bergleu" (monster contract, characters-pipeline.md §7) -> monsters/bergleu/anims/bergleu.glb
# Boss (gothar-chargen creature bergleu): the clip source only holds the still action "rest". Gaits
# are own cycles (gait), everything else keyframe placeholders.
# Agreed with engine (2026-10-08): walk 1.5, run 8.0, s_stalk 1.0 m/s (root motion); t_pounce in
# place (~5 m, leap_start / leap_land, hit_start/hit_end around the landing); t_tail_lash with
# hit_start/hit_end (hits around socket_tail); the mane moves only in the clips (mane_*); t_rage
# then the normal clips at ~1.3 times the rate; t_hit and t_stagger (also after a parried swipe).
#
# Key poses rotate about world axes at rest (X = left, -Y = forward, Z = up; +X pitches the head
# down, opens the jaw, swings a leg back and lifts the tail, +Z turns left) and move root/pelvis.

set = "bergleu"
rig = "bergleu"

[sources.src]
file = "bergleu_clips.blend"
mapping = "identity"

[[clip]]
name = "bergleu/s_rest"
from = "src:rest"
helper = true

[[clip]]
name = "bergleu/s_idle"            # heavy breathing, mane and tail swaying, looking about
keyframe = "keyposes"
[clip.params]
base = "bergleu/s_rest"
keys = [[0, "stand"], [20, "breathe"], [40, "look"], [60, "stand"]]
[clip.params.poses.stand]
rotate = { neck_01 = [["X", 4]], tail_01 = [["X", -6]], tail_04 = [["Z", 10]], tail_05 = [["Z", 15]] }
[clip.params.poses.breathe]
move = { pelvis = [0, 0, 0.01] }
rotate = { spine_03 = [["X", -1.5]], neck_01 = [["X", 2]], mane_back = [["X", -3]], tail_01 = [["X", -4]], tail_04 = [["Z", -8]], tail_05 = [["Z", -14]] }
[clip.params.poses.look]
rotate = { neck_01 = [["X", 2], ["Z", 18]], head = [["Z", 8]], mane_l = [["Z", 5]], tail_01 = [["X", -6], ["Z", -8]], tail_04 = [["Z", 12]], tail_05 = [["Z", 18]] }

# --- locomotion ---

[[clip]]
name = "bergleu/s_walk"            # heavy prowl (lateral sequence)
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 1.5
period = 32                         # phases and duty on whole frames
duty = 0.625
lift = 0.10
crouch = 0.02
bob = 0.02
pitch = 1.5
nod = { bone = "neck_01", degrees = 3.0, phase = 0.0 }
tail = { bones = ["tail_01", "tail_02", "tail_03", "tail_04", "tail_05"], degrees = 4, lag = 0.08 }
legs = [
    { upper = "back_upper_l", lower = "back_lower_l", foot = "back_foot_l", phase = 0.0, curl = 25 },
    { upper = "front_upper_l", lower = "front_lower_l", foot = "front_foot_l", phase = 0.25, curl = -45 },
    { upper = "back_upper_r", lower = "back_lower_r", foot = "back_foot_r", phase = 0.5, curl = 25 },
    { upper = "front_upper_r", lower = "front_lower_r", foot = "front_foot_r", phase = 0.75, curl = -45 },
]

