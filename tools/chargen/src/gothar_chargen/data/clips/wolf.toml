# Set "wolf" (monster contract, characters-pipeline.md §7) -> monsters/wolf/anims/wolf.glb
# Own wolf (gothar-chargen creature wolf, 2026-10-08): the clip source only holds the still action
# "rest". Walk, trot and gallop are own gait cycles (gait); everything else is keyframed. jaw and
# ear_l/r were added with engine; clip names, events and speeds stay as agreed.
#
# Key poses rotate about world axes at rest (X = left, -Y = forward, Z = up; +X pitches the
# head down and swings a leg back, +Z turns left) and move root/pelvis in metres.

set = "wolf"
rig = "wolf"

[sources.src]
file = "wolf_clips.blend"
mapping = "identity"

# --- locomotion (root moves forward: contract §7) ---

[[clip]]
name = "wolf/s_rest"
from = "src:rest"
helper = true

[[clip]]
name = "wolf/s_idle"              # breathing, ears flick, looking about, tail sways
keyframe = "keyposes"
[clip.params]
base = "wolf/s_rest"
keys = [[0, "stand"], [15, "breathe"], [30, "look"], [42, "ear_flick"], [60, "stand"]]
[clip.params.poses.stand]
rotate = { neck_01 = [["X", 3]], tail_01 = [["X", 4]], tail_03 = [["Z", 6]] }
[clip.params.poses.breathe]
move = { pelvis = [0, 0, 0.004] }
rotate = { spine_01 = [["X", -1.5]], neck_01 = [["X", 1]], tail_01 = [["X", 2]], tail_03 = [["Z", -6]] }
[clip.params.poses.look]
rotate = { neck_01 = [["X", 1], ["Z", 20]], head = [["Z", 10]], ear_l = [["Z", 12]], tail_01 = [["X", 3], ["Z", -6]], tail_03 = [["Z", 8]] }
[clip.params.poses.ear_flick]
rotate = { neck_01 = [["X", 2], ["Z", 8]], head = [["Z", 4]], ear_r = [["X", 25]], tail_03 = [["Z", -4]] }

# Own gait cycles (gaits.py): feet planted at exactly the clip speed, legs solved with IK.
# Speeds agreed with engine (2026-10-05): walk 1.2, trot 3.0, run (gallop) 6.0 m/s.

[[clip]]
name = "wolf/s_walk"              # lateral-sequence walk: left hind, left fore, right hind, right fore
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 1.2
period = 16                        # phases and duty on whole frames
duty = 0.625
lift = 0.06
crouch = 0.02
bob = 0.008
nod = { bone = "neck_01", degrees = 2.5, phase = 0.0 }
tail = { bones = ["tail_01", "tail_02", "tail_03", "tail_04"], degrees = 5, lag = 0.08 }
legs = [
    { upper = "back_upper_l", lower = "back_lower_l", foot = "back_foot_l", phase = 0.0, curl = 35 },
    { upper = "front_upper_l", lower = "front_lower_l", foot = "front_foot_l", phase = 0.25, curl = -70 },
    { upper = "back_upper_r", lower = "back_lower_r", foot = "back_foot_r", phase = 0.5, curl = 35 },
    { upper = "front_upper_r", lower = "front_lower_r", foot = "front_foot_r", phase = 0.75, curl = -70 },
]

[[clip]]
name = "wolf/s_trot"              # trot: diagonal pairs
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 3.0
period = 10
duty = 0.4
lift = 0.09
crouch = 0.03
bob = 0.012
nod = { bone = "neck_01", degrees = 3.0, phase = 0.25 }
tail = { bones = ["tail_01", "tail_02", "tail_03", "tail_04"], degrees = 7, lag = 0.08 }
legs = [
    { upper = "back_upper_l", lower = "back_lower_l", foot = "back_foot_l", phase = 0.0, curl = 35 },
    { upper = "front_upper_l", lower = "front_lower_l", foot = "front_foot_l", phase = 0.5, curl = -70 },
    { upper = "back_upper_r", lower = "back_lower_r", foot = "back_foot_r", phase = 0.5, curl = 35 },
    { upper = "front_upper_r", lower = "front_lower_r", foot = "front_foot_r", phase = 0.0, curl = -70 },
]

[[clip]]
name = "wolf/s_run"               # rotary gallop: hind legs, then fore legs; the spine flexes
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 6.0
period = 10
duty = 0.22
lift = 0.12
crouch = 0.05
bob = 0.03
bob_cycles = 1
pitch = 4.0
flex = { bone = "spine_01", degrees = 8.0, phase = 0.25 }
nod = { bone = "neck_01", degrees = 6.0, phase = 0.5 }
tail = { bones = ["tail_01", "tail_02", "tail_03", "tail_04"], degrees = 10, lag = 0.08 }
legs = [
    { upper = "back_upper_l", lower = "back_lower_l", foot = "back_foot_l", phase = 0.0, curl = 35 },
    { upper = "front_upper_l", lower = "front_lower_l", foot = "front_foot_l", phase = 0.6, curl = -70 },
    { upper = "back_upper_r", lower = "back_lower_r", foot = "back_foot_r", phase = 0.1, curl = 35 },
    { upper = "front_upper_r", lower = "front_lower_r", foot = "front_foot_r", phase = 0.5, curl = -70 },
]

[[clip]]
name = "wolf/s_step_inplace"      # base of the turns: stepping on the spot
keyframe = "gait"
helper = true
[clip.params]
speed = 0.0
period = 16
duty = 0.625
lift = 0.05
legs = [
    { upper = "back_upper_l", lower = "back_lower_l", foot = "back_foot_l", phase = 0.0, curl = 35 },
    { upper = "front_upper_l", lower = "front_lower_l", foot = "front_foot_l", phase = 0.25, curl = -70 },
    { upper = "back_upper_r", lower = "back_lower_r", foot = "back_foot_r", phase = 0.5, curl = 35 },
    { upper = "front_upper_r", lower = "front_lower_r", foot = "front_foot_r", phase = 0.75, curl = -70 },
]

[[clip]]
name = "wolf/t_turn_l"
keyframe = "keyposes"
events = "footsteps"
[clip.params]
base = "wolf/s_step_inplace"
keys = [[0, "rest"], [32, "turned"]]
[clip.params.poses.turned]
rotate = { root = [["Z", 90]] }

[[clip]]
name = "wolf/t_turn_r"
keyframe = "keyposes"
events = "footsteps"
[clip.params]
base = "wolf/s_step_inplace"
keys = [[0, "rest"], [32, "turned"]]
[clip.params.poses.turned]
rotate = { root = [["Z", -90]] }

