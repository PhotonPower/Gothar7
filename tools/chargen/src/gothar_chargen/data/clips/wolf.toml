# --- transformation (M12, agreed with engine 2026-10-08): 0.8 s each; at "swap" engine replaces the
# model (wolf <-> none); _in ends in the s_idle stance ---

[[clip]]
name = "wolf/t_transform_in"      # crouched and trembling, rises and shakes its fur, ends as s_idle
keyframe = "keyposes"
[clip.params]
base = "wolf/s_rest"
keys = [[0, "huddle"], [8, "rise"], [14, "shake_l"], [18, "shake_r"], [24, "stand"]]
