# Set "none" (no weapon) -> assets/source/characters/anims/human/none.glb
# Sources: Quaternius Universal Animation Library 1 + 2 [Standard], CC0 1.0 (opengameart.org).
# Same rest pose as the reference rig: clips transfer by renaming bones (data/mappings/).
# All clips here are placeholders (animation-list.md status "platzhalter").

set = "none"

[sources.ual1]
file = "AnimationLibrary_Godot_Standard.glb"
mapping = "quaternius_ual1"

[sources.ual2]
file = "UAL2_Standard.glb"
mapping = "quaternius_ual2"

# --- locomotion ---

[[clip]]
name = "none/s_idle"
from = "ual1:Idle_Loop"

[[clip]]
name = "none/s_walk"
from = "ual1:Walk_Loop"
events = "footsteps"

[[clip]]
name = "none/s_run"
from = "ual1:Jog_Fwd_Loop"
events = "footsteps"

[[clip]]
name = "none/s_sneak"
from = "ual1:Crouch_Fwd_Loop"
events = "footsteps"

[[clip]]
name = "none/s_walk_back"
reverse = "none/s_walk"
events = "footsteps"

# --- transitions (cross-fades) ---

[[clip]]
name = "none/t_walk_2_run"
blend = ["none/s_walk", "none/s_run"]
frames = 10

[[clip]]
name = "none/t_run_2_walk"
blend = ["none/s_run", "none/s_walk"]
frames = 10

[[clip]]
name = "none/t_run_stop"
blend = ["none/s_run", "none/s_idle"]
frames = 12

# --- jumping and falling (in place: physics moves the character) ---

[[clip]]
name = "none/t_jump_start"
from = "ual1:Jump_Start"

[[clip]]
name = "none/s_jump_air"
from = "ual1:Jump_Loop"

[[clip]]
name = "none/t_jump_land"
from = "ual1:Jump_Land"
events = "land"

[[clip]]
name = "none/t_jump_run"
concat = ["ual1:Jump_Loop[0:20]", "ual1:Jump_Land"]
events = "land"

[[clip]]
name = "none/s_fall"
from = "ual2:NinjaJump_Idle_Loop"

[[clip]]
name = "none/t_fall_land_hard"
from = "ual2:NinjaJump_Land"
events = "land"

# --- climbing (root motion) ---

[[clip]]
name = "none/t_climb_low"
from = "ual2:ClimbUp_1m_RM"

# --- keyframe placeholders (animation-list.md: platzhalter-K, replace with mocap in F4) ---

[[clip]]
name = "none/s_strafe_l"
keyframe = "strafe"
params = { base = "none/s_walk", side = "l", yaw = 70 }
events = "footsteps"

[[clip]]
name = "none/s_strafe_r"
keyframe = "strafe"
params = { base = "none/s_walk", side = "r", yaw = 70 }
events = "footsteps"

[[clip]]
name = "none/t_turn_l"
keyframe = "turn"
params = { idle = "none/s_idle", walk = "none/s_walk", side = "l", frames = 30 }
events = "footsteps"

[[clip]]
name = "none/t_turn_r"
keyframe = "turn"
params = { idle = "none/s_idle", walk = "none/s_walk", side = "r", frames = 30 }
events = "footsteps"

[[clip]]
name = "none/t_climb_mid"            # heights match engine's ledge classes (as of 2026-10-03):
keyframe = "scale_root"               # low <= 1.0, mid <= 1.6, high <= 2.2 m; engine only scales down
params = { base = "none/t_climb_low", base_height = 1.0, height = 1.6, time = 1.4 }

[[clip]]
name = "none/t_climb_high"
keyframe = "scale_root"
params = { base = "none/t_climb_low", base_height = 1.0, height = 2.2, time = 1.75 }

[[clip]]
name = "none/t_ladder_on"
keyframe = "ladder_on"
params = { idle = "none/s_idle", frames = 20, forward = 0.3, up = 0.2 }

[[clip]]
name = "none/s_ladder_up"
keyframe = "ladder"
params = { direction = "up", frames = 40, rise = 0.6 }

[[clip]]
name = "none/s_ladder_down"
keyframe = "ladder"
params = { direction = "down", frames = 40, rise = 0.6 }

[[clip]]
name = "none/t_ladder_off"
keyframe = "ladder_off"
params = { idle = "none/s_idle", frames = 30, forward = 0.4, up = 0.9 }

[[clip]]
name = "none/s_slide"
keyframe = "slide"
params = { frames = 40 }

[[clip]]
name = "none/t_slide"
blend = ["none/s_run", "none/s_slide"]
frames = 12

# --- item use (Prio B, M8; placeholders from Quaternius UAL2, replace with mocap in F4) ---

[[clip]]
name = "none/t_pickup_ground"
from = "ual2:Farm_Harvest"
markers = { pickup = 36 }

[[clip]]
name = "none/t_pickup_high"
from = "ual1:PickUp_Table"
markers = { pickup = 8 }

[[clip]]
name = "none/t_eat"
keyframe = "keyposes"
params = { base = "none/s_idle", keys = [[0, "rest"], [14, "bite"], [20, "chew"], [28, "bite"], [42, "rest"]], poses = { bite = { rotate = { upperarm_r = [["Y", -85]], lowerarm_r = [["Y", -110]] }, twist = { lowerarm_r = -150 } }, chew = { rotate = { upperarm_r = [["Y", -75]], lowerarm_r = [["Y", -95]] }, twist = { lowerarm_r = -150 } } } }
markers = { use = 14, item_from_hand = 32 }

[[clip]]
name = "none/t_drink"
keyframe = "keyposes"
params = { base = "none/s_idle", keys = [[0, "rest"], [14, "sip"], [34, "sip"], [46, "rest"]], poses = { sip = { rotate = { upperarm_r = [["Y", -85]], lowerarm_r = [["Y", -110]], neck = [["X", -15]] }, twist = { lowerarm_r = -150 } } } }
markers = { use = 24, item_from_hand = 38 }

[[clip]]
name = "none/t_read_scroll"
keyframe = "keyposes"
params = { base = "none/s_idle", keys = [[0, "rest"], [20, "read"], [70, "read"], [90, "rest"]], poses = { read = { rotate = { upperarm_r = [["Y", -40]], lowerarm_r = [["Y", -80]], upperarm_l = [["Y", 40]], lowerarm_l = [["Y", 80]], neck = [["X", 20]] } } } }
markers = { use = 45 }

[[clip]]
name = "none/t_pickpocket"
from = "ual1:Interact"

# --- idle variants and reactions (Prio C, M9; keyframe placeholders, mocap in F4) -----------------

[[clip]]
name = "none/s_idle_look"
keyframe = "keyposes"
params = { base = "none/s_idle", keys = [[0, "rest"], [25, "left"], [60, "left"], [90, "right"], [125, "right"], [150, "rest"]], poses = { left = { rotate = { neck = [["Z", 20]], head = [["Z", 20]], spine_03 = [["Z", 8]] } }, right = { rotate = { neck = [["Z", -20]], head = [["Z", -20]], spine_03 = [["Z", -8]] } } } }

[[clip]]
name = "none/t_idle_scratch"
keyframe = "keyposes"
params = { base = "none/s_idle", keys = [[0, "rest"], [18, "a"], [26, "b"], [34, "a"], [42, "b"], [50, "a"], [66, "rest"]], poses = { a = { rotate = { upperarm_r = [["X", -150]], lowerarm_r = [["X", 30], ["Y", -90]], neck = [["X", 10], ["Z", -8]] } }, b = { rotate = { upperarm_r = [["X", -145]], lowerarm_r = [["X", 25], ["Y", -100]], neck = [["X", 10], ["Z", -8]] } } } }

[[clip]]
name = "none/t_warn"
keyframe = "keyposes"
params = { base = "none/s_idle", keys = [[0, "rest"], [10, "up"], [20, "wag"], [28, "up"], [36, "wag"], [56, "rest"]], poses = { up = { rotate = { upperarm_r = [["X", -120]], lowerarm_r = [["Y", -60]], spine_02 = [["X", 6]], neck = [["X", 8]] } }, wag = { rotate = { upperarm_r = [["X", -115]], lowerarm_r = [["Y", -75]], spine_02 = [["X", 6]], neck = [["X", 8]] } } } }

[[clip]]
name = "none/t_point"
keyframe = "keyposes"
params = { base = "none/s_idle", keys = [[0, "rest"], [14, "point"], [44, "point"], [60, "rest"]], poses = { point = { rotate = { upperarm_r = [["X", -90], ["Y", 30], ["Z", 30]], lowerarm_r = [["X", 30], ["Y", 30]], spine_02 = [["Z", -6]], neck = [["Z", -5]] } } } }

[[clip]]
name = "none/t_surprised"
keyframe = "keyposes"
params = { base = "none/s_idle", keys = [[0, "rest"], [6, "jolt"], [30, "jolt"], [50, "rest"]], poses = { jolt = { move = { pelvis = [0.0, 0.05, -0.02] }, rotate = { spine_02 = [["X", -10]], neck = [["X", -12]], upperarm_r = [["Y", -35]], upperarm_l = [["Y", 35]], lowerarm_r = [["Y", -60]], lowerarm_l = [["Y", 60]] } } } }

[[clip]]
name = "none/t_search"
keyframe = "keyposes"
params = { base = "none/s_idle", keys = [[0, "rest"], [22, "left"], [50, "left"], [80, "right"], [108, "right"], [130, "rest"]], poses = { left = { rotate = { spine_02 = [["Z", 25], ["X", 8]], neck = [["Z", 20]], head = [["Z", 10]] } }, right = { rotate = { spine_02 = [["Z", -25], ["X", 8]], neck = [["Z", -20]], head = [["Z", -10]] } } } }

# --- hits, death, knock-out (M11) ---

[[clip]]
name = "none/t_hit_light"
from = "ual1:Hit_Chest"

[[clip]]
name = "none/t_die_src"
from = "ual1:Death01"
helper = true

[[clip]]
name = "none/t_knock_src"
from = "ual2:Hit_Knockback"
helper = true

[[clip]]
name = "none/t_getup_src"
from = "ual2:LayToIdle"
helper = true

[[clip]]
name = "none/t_die_back"          # falls onto the back and stays lying (no loop)
from = "ual1:Death01"

[[clip]]
name = "none/t_die_front"         # own keyframes: staggers, sinks to the knees, falls on the face
keyframe = "keyposes"
[clip.params]
base = "none/s_idle"
keys = [[0, "rest"], [6, "hit"], [16, "knees"], [26, "fall"], [32, "prone"], [50, "prone"]]
[clip.params.poses.hit]
rotate = { spine_01 = [["X", 12]], spine_02 = [["X", 10]], neck = [["X", 10]] }
move = { pelvis = [0, -0.05, -0.05] }
[clip.params.poses.knees]
rotate = { pelvis = [["X", 15]], spine_02 = [["X", 15]], thigh_l = [["X", -75]], thigh_r = [["X", -70]], calf_l = [["X", 110]], calf_r = [["X", 105]], upperarm_l = [["X", -20]], upperarm_r = [["X", -20]] }
move = { pelvis = [0, -0.1, -0.45] }
[clip.params.poses.fall]
rotate = { pelvis = [["X", 65]], spine_02 = [["X", 5]], thigh_l = [["X", -30]], thigh_r = [["X", -25]], calf_l = [["X", 50]], calf_r = [["X", 45]], upperarm_l = [["X", -70]], upperarm_r = [["X", -70]] }
move = { pelvis = [0, -0.35, -0.7] }
[clip.params.poses.prone]
rotate = { pelvis = [["X", 88]], neck = [["Z", 30]], thigh_l = [["X", -5]], thigh_r = [["X", 0]], calf_l = [["X", 10]], calf_r = [["X", 5]], upperarm_l = [["X", -150], ["Z", 20]], upperarm_r = [["X", -150], ["Z", -20]] }
move = { pelvis = [0, -0.55, -0.82] }

[[clip]]
name = "none/t_ko"                # knocked out: thrown back onto the back, ends in the s_ko pose
from = "ual2:Hit_Knockback"

[[clip]]
name = "none/s_ko"                # lying unconscious, breathing (the last pose of t_ko)
keyframe = "hold"
params = { base = "none/t_ko", frame = -1, frames = 60 }

[[clip]]
name = "none/t_ko_getup"          # gets up from the s_ko pose
keyframe = "framed"
params = { base = "none/t_getup_src", stance = "none/s_ko", stance_frame = 0, fade_in = 8, fade_out = 0 }
