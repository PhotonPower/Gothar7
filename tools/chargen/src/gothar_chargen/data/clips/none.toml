# Set "none" (no weapon) -> assets/source/characters/anims/human/none.glb
# Sources: Quaternius Universal Animation Library 1 + 2 [Standard], CC0 1.0 (opengameart.org).
# Same rest pose as the reference rig: clips transfer by renaming bones (data/mappings/).
# All clips here are placeholders (animation-list.md status "platzhalter").

set = "none"

[sources.ual1]
file = "AnimationLibrary_Godot_Standard.glb"
mapping = "quaternius_ual1"

[sources.ual2]
file = "UAL2_Standard.glb"
mapping = "quaternius_ual2"

# --- locomotion ---

[[clip]]
name = "none/s_idle"
from = "ual1:Idle_Loop"

[[clip]]
name = "none/s_walk"
from = "ual1:Walk_Loop"
events = "footsteps"

[[clip]]
name = "none/s_run"
from = "ual1:Jog_Fwd_Loop"
events = "footsteps"

[[clip]]
name = "none/s_sneak"
from = "ual1:Crouch_Fwd_Loop"
events = "footsteps"

[[clip]]
name = "none/s_walk_back"
reverse = "none/s_walk"
events = "footsteps"

# --- transitions (cross-fades) ---

[[clip]]
name = "none/t_walk_2_run"
blend = ["none/s_walk", "none/s_run"]
frames = 10

[[clip]]
name = "none/t_run_2_walk"
blend = ["none/s_run", "none/s_walk"]
frames = 10

[[clip]]
name = "none/t_run_stop"
blend = ["none/s_run", "none/s_idle"]
frames = 12

# --- jumping and falling (in place: physics moves the character) ---

[[clip]]
name = "none/t_jump_start"
from = "ual1:Jump_Start"

[[clip]]
name = "none/s_jump_air"
from = "ual1:Jump_Loop"

[[clip]]
name = "none/t_jump_land"
from = "ual1:Jump_Land"
events = "land"

[[clip]]
name = "none/t_jump_run"
concat = ["ual1:Jump_Loop[0:20]", "ual1:Jump_Land"]
events = "land"

[[clip]]
name = "none/s_fall"
from = "ual2:NinjaJump_Idle_Loop"

[[clip]]
name = "none/t_fall_land_hard"
from = "ual2:NinjaJump_Land"
events = "land"

# --- climbing (root motion) ---

[[clip]]
name = "none/t_climb_low"
from = "ual2:ClimbUp_1m_RM"
