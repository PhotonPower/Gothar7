# Set "mauerschlupfer" (lurker of the wall niches; monster contract, characters-pipeline.md §7)
# -> monsters/mauerschlupfer/anims/mauerschlupfer.glb
# Own creature (gothar-chargen creature mauerschlupfer, 2026-11-23): the clip source only holds
# the still action "rest". Gaits are own cycles (gait), everything else keyframe placeholders.
# Dungeon (#422): s_dormant lies curled up in a niche (`zs_dormant`), t_wake springs out of it
# (in place, events leap_start/leap_land like the Glemsmahr); t_steal snatches a shiny item with the
# mouth (event steal; behaviour: engine).
#
# Key poses rotate about world axes at rest (X = left, -Y = forward, Z = up; +X pitches the head
# down, opens the jaw, swings a leg back and lifts the tail, +Z turns left) and move root/pelvis.

set = "mauerschlupfer"
rig = "mauerschlupfer"

[sources.src]
file = "mauerschlupfer_clips.blend"
mapping = "identity"

[[clip]]
name = "mauerschlupfer/s_rest"
from = "src:rest"
helper = true

[[clip]]
name = "mauerschlupfer/s_idle"     # crouched, the blind head swings, the big ears turn and listen
keyframe = "keyposes"
[clip.params]
base = "mauerschlupfer/s_rest"
keys = [[0, "stand"], [14, "listen_l"], [26, "stand"], [40, "listen_r"], [52, "sniff"], [60, "stand"]]
[clip.params.poses.stand]
rotate = { neck_01 = [["X", 4]], tail_01 = [["X", 6]] }
[clip.params.poses.listen_l]
rotate = { neck_01 = [["X", -6], ["Z", 22]], head = [["Z", 12]], ear_l = [["Z", 25]], ear_r = [["X", -15]], tail_01 = [["Z", -10]] }
[clip.params.poses.listen_r]
rotate = { neck_01 = [["X", -6], ["Z", -22]], head = [["Z", -12]], ear_r = [["Z", -25]], ear_l = [["X", -15]], tail_01 = [["Z", 10]] }
[clip.params.poses.sniff]
move = { pelvis = [0, 0, -0.01] }
rotate = { neck_01 = [["X", 20]], head = [["X", 12]], jaw = [["X", 6]], tail_01 = [["X", 8]] }

