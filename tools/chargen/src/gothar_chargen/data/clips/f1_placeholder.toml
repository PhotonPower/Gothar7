# F1 test clips (placeholder quality) -> assets/source/characters/anims/human/none.glb
# Source: Quaternius Universal Animation Library [Standard] (CC0 1.0), Rigify bone naming.
# events = "footsteps": footstep_l / footstep_r are detected from foot contact (foot_* lowest point).

set = "none"
library = "ual1"
mapping = "quaternius_ual1"

[[clip]]
name = "none/s_idle"
source = "Idle_Loop"

[[clip]]
name = "none/s_walk"
source = "Walk_Loop"
events = "footsteps"

[[clip]]
name = "none/s_run"
source = "Jog_Fwd_Loop"
events = "footsteps"
