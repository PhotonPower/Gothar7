# Set "mauerkriecher" (woodlouse-like crawler of the dungeon; arthropod plan, characters-pipeline.md §7.5)
# -> monsters/mauerkriecher/anims/mauerkriecher.glb
# Own creature (gothar-chargen creature mauerkriecher, 2026-11-23): the clip source only holds the
# still action "rest". Walk and run are own gait cycles with all six legs (alternating tripods:
# left 1 and 3 with right 2, then the others; pair 1 reports footstep_front_l/r, pair 3
# footstep_back_l/r); everything else is keyframed.
# Dungeon (#422): s_dormant pressed flat into a crack (`zs_dormant`), t_wake; §7.5: t_curl ->
# s_curled -> t_uncurl (rolled up, the armour protects from above), t_emerge (out of a crack, in
# place, event emerge).
#
# Key poses rotate about world axes at rest (X = left, -Y = forward, Z = up; +X pitches the head
# down and lifts a bone pointing backwards, i.e. -X curls the abdomen under; Y swings a leg
# pointing sideways up or down, +Z turns left) and move root/pelvis.

set = "mauerkriecher"
rig = "mauerkriecher"

[sources.src]
file = "mauerkriecher_clips.blend"
mapping = "identity"

[[clip]]
name = "mauerkriecher/s_rest"
from = "src:rest"
helper = true

[[clip]]
name = "mauerkriecher/s_idle"      # feelers wave and probe, the pincers click
keyframe = "keyposes"
markers = { "sound:mauerkriecher_click" = 34 }
[clip.params]
base = "mauerkriecher/s_rest"
keys = [[0, "rest"], [15, "probe_l"], [30, "rest"], [34, "click"], [38, "rest"], [50, "probe_r"], [60, "rest"]]
[clip.params.poses.probe_l]
rotate = { head = [["Z", 8]], antenna_01_l = [["Z", 20], ["X", 15]], antenna_02_l = [["X", 20]], antenna_01_r = [["Z", 10], ["X", -10]] }
[clip.params.poses.probe_r]
rotate = { head = [["Z", -8]], antenna_01_r = [["Z", -20], ["X", 15]], antenna_02_r = [["X", 20]], antenna_01_l = [["Z", -10], ["X", -10]] }
[clip.params.poses.click]
rotate = { mandible_l = [["Z", -25]], mandible_r = [["Z", 25]] }

