# Set "gait" -> assets/source/characters/anims/human/gait.glb (walk-style variants for NPC variety,
# contract with engine 2026-10-08): own file so none.glb stays untouched. A figure manifest may set
# [anim] variant = "<v>"; the engine then plays none/X_<v> instead of none/X when that clip exists
# (here s_idle, s_walk and for some variants s_run), otherwise the base clip. The variants are
# constant posture offsets above the pelvis over the base clips, so the feet and the clip speed
# (events.toml) stay those of the base; old runs a slow trot (s_run at half speed).
# Generated by a script from one pose per variant; key poses rotate about world axes at rest. The
# arm offsets were found by a grid search on the idle reference (hands behind the back, on the
# small of the back, close to the body).

set = "gait"
depends = ["none"]

[[clip]]
name = "none/s_run_slow"           # base of the old trot: s_run at half speed
keyframe = "scale_root"
params = { base = "none/s_run", time = 2.0, height = 1.0 }
helper = true

# --- woman ---

[[clip]]
name = "none/s_idle_woman"
keyframe = "keyposes"
[clip.params]
base = "none/s_idle"
keys = [[0, "p"], [75, "p"]]
[clip.params.poses.p]
rotate = { spine_03 = [["X", -3]], neck = [["X", -2], ["Y", 3]], upperarm_l = [["X", -15], ["Y", 15]], upperarm_r = [["X", -30], ["Y", -15], ["Z", 15]] }

[[clip]]
name = "none/s_walk_woman"
keyframe = "keyposes"
events = "footsteps"
[clip.params]
base = "none/s_walk"
keys = [[0, "p"], [40, "p"]]
[clip.params.poses.p]
rotate = { spine_03 = [["X", -3]], neck = [["X", -2], ["Y", 3]], upperarm_l = [["X", -15], ["Y", 15]], upperarm_r = [["X", -30], ["Y", -15], ["Z", 15]] }

[[clip]]
name = "none/s_run_woman"
keyframe = "keyposes"
events = "footsteps"
[clip.params]
base = "none/s_run"
keys = [[0, "p"], [28, "p"]]
[clip.params.poses.p]
rotate = { spine_03 = [["X", -3]], neck = [["X", -2], ["Y", 3]], upperarm_l = [["X", -15], ["Y", 15]], upperarm_r = [["X", -30], ["Y", -15], ["Z", 15]] }

