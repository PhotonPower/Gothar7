# Set "dlg" -> assets/source/characters/anims/human/dlg.glb (Prio B, dialogue gestures for M10;
# keyframe placeholders, mocap in F4). Additive overlays a_* (contract with engine,
# characters-pipeline.md §3): played from spine_02 up against the reference pose dlg/a_neutral (one
# frame, the first frame of none/s_idle without breathing); only rotations. Gestures and talk loops
# start and end at the reference; held poses a_<x> lie between a_<x>_in and a_<x>_out. Head and neck
# move little (look-at turns the head), nodding and shaking the head excepted; faces are morphs.
# Optional event `beat` on the stress of a gesture. Generated by the gesture table in the PR notes;
# key-pose axes: X = the figure's left, -Y = forward, Z = up (blender/keyframes.py).

set = "dlg"
depends = ["none"]

[sources.ual2]
file = "UAL2_Standard.glb"
mapping = "quaternius_ual2"

[[clip]]
name = "dlg/s_neutral_hold"
keyframe = "hold"
params = { base = "none/s_idle", frame = 0, frames = 60, breathe = 0.0 }
helper = true

[[clip]]
name = "dlg/a_neutral"
keyframe = "hold"
params = { base = "none/s_idle", frame = 0, frames = 0, breathe = 0.0 }
additive = true

