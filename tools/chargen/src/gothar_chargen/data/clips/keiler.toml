rotate = { neck_01 = [["X", 20]], head = [["X", 5]], jaw = [["X", 6]], ear_l = [["X", 40]], ear_r = [["X", 40]], rump = [["X", -10]] }
[clip.params.poses.paw_fwd]
move = { pelvis = [0, 0.03, -0.03] }
rotate = { neck_01 = [["X", 20]], head = [["X", 5]], jaw = [["X", 10]], ear_l = [["X", 40]], ear_r = [["X", 40]], rump = [["X", -10]], front_upper_r = [["X", -25]], front_lower_r = [["X", 15]] }
[clip.params.poses.paw_back]
move = { pelvis = [0, 0.03, -0.03] }
rotate = { neck_01 = [["X", 22]], head = [["X", 8]], jaw = [["X", 3]], ear_l = [["X", 40]], ear_r = [["X", 40]], rump = [["X", -10]], front_upper_r = [["X", 15]], front_lower_r = [["X", 10]] }
