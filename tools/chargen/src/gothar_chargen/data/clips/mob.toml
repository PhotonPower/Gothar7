# Set "mob" -> assets/source/characters/anims/human/mob.glb (Prio B, M8; placeholders, mocap in F4).
# Clips per mob type mob/<type>/... (contract characters-pipeline.md §3.1, data/mobs.toml): the figure
# stands on the slot of the mob and faces it (-Z of the mob). Root motion only in bed/t_lie_down and
# bed/t_stand_up (onto the bed and back: bed centre 0.75 m in front of the slot, lying surface 0.45 m).
# The bed runs along X with its long side to the slot; the figure lies along it, head end at -X of the
# mob (to the left seen from the slot) - turned in the pelvis, so the root motion carries no yaw.

set = "mob"
depends = ["none"]

[sources.ual1]
file = "AnimationLibrary_Godot_Standard.glb"
mapping = "quaternius_ual1"

[sources.ual2]
file = "UAL2_Standard.glb"
mapping = "quaternius_ual2"

# --- chest ---------------------------------------------------------------------------------------

[[clip]]
name = "mob/chest/t_open"
from = "ual2:Chest_Open"
markers = { open = 18 }

[[clip]]
name = "mob/chest/t_close"
reverse = "mob/chest/t_open"
markers = { close = 23 }

[[clip]]
name = "mob/chest/s_open"
keyframe = "hold"
params = { base = "mob/chest/t_open", frame = 18 }

[[clip]]
name = "mob/chest/s_picklock"
from = "ual1:Fixing_Kneeling"

# --- anvil ---------------------------------------------------------------------------------------

[[clip]]
name = "mob/anvil/s_work"
from = "ual2:TreeChopping_Loop"
markers = { hit_anvil = 8, "sound:anvil_hit" = 8 }

[[clip]]
name = "mob/anvil/t_start"
blend = ["none/s_idle", "mob/anvil/s_work"]
frames = 12
markers = { item_to_hand = 1 }  # it_hammer in socket_hand_r (engine, 2026-10-08)

[[clip]]
name = "mob/anvil/t_stop"
blend = ["mob/anvil/s_work", "none/s_idle"]
frames = 12
markers = { item_from_hand = 11 }

# --- bed -----------------------------------------------------------------------------------------

[[clip]]
name = "mob/bed/t_getup_source"
from = "ual2:LayToIdle"
helper = true

[[clip]]
name = "mob/bed/t_stand_up"
keyframe = "keyposes"
params = { base = "mob/bed/t_getup_source", keys = [[0, "bed"], [12, "bed"], [45, "rest"]], poses = { bed = { move = { root = [0.0, -0.75, 0.45], pelvis = [0.1, -0.24, 0.0] }, rotate = { pelvis = [["Z", -90]] } } } }
markers = { stand = 43 }

[[clip]]
name = "mob/bed/t_lie_down"
reverse = "mob/bed/t_stand_up"
markers = { lie = 43 }

[[clip]]
name = "mob/bed/s_lie_source"
keyframe = "hold"
params = { base = "mob/bed/t_getup_source", frame = 0 }
helper = true

[[clip]]
name = "mob/bed/s_lie"
keyframe = "keyposes"
params = { base = "mob/bed/s_lie_source", keys = [[0, "lie"], [60, "lie"]], poses = { lie = { move = { pelvis = [0.1, -0.24, 0.0] }, rotate = { pelvis = [["Z", -90]] } } } }

# --- door ----------------------------------------------------------------------------------------

[[clip]]
name = "mob/door/t_open"
from = "ual1:Interact"
markers = { open = 10 }

# --- bench (sitting; the figure stands in front of the bench with its back to it) ---------------

[[clip]]
name = "mob/bench/t_sit"
from = "ual1:Sitting_Enter"

[[clip]]
name = "mob/bench/s_sit"
from = "ual1:Sitting_Idle_Loop"

[[clip]]
name = "mob/bench/t_stand"
from = "ual1:Sitting_Exit"

[[clip]]
name = "mob/bench/s_sit_talk"
from = "ual1:Sitting_Talking_Loop"

# --- table (sitting at welt's table on its bench; the figure stands behind the bench and faces the
# table: slot 1.10 m from the table's axis, bench middle 0.62 m, seat 0.45 m high and 0.35 m deep). It
# steps over the bench right leg first and sits with the hip joints over the middle of the seat (0.48 m
# in front of the slot), thighs level, knees and feet under the top (0.69 m), forearms on the top
# (0.75 m). No root motion: the pelvis moves in the clip. Placeholders (keyposes), mocap in F4.

[[clip]]
name = "mob/table/t_sit"
keyframe = "keyposes"
params = { base = "none/s_idle", keys = [[0, "rest"], [14, "step"], [26, "lift_r"], [38, "over_r"], [50, "lower"], [60, "sit"]], poses = { step = { move = { pelvis = [0.0, -0.18, -0.02] }, rotate = { thigh_l = [["X", -25]], calf_l = [["X", 20]], thigh_r = [["X", 10]] } }, lift_r = { move = { pelvis = [0.0, -0.3, 0.02] }, rotate = { thigh_r = [["X", -100], ["Y", 8]], calf_r = [["X", 55]], thigh_l = [["X", 20]], spine_01 = [["X", 10]], upperarm_l = [["X", -25]], upperarm_r = [["X", -25]] } }, over_r = { move = { pelvis = [0.0, -0.5, -0.1] }, rotate = { thigh_r = [["X", -60], ["Y", 6]], calf_r = [["X", 55]], thigh_l = [["X", -95], ["Y", -8]], calf_l = [["X", 75]], spine_01 = [["X", 14]], upperarm_l = [["X", -25]], upperarm_r = [["X", -25]] } }, lower = { move = { pelvis = [0.0, -0.6, -0.26] }, rotate = { thigh_l = [["X", -90], ["Y", -6]], thigh_r = [["X", -90], ["Y", 6]], calf_l = [["X", 88]], calf_r = [["X", 88]], spine_01 = [["X", 18]], upperarm_l = [["X", -45]], lowerarm_l = [["X", -25]], upperarm_r = [["X", -45]], lowerarm_r = [["X", -25]] } }, sit = { move = { pelvis = [0.0, -0.61, -0.34] }, rotate = { thigh_l = [["X", -90], ["Y", -6]], thigh_r = [["X", -90], ["Y", 6]], calf_l = [["X", 88]], calf_r = [["X", 88]], spine_01 = [["X", 20]], upperarm_l = [["X", -65]], lowerarm_l = [["X", -35]], upperarm_r = [["X", -65]], lowerarm_r = [["X", -35]] } } } }

[[clip]]
name = "mob/table/t_stand"
reverse = "mob/table/t_sit"

[[clip]]
name = "mob/table/s_sit"
keyframe = "keyposes"
params = { base = "none/s_idle", keys = [[0, "sit"], [60, "sit_b"], [120, "sit"]], poses = { sit = { move = { pelvis = [0.0, -0.61, -0.34] }, rotate = { thigh_l = [["X", -90], ["Y", -6]], thigh_r = [["X", -90], ["Y", 6]], calf_l = [["X", 88]], calf_r = [["X", 88]], spine_01 = [["X", 20]], upperarm_l = [["X", -65]], lowerarm_l = [["X", -35]], upperarm_r = [["X", -65]], lowerarm_r = [["X", -35]] } }, sit_b = { move = { pelvis = [0.0, -0.61, -0.34] }, rotate = { thigh_l = [["X", -90], ["Y", -6]], thigh_r = [["X", -90], ["Y", 6]], calf_l = [["X", 88]], calf_r = [["X", 88]], spine_01 = [["X", 22]], upperarm_l = [["X", -65]], lowerarm_l = [["X", -35]], upperarm_r = [["X", -68]], lowerarm_r = [["X", -38]], head = [["Z", 6]] } } } }

[[clip]]
name = "mob/table/s_sit_drink"
keyframe = "keyposes"
params = { base = "none/s_idle", keys = [[0, "sit"], [30, "sit"], [48, "drink"], [72, "drink"], [90, "sit"], [120, "sit"]], poses = { sit = { move = { pelvis = [0.0, -0.61, -0.34] }, rotate = { thigh_l = [["X", -90], ["Y", -6]], thigh_r = [["X", -90], ["Y", 6]], calf_l = [["X", 88]], calf_r = [["X", 88]], spine_01 = [["X", 20]], upperarm_l = [["X", -65]], lowerarm_l = [["X", -35]], upperarm_r = [["X", -65]], lowerarm_r = [["X", -35]] } }, drink = { move = { pelvis = [0.0, -0.61, -0.34] }, rotate = { thigh_l = [["X", -90], ["Y", -6]], thigh_r = [["X", -90], ["Y", 6]], calf_l = [["X", 88]], calf_r = [["X", 88]], spine_01 = [["X", 8]], upperarm_l = [["X", -65]], lowerarm_l = [["X", -35]], upperarm_r = [["X", -70], ["Z", 20]], lowerarm_r = [["Z", 70]] }, twist = { lowerarm_r = 90 } } } }
markers = { item_to_hand = 1 }

[[clip]]
name = "mob/table/s_sit_talk"
keyframe = "keyposes"
params = { base = "none/s_idle", keys = [[0, "sit"], [24, "talk_r"], [54, "sit"], [80, "talk_l"], [104, "sit"], [120, "sit"]], poses = { sit = { move = { pelvis = [0.0, -0.61, -0.34] }, rotate = { thigh_l = [["X", -90], ["Y", -6]], thigh_r = [["X", -90], ["Y", 6]], calf_l = [["X", 88]], calf_r = [["X", 88]], spine_01 = [["X", 20]], upperarm_l = [["X", -65]], lowerarm_l = [["X", -35]], upperarm_r = [["X", -65]], lowerarm_r = [["X", -35]] } }, talk_r = { move = { pelvis = [0.0, -0.61, -0.34] }, rotate = { thigh_l = [["X", -90], ["Y", -6]], thigh_r = [["X", -90], ["Y", 6]], calf_l = [["X", 88]], calf_r = [["X", 88]], spine_01 = [["X", 14]], upperarm_l = [["X", -65]], lowerarm_l = [["X", -35]], upperarm_r = [["X", -65]], lowerarm_r = [["Z", 25]], head = [["Z", -8]] }, twist = { lowerarm_r = 90 } }, talk_l = { move = { pelvis = [0.0, -0.61, -0.34] }, rotate = { thigh_l = [["X", -90], ["Y", -6]], thigh_r = [["X", -90], ["Y", 6]], calf_l = [["X", 88]], calf_r = [["X", 88]], spine_01 = [["X", 14]], upperarm_l = [["X", -65]], lowerarm_l = [["Z", -25]], upperarm_r = [["X", -65]], lowerarm_r = [["X", -35]], head = [["Z", 8]] }, twist = { lowerarm_l = -90 } } } }
