# Set "glemsmahr" (monster contract, characters-pipeline.md §7) -> monsters/glemsmahr/anims/
# Own creature (gothar-chargen creature glemsmahr): the clip source only holds the still action
# "rest". Gaits are own cycles (gait), everything else keyframe placeholders.
# Agreed with engine (2026-10-07): walk 1.4, run 6.5, sneak 0.9 m/s (root motion); t_leap and
# t_jump_back in place (engine moves the capsule ~3 m / ~2.5 m) with leap_start / leap_land, the
# leap with hit_start/hit_end around the landing; t_rise, s_upright, t_lower (upright only to
# threaten and to scent); t_recoil before light and fire (events recoil, sound:glemsmahr_hiss).
#
# Key poses rotate about world axes at rest (X = left, -Y = forward, Z = up; +X pitches the head
# down, opens the jaw and swings a limb back, +Z turns left) and move root/pelvis.

set = "glemsmahr"
rig = "glemsmahr"

[sources.src]
file = "glemsmahr_clips.blend"
mapping = "identity"

[[clip]]
name = "glemsmahr/s_rest"
from = "src:rest"
helper = true

[[clip]]
name = "glemsmahr/s_idle"          # crouched, listening: head tilts, ears turn
keyframe = "keyposes"
[clip.params]
base = "glemsmahr/s_rest"
keys = [[0, "crouch"], [18, "tilt"], [34, "crouch"], [48, "listen"], [60, "crouch"]]
[clip.params.poses.crouch]
rotate = { neck_01 = [["X", 4]] }
[clip.params.poses.tilt]
move = { pelvis = [0, 0, -0.01] }
rotate = { neck_01 = [["X", 4]], head = [["Y", 18]], ear_l = [["Z", 15]], ear_r = [["Z", 10]] }
[clip.params.poses.listen]
rotate = { neck_01 = [["X", -6], ["Z", 14]], head = [["Z", 8], ["Y", -8]], ear_l = [["X", -15]], ear_r = [["X", -15]] }

# --- locomotion ---

[[clip]]
name = "glemsmahr/s_walk"          # knuckle walk, lateral sequence
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 1.4
period = 20                         # phases and duty on whole frames
duty = 0.6
lift = 0.08
crouch = 0.02
bob = 0.015
pitch = 2.0
nod = { bone = "neck_01", degrees = 3.0, phase = 0.0 }
legs = [
