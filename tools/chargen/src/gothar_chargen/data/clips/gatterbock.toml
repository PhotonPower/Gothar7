# Set "gatterbock" (stone warden of the dungeon; monster contract, characters-pipeline.md §7)
# -> monsters/gatterbock/anims/gatterbock.glb
# Own creature (gothar-chargen creature gatterbock, 2026-11-23): the clip source only holds the
# still action "rest". Walk and run are own gait cycles (gait); everything else is keyframed.
# Dungeon (#422): s_dormant is the statue pose of `zs_dormant`, t_wake the waking.
#
# Key poses rotate about world axes at rest (X = left, -Y = forward, Z = up): -X raises a
# hanging arm forwards, +X tilts the trunk forwards and bends a knee back (calf), +Z turns left.

set = "gatterbock"
rig = "gatterbock"

[sources.src]
file = "gatterbock_clips.blend"
mapping = "identity"

[[clip]]
name = "gatterbock/s_rest"
from = "src:rest"
helper = true

# --- locomotion (root moves forward: contract §7) ---

[[clip]]
name = "gatterbock/s_idle"        # heavy, slow breathing of the stone; the head grinds round
keyframe = "keyposes"
[clip.params]
base = "gatterbock/s_rest"
keys = [[0, "rest"], [30, "look_l"], [60, "rest"], [90, "look_r"], [120, "rest"]]
[clip.params.poses.look_l]
rotate = { spine_02 = [["X", 2], ["Z", 4]], head = [["Z", 18]], upperarm_l = [["X", -4]], upperarm_r = [["X", 3]] }
move = { pelvis = [0, 0, -0.01] }
[clip.params.poses.look_r]
rotate = { spine_02 = [["X", 2], ["Z", -4]], head = [["Z", -18]], upperarm_l = [["X", 3]], upperarm_r = [["X", -4]] }
move = { pelvis = [0, 0, -0.01] }

[[clip]]
name = "gatterbock/s_walk"        # slow, stamping steps; the trunk rolls over the standing leg
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 0.9
period = 30
duty = 0.65
lift = 0.08
bob = 0.03
pose = { spine_02 = [["X", 4]], upperarm_l = [["X", -6]], upperarm_r = [["X", -6]] }
legs = [
    { upper = "thigh_l", lower = "calf_l", foot = "foot_l", phase = 0.0 },
    { upper = "thigh_r", lower = "calf_r", foot = "foot_r", phase = 0.5 },
]

[[clip]]
name = "gatterbock/s_run"         # a heavy trot - slower than the running hero (4.0)
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 2.2
period = 20
duty = 0.5
lift = 0.12
bob = 0.05
pitch = 6.0
pose = { spine_02 = [["X", 10]], head = [["X", -8]], upperarm_l = [["X", -25]], upperarm_r = [["X", -25]], lowerarm_l = [["X", -30]], lowerarm_r = [["X", -30]] }
legs = [
    { upper = "thigh_l", lower = "calf_l", foot = "foot_l", phase = 0.0 },
    { upper = "thigh_r", lower = "calf_r", foot = "foot_r", phase = 0.5 },
]

[[clip]]
name = "gatterbock/s_step_inplace" # base of the turns: stepping on the spot
keyframe = "gait"
helper = true
[clip.params]
speed = 0.0
period = 30
duty = 0.65
lift = 0.07
legs = [
    { upper = "thigh_l", lower = "calf_l", foot = "foot_l", phase = 0.0 },
    { upper = "thigh_r", lower = "calf_r", foot = "foot_r", phase = 0.5 },
]

[[clip]]
name = "gatterbock/t_turn_l"
keyframe = "keyposes"
events = "footsteps"
[clip.params]
base = "gatterbock/s_step_inplace"
keys = [[0, "rest"], [60, "turned"]]
[clip.params.poses.turned]
rotate = { root = [["Z", 90]] }

[[clip]]
name = "gatterbock/t_turn_r"
keyframe = "keyposes"
events = "footsteps"
[clip.params]
base = "gatterbock/s_step_inplace"
keys = [[0, "rest"], [60, "turned"]]
[clip.params.poses.turned]
rotate = { root = [["Z", -90]] }

