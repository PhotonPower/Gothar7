# Set "fist" -> assets/source/characters/anims/human/fist.glb (Prio B, placeholders)
# Fist fighting: guard pose from Quaternius UAL1 Punch_Enter (end), over idle legs.
# Locomotion: arms and head from the stance, legs, pelvis and spine from the none clips
# (keeps the spine counter-rotation of strafe/turn; the stance's spine posture is dropped).

set = "fist"
depends = ["none"]

[sources.ual1]
file = "AnimationLibrary_Godot_Standard.glb"
mapping = "quaternius_ual1"

[[clip]]
name = "fist/s_guard"
from = "ual1:Punch_Enter[24:26]"
helper = true

[[clip]]
name = "fist/s_idle"
layer = ["none/s_idle", "fist/s_guard"]

[[clip]]
name = "fist/s_walk"
layer = ["none/s_walk", "fist/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "fist/s_run"
layer = ["none/s_run", "fist/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "fist/s_walk_back"
layer = ["none/s_walk_back", "fist/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "fist/s_strafe_l"
layer = ["none/s_strafe_l", "fist/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "fist/s_strafe_r"
layer = ["none/s_strafe_r", "fist/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "fist/t_turn_l"
layer = ["none/t_turn_l", "fist/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

[[clip]]
name = "fist/t_turn_r"
layer = ["none/t_turn_r", "fist/s_idle"]
from_bone = ["clavicle_l", "clavicle_r", "neck"]
events = "footsteps"

# --- raising and lowering the fists (M9 C1; overlay from spine_02, no event) --------------------

[[clip]]
name = "fist/t_draw"
blend = ["none/s_idle", "fist/s_idle"]
frames = 15

[[clip]]
name = "fist/t_sheath"
blend = ["fist/s_idle", "none/s_idle"]
frames = 15

# --- combat (M11, contract with engine 2026-10-05): every attack starts and ends in fist/s_idle
# (engine blends 0.1 s between hits; each clip also works as a single hit); hit_start/hit_end on
# the impact of the fist, combo_start = hit_end .. combo_end at about 80 %, then recovery.

[[clip]]
name = "fist/t_jab"
from = "ual1:Punch_Jab"
helper = true

[[clip]]
name = "fist/t_cross"
from = "ual1:Punch_Cross"
helper = true

[[clip]]
name = "fist/t_attack_combo1"     # jab, left fist
keyframe = "framed"
markers = { hit_start = 6, hit_end = 9, combo_start = 9, combo_end = 21 }
params = { base = "fist/t_jab", stance = "fist/s_idle", fade_in = 3, fade_out = 6 }

[[clip]]
name = "fist/t_attack_combo2"     # cross, right fist
keyframe = "framed"
markers = { hit_start = 9, hit_end = 14, combo_start = 14, combo_end = 24 }
params = { base = "fist/t_cross", stance = "fist/s_idle", fade_in = 5, fade_out = 6 }

[[clip]]
name = "fist/t_cover"             # forearms raised in front of the face (over the upright none/s_idle)
keyframe = "keyposes"
helper = true
[clip.params]
base = "none/s_idle"
keys = [[0, "rest"], [5, "cover"], [13, "cover"], [18, "rest"]]
[clip.params.poses.cover]
rotate = { upperarm_l = [["X", -90], ["Z", -30]], upperarm_r = [["X", -90], ["Z", 30]], lowerarm_l = [["X", -15], ["Y", 90]], lowerarm_r = [["X", -15], ["Y", -90]], spine_02 = [["X", -6]], neck = [["X", 8]] }  # grid search: fists before the face
move = { pelvis = [0, 0.04, -0.03] }

[[clip]]
name = "fist/t_parry"             # ~0.6 s, ends in fist/s_idle (engine sets the block window)
keyframe = "framed"
params = { base = "fist/t_cover", stance = "fist/s_idle", fade_in = 3, fade_out = 4 }
