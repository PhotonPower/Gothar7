# Set "kristallkrebs" (crystal crab of the dungeon; arthropod plan, characters-pipeline.md §7.5)
# -> monsters/kristallkrebs/anims/kristallkrebs.glb
# Own creature (gothar-chargen creature kristallkrebs, 2026-11-23): the clip source only holds the
# still action "rest". move_axis "x" (§7.5): s_walk/s_run go SIDEWAYS to the left (+X), own gait
# cycles with all eight legs spread (splay, axis "x"; alternating tetrapods; pair 1 reports
# footstep_front_l/r, pair 4 footstep_back_l/r); engine turns the body across the walking
# direction. Everything else is keyframed.
# Dungeon (#422): s_dormant pressed down among the crystals (`zs_dormant`), t_wake; §7.5: t_grab
# (pincer holds fast: events grab / release), t_reflect (the crystals flare and throw a spell back:
# event reflect).
#
# Key poses rotate about world axes at rest (X = left, -Y = forward, Z = up; +X pitches a bone
# pointing forwards down, Y swings a leg pointing sideways up (-) or down (+) on the left, +Z turns
# left) and move root/pelvis.

set = "kristallkrebs"
rig = "kristallkrebs"

[sources.src]
file = "kristallkrebs_clips.blend"
mapping = "identity"

[[clip]]
name = "kristallkrebs/s_rest"
from = "src:rest"
helper = true

[[clip]]
name = "kristallkrebs/s_idle"      # eye stalks swivel, pincers open and close, a faint chime
keyframe = "keyposes"
markers = { "sound:kristallkrebs_chime" = 40 }
[clip.params]
base = "kristallkrebs/s_rest"
keys = [[0, "rest"], [20, "look_l"], [40, "snip"], [50, "rest"], [70, "look_r"], [90, "rest"]]
[clip.params.poses.look_l]
rotate = { eye_stalk_l = [["Z", 25]], eye_stalk_r = [["Z", 20]], head = [["Z", 5]], claw_finger_l = [["X", 15]], claw_finger_r = [["X", 15]] }
[clip.params.poses.look_r]
rotate = { eye_stalk_l = [["Z", -20]], eye_stalk_r = [["Z", -25]], head = [["Z", -5]] }
[clip.params.poses.snip]
rotate = { claw_finger_l = [["X", -8]], claw_finger_r = [["X", -8]], arm_upper_l = [["Z", 6]], arm_upper_r = [["Z", -6]] }

