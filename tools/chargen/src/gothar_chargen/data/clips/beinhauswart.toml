# Set "beinhauswart" (warden of the charnel house; monster contract, characters-pipeline.md §7)
# -> monsters/beinhauswart/anims/beinhauswart.glb
# Own creature (gothar-chargen creature beinhauswart, 2026-11-23): the clip source only holds the
# still action "rest". Walk and run are own gait cycles (gait); everything else is keyframed.
# Dungeon (#422): s_dormant is the pose of `zs_dormant` (leaning on the spade), t_wake the waking.
# The spade (bone `spade`) and the lantern carrier (bone `lantern`, the item it_lantern_beinhaus hangs
# on socket_lantern) are rigid on the hands and never keyed.
#
# Key poses rotate about world axes at rest (X = left, -Y = forward, Z = up): -X raises a
# hanging arm forwards (and swings the spade, hanging down from the right fist, to the front),
# +X tilts the trunk forwards and bends a knee back (calf), +Z turns left.

set = "beinhauswart"
rig = "beinhauswart"

[sources.src]
file = "beinhauswart_clips.blend"
mapping = "identity"

[[clip]]
name = "beinhauswart/s_rest"
from = "src:rest"
helper = true

# --- locomotion (root moves forward: contract §7) ---

[[clip]]
name = "beinhauswart/s_idle"      # stooped, breathing; the hooded head turns, the lantern sways
keyframe = "keyposes"
[clip.params]
base = "beinhauswart/s_rest"
keys = [[0, "rest"], [40, "look_l"], [80, "rest"], [120, "look_r"], [160, "rest"]]
[clip.params.poses.look_l]
rotate = { spine_02 = [["X", 3], ["Z", 5]], head = [["Z", 25], ["X", -5]], upperarm_l = [["X", -6]] }
move = { pelvis = [0, 0, -0.01] }
[clip.params.poses.look_r]
rotate = { spine_02 = [["X", 3], ["Z", -5]], head = [["Z", -25], ["X", -5]], upperarm_l = [["X", 4]] }
move = { pelvis = [0, 0, -0.01] }

[[clip]]
name = "beinhauswart/s_walk"      # slow, shuffling round between the niches; the spade as a staff
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 0.8
period = 36
duty = 0.7
lift = 0.05
bob = 0.02
pose = { spine_02 = [["X", 4]], head = [["X", -4]], upperarm_r = [["X", -8]], upperarm_l = [["X", -4]] }
legs = [
    { upper = "thigh_l", lower = "calf_l", foot = "foot_l", phase = 0.0 },
    { upper = "thigh_r", lower = "calf_r", foot = "foot_r", phase = 0.5 },
]

[[clip]]
name = "beinhauswart/s_run"       # hunched, hurried lope; spade carried upright, lantern swinging
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 3.2
period = 22
duty = 0.5
lift = 0.12
bob = 0.04
pitch = 6.0
pose = { spine_02 = [["X", 16]], head = [["X", -14]], upperarm_r = [["X", -30]], lowerarm_r = [["X", -40]], hand_r = [["X", 75]], upperarm_l = [["X", -20]], lowerarm_l = [["X", -20]] }
legs = [
    { upper = "thigh_l", lower = "calf_l", foot = "foot_l", phase = 0.0 },
    { upper = "thigh_r", lower = "calf_r", foot = "foot_r", phase = 0.5 },
]

[[clip]]
name = "beinhauswart/s_step_inplace" # base of the turns: shuffling on the spot
keyframe = "gait"
helper = true
[clip.params]
speed = 0.0
period = 30
duty = 0.7
lift = 0.04
legs = [
    { upper = "thigh_l", lower = "calf_l", foot = "foot_l", phase = 0.0 },
    { upper = "thigh_r", lower = "calf_r", foot = "foot_r", phase = 0.5 },
]

[[clip]]
name = "beinhauswart/t_turn_l"
keyframe = "keyposes"
events = "footsteps"
[clip.params]
base = "beinhauswart/s_step_inplace"
keys = [[0, "rest"], [50, "turned"]]
[clip.params.poses.turned]
rotate = { root = [["Z", 90]] }

[[clip]]
name = "beinhauswart/t_turn_r"
keyframe = "keyposes"
events = "footsteps"
[clip.params]
base = "beinhauswart/s_step_inplace"
keys = [[0, "rest"], [50, "turned"]]
[clip.params.poses.turned]
rotate = { root = [["Z", -90]] }

