# Set "brunnenmolch" (blind giant cave newt of the dungeon; lizard plan, characters-pipeline.md §7.6)
# -> monsters/brunnenmolch/anims/brunnenmolch.glb
# Own creature (gothar-chargen creature brunnenmolch, 2026-11-24): the clip source only holds the
# still action "rest". Walk and run are own gait cycles with splayed legs and the body and tail
# waving sideways (`sway`: rotation about the vertical only, the root motion stays straight along
# +Z); everything else is keyframed. He does not swim (owner 2026-11-24): s_dormant lies flat, half
# under water in the shallows or at the bank (`zs_dormant`), t_wake surfaces (event splash),
# t_snap_up snaps up at the hero on the jetty in place (the pelvis rises in the clip, no root
# motion; hit at socket_mouth) and t_submerge sinks back into s_dormant. Blind: t_listen.
#
# Key poses rotate about world axes at rest (X = left, -Y = forward, Z = up; +X pitches the head
# down, opens the jaw and lifts the tail; Y swings a leg pointing sideways up or down (-Y lifts the
# left leg); +Z turns left and swings a left leg backwards) and move root/pelvis.

set = "brunnenmolch"
rig = "brunnenmolch"

[sources.src]
file = "brunnenmolch_clips.blend"
mapping = "identity"

[[clip]]
name = "brunnenmolch/s_rest"
from = "src:rest"
helper = true

[[clip]]
name = "brunnenmolch/s_idle"          # breathing, gills waving, the head turns slowly as it listens
keyframe = "keyposes"
[clip.params]
base = "brunnenmolch/s_rest"
keys = [[0, "rest"], [15, "a"], [30, "rest"], [45, "b"], [60, "rest"]]
[clip.params.poses.a]
move = { pelvis = [0, 0, 0.004] }
rotate = { gill_l = [["Z", 14]], gill_r = [["Z", -14]], neck_01 = [["Z", 4]], head = [["Z", 3], ["X", -2]], jaw = [["X", 2]], tail_03 = [["Z", 4]], tail_05 = [["Z", 5]] }
[clip.params.poses.b]
rotate = { gill_l = [["Z", -12]], gill_r = [["Z", 12]], neck_01 = [["Z", -4]], head = [["Z", -3]], tail_03 = [["Z", -4]], tail_05 = [["Z", -5]] }

# --- locomotion (root moves forward along +Z: contract §7.1) ---

[[clip]]
name = "brunnenmolch/s_walk"         # slow sprawling walk, body and tail wave from side to side
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 0.6
period = 24                          # phases and duty on whole frames
duty = 0.75
lift = 0.06
splay = true
sway = { bones = ["pelvis", "spine_01", "spine_02", "spine_03", "tail_01", "tail_02", "tail_03", "tail_04", "tail_05", "tail_06"], degrees = [5, -3, -2, -2, 3, 3, 3, 3, 4, 4], lag = 0.06 }
pose = { gill_l = [["Z", -6]], gill_r = [["Z", 6]] }
legs = [
    { upper = "back_upper_l", lower = "back_lower_l", foot = "back_foot_l", phase = 0.0, curl = 20 },
    { upper = "front_upper_l", lower = "front_lower_l", foot = "front_foot_l", phase = 0.25, curl = 20 },
    { upper = "back_upper_r", lower = "back_lower_r", foot = "back_foot_r", phase = 0.5, curl = 20 },
    { upper = "front_upper_r", lower = "front_lower_r", foot = "front_foot_r", phase = 0.75, curl = 20 },
]

[[clip]]
name = "brunnenmolch/s_run"          # hurried trot (diagonal pairs), strong waves
keyframe = "gait"
events = "footsteps"
[clip.params]
speed = 1.8
period = 12
duty = 0.5
lift = 0.08
splay = true
bob = 0.006
sway = { bones = ["pelvis", "spine_01", "spine_02", "spine_03", "tail_01", "tail_02", "tail_03", "tail_04", "tail_05", "tail_06"], degrees = [8, -5, -3, -3, 5, 5, 5, 5, 6, 6], lag = 0.06 }
pose = { gill_l = [["Z", -15]], gill_r = [["Z", 15]], neck_01 = [["X", -3]] }
legs = [
    { upper = "back_upper_l", lower = "back_lower_l", foot = "back_foot_l", phase = 0.0, curl = 20 },
    { upper = "front_upper_l", lower = "front_lower_l", foot = "front_foot_l", phase = 0.5, curl = 20 },
    { upper = "back_upper_r", lower = "back_lower_r", foot = "back_foot_r", phase = 0.5, curl = 20 },
    { upper = "front_upper_r", lower = "front_lower_r", foot = "front_foot_r", phase = 0.0, curl = 20 },
]

[[clip]]
name = "brunnenmolch/s_step_inplace" # base of the turns
keyframe = "gait"
helper = true
[clip.params]
speed = 0.0
period = 24
duty = 0.75
lift = 0.05
splay = true
sway = { bones = ["pelvis", "spine_01", "spine_02", "spine_03", "tail_01", "tail_02", "tail_03", "tail_04", "tail_05", "tail_06"], degrees = [3, -2, -1, -1, 2, 2, 2, 2, 2, 2], lag = 0.06 }
