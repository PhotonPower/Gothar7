# Creature "mauerkriecher" (F5, own work, dungeon 2026-11-23): a woodlouse-like crawler as long as
# a big dog - a flat armour of overlapping ring plates, short pincers, long feelers, six legs.
# 1.0 m long (without the feelers), 0.3 m high at the knees. Comes out of cracks in packs of
# 3-6 and rolls itself up when hit hard. The brood of the Kellermutter.
# Design: docs/design/monsters.md "Dungeon-Arten".
# Arthropod plan (characters-pipeline §7.5): pelvis (middle of the forebody, carries the legs),
# spine_01 -> neck_01 -> head forwards, abdomen_01..04 backwards, mandible_l/r, feelers
# antenna_01/02_l/r, legs leg_<n>_upper/lower/foot_<s> (pair 1 on spine_01, pairs 2-3 on pelvis).
# Built by `gothar-chargen creature mauerkriecher` (blender/build_creature.py, creature.py).
#
# Coordinates as in the rig TOMLs (Blender): x = left, -y = forward, z = up, metres. Sizes are
# half axes.

art = "mauerkriecher"
material = "fur"
voxel = 0.004
smooth = 6
ao = 0.7
normal_size = 512
normal_strength = 1.0
triangles = 4000       # lod0 body; the ring plates, eyes and pincer tips add ~1.6 k
lods = [1.0, 0.5, 0.25]
texture = 1024
seed = 71
plate_bevel = 0.006
eye_colour = "#1a1410"
teeth_colour = "#2a221c"         # dark pincer tips

[orientation]                # low and long: pelvis above root, pair 1 left/right
up = ["root", "pelvis"]
left = ["leg_1_foot_r", "leg_1_foot_l"]

[sockets]
socket_mouth = { parent = "head", length = 0.04 }   # between the pincers

