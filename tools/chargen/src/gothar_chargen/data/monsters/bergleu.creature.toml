# Creature "bergleu" (F5, boss, own work): a huge, old, scarred cave lion that lives in the old
# quarry above the town - natural build (no heraldic or logo lion), dark mane, sabre teeth, short
# stone horn stubs, scars. Shoulder 1.6 m, body 3.2 m. Design: docs/design/monsters.md.
# Rig proposed to engine (2026-10-08): cat skeleton with spine_01..03, neck_01/02, jaw, ears, mane
# bones, five tail bones, digitigrade legs with toes; sockets socket_mouth, socket_paw_l/r,
# socket_tail. Built by `gothar-chargen creature bergleu`.
#
# Coordinates as in the rig TOMLs (Blender): x = left, -y = forward, z = up, metres. The tool
# moves everything so that root lies on the ground below the pelvis head. `mirror = true` adds the
# right side.

art = "bergleu"
material = "fur"
voxel = 0.009
smooth = 10
triangles = 10500      # lod0 body; boss budget up to 12 k (engine 2026-10-08)
lods = [1.0, 0.5, 0.25]
texture = 1024
seed = 41
ao = 0.6
normal_size = 512
normal_strength = 0.9
stripe_spacing = 0.2
eye_colour = "#6a4a18"
eye_glow = 0.3
eye_glow_colour = "#e0a040"
teeth_colour = "#d8ccae"
tongue_colour = "#6e3a36"

[sockets]
socket_mouth = { parent = "head", length = 0.06 }
socket_paw_l = { parent = "front_toes_l", length = 0.06 }
socket_paw_r = { parent = "front_toes_r", length = 0.06 }
socket_tail = { parent = "tail_05", length = 0.08 }

