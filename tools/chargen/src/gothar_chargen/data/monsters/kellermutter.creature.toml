# Creature "kellermutter" (F5, own work, dungeon boss 2026-11-23): the ancestral mother of the
# Mauerkriecher - 5.5 m long, 2.4 m high: a huge pale brood sac (with a glowing weak spot on top,
# dark chitin ribs over it) dragged behind an armoured forebody on four legs, two scythe arms,
# a pincer head with a crown of spikes and small ember eyes. Lives in the hoard (at least 4 m
# headroom, welt). Design: docs/design/monsters.md "Dungeon-Arten".
# Arthropod plan (characters-pipeline §7.5): pelvis (middle of the forebody, carries pair 2),
# spine_01 -> neck_01 -> head forwards, abdomen_01..03 backwards with the sac bone `sac` under
# the last one, mandible_l/r, legs leg_1/2_upper/lower/foot_<s> (pair 1 on spine_01), scythes
# arm_upper/lower_<s> -> claw_<s> on spine_01 (claw = the scythe blade); the rigid carrier `weak`
# holds socket_weak and socket_glow (the glowing spot on the sac).
# Built by `gothar-chargen creature kellermutter` (blender/build_creature.py, creature.py).
#
# Coordinates as in the rig TOMLs (Blender): x = left, -y = forward, z = up, metres. Sizes are
# half axes.

art = "kellermutter"
material = "fur"
voxel = 0.018
smooth = 6
ao = 0.7
normal_size = 512
normal_strength = 1.0
triangles = 10000      # lod0 body (boss budget up to 12 k); rib plates, eyes and the spot add ~1 k
lods = [1.0, 0.5, 0.25]
texture = 1024
seed = 97
plate_bevel = 0.02
eye_colour = "#4a2406"
eye_glow = 1.0
eye_glow_colour = "#ffa040"       # ember eyes and the glowing weak spot on the sac
teeth_colour = "#1a1714"          # dark spikes of the crown

[orientation]                # long, the head low in front: pelvis above root, pair 1 left/right
up = ["root", "pelvis"]
left = ["leg_1_foot_r", "leg_1_foot_l"]

[sockets]
socket_mouth = { parent = "head", length = 0.05 }
socket_claw_l = { parent = "claw_l", length = 0.05 }    # tips of the scythes: hit points
socket_claw_r = { parent = "claw_r", length = 0.05 }
socket_weak = { parent = "weak", length = 0.05 }        # weak spot on the sac (engine: distance and angle)
socket_glow = { parent = "weak", length = 0.08 }        # its glow (light)

