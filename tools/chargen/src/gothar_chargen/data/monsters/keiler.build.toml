# Build configuration for the "keiler" placeholder (F5, wild boar): how the CC0 source becomes the
# contract rig. Source: Quaternius "Lowpoly Animated Farm Animal Pack", Pig, CC0 1.0,
# opengameart.org/content/lowpoly-animated-farm-animal-pack. Raw files stay below DATA_ROOT.

art = "keiler"
source = "Farm Animals by @Quaternius/Blends/Pig.blend"   # below DATA_ROOT/characters/monsters
forward = "-Y"        # direction the source animal faces (Blender axes)
height = 0.95         # metres: highest point of the mesh after scaling
material = "fur"      # material role (texture contract §2.3)
drop = ["root"]       # the source root only carries the IK-target feet (re-parented first)

[colors]              # placeholder look: dark bristly boar instead of a pink pig
"Material.003" = "#4b3b2f"
"Material" = "#1e1814"

[parents]             # source names: IK-target feet hang below the lower legs in the contract
"FrontFoot.L" = "FrontLowLeg.L"
"FrontFoot.R" = "FrontLowLeg.R"
"BackFoot.L" = "BackLowLeg.L"
"BackFoot.R" = "BackLowLeg.R"

[bones]               # source bone -> contract name (characters-pipeline.md §7.1)
"Body" = "pelvis"
"Hips" = "spine_01"
"Torso" = "spine_02"
"Shoulders" = "chest"
"Neck" = "neck_01"
"Head" = "head"
"Back" = "rump"
"FrontLeg.L" = "front_shoulder_l"
"FrontUpLeg.L" = "front_upper_l"
"FrontLowLeg.L" = "front_lower_l"
"FrontFoot.L" = "front_foot_l"
"FrontLeg.R" = "front_shoulder_r"
"FrontUpLeg.R" = "front_upper_r"
"FrontLowLeg.R" = "front_lower_r"
"FrontFoot.R" = "front_foot_r"
"BackLeg.L" = "back_hip_l"
"BackUpLeg.L" = "back_upper_l"
"BackLowLeg.L" = "back_lower_l"
"BackFoot.L" = "back_foot_l"
"BackLeg.R" = "back_hip_r"
"BackUpLeg.R" = "back_upper_r"
"BackLowLeg.R" = "back_lower_r"
"BackFoot.R" = "back_foot_r"

[sockets]             # sockets at the tail end of a bone, pointing along it
socket_mouth = { parent = "head", length = 0.06 }

[actions]             # source action -> clip source name used by data/clips/keiler.toml
Idle = "idle"
Walk = "walk"
Death = "die"
# "Run" is left out: its legs stretch up to 38 % (stretchy IK), which rigid bones cannot follow;
# s_run is derived from the walk instead (data/clips/keiler.toml).
