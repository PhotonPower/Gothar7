# Creature "mauerschlupfer" (F5, own work, dungeon 2026-11-23): a bald, pale lurker of the wall
# niches - overlong thin limbs, huge bat ears, blind milky eyes, a narrow head with long gnawing
# teeth, a thin whip of a tail. 1.2 m from nose to tail tip, back 0.47 m. Springs out of a niche
# when it is searched, bites, steals something shiny and flees (behaviour: engine).
# Design: docs/design/monsters.md "Dungeon-Arten".
# Rig derived from the Schinder (wolf naming plus spine_02, neck_02, jaw and ears, §7.1), with
# longer limbs and five tail bones.
# Built by `gothar-chargen creature mauerschlupfer` (blender/build_creature.py, creature.py).
#
# Coordinates as in the rig TOMLs (Blender): x = left, -y = forward, z = up, metres. Sizes are
# half axes; a negative X rotation lifts the front (-y) end of a shape.

art = "mauerschlupfer"
material = "fur"
voxel = 0.0035
smooth = 10
ao = 0.6
normal_size = 512
normal_strength = 0.9
triangles = 6600       # lod0 body; eyes and teeth add ~300
lods = [1.0, 0.5, 0.25]
texture = 1024
seed = 61
eye_colour = "#c9cdc4"           # blind, milky
teeth_colour = "#d9c27a"         # yellow gnawing teeth

[sockets]
socket_mouth = { parent = "head", length = 0.03 }   # bite; carries the stolen item (engine)

