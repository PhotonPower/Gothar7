# Creature "gatterbock" (F5, own work, dungeon 2026-11-23): stone warden of the builders - trunk
# and limbs of hewn sandstone blocks held together by iron bands, iron fists and feet, curved iron
# horns, an ember slit for eyes. 2.5 m, slow and heavy; stands like a statue beside a gate until it
# is woken. Design: docs/design/monsters.md "Dungeon-Arten".
# Humanoid monster rig (proposal with this PR): human reference names, but `neck_01` (§7.1
# required bones), legs `thigh/calf/foot` as for bipeds (§7.1), no fingers (the fists are rigid).
# Built by `gothar-chargen creature gatterbock` (blender/build_creature.py, creature.py).
#
# Coordinates as in the rig TOMLs (Blender): x = left, -y = forward, z = up, metres. The core is a
# dark iron frame (merged body); the sandstone blocks and iron bands are rigid plates on their
# bones, so the warden bends at its joints like a jointed statue. Sizes are half axes.

art = "gatterbock"
material = "fur"
voxel = 0.012
smooth = 4
triangles = 1200       # lod0 core (mostly hidden); the hewn plates and the ember eyes add ~4.8 k
lods = [1.0, 0.5, 0.25]
texture = 1024
seed = 41
ao = 0.7
normal_size = 512
normal_strength = 0.9
eye_colour = "#3a1c08"
eye_glow = 0.9
eye_glow_colour = "#ffa040"           # ember
plate_bevel = 0.02                    # chamfered edges
plate_rough = 0.045                   # hewn faces, chipped edges and corners
grime = 0.6                           # moss and dirt in the joints
grime_colour = "#4d5530"

[orientation]                # upright biped
left = ["foot_r", "foot_l"]
forward = ["foot_l", "ball_l"]

[sockets]
socket_mouth = { parent = "head", length = 0.04 }     # front of the head (the ember slit)
socket_hand_l = { parent = "hand_l", length = 0.06 }  # the fists: hit points
socket_hand_r = { parent = "hand_r", length = 0.06 }

