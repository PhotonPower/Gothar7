# Creature "schinder" (F5, own work): carrion eater of the knacker's yard - hyena/badger build,
# high shoulders, sloping back, bald neck and head, dark bristly crest. Shoulder 0.8 m.
# Eyes and teeth are separate pieces (materials eyes/teeth). Built by `gothar-chargen creature schinder` (blender/build_creature.py, creature.py).
#
# Coordinates as in the rig TOMLs (Blender): x = left, -y = forward, z = up, metres. The tool
# moves everything so that root lies on the ground below the pelvis head. `mirror = true` adds the
# right side (x negated, names _l -> _r). Euler rotations in degrees (XYZ); a negative X rotation
# lifts the front (-y) end of a shape.

art = "schinder"
material = "fur"
voxel = 0.004          # remesh voxel (surface detail before reduction)
smooth = 12
ao = 0.6             # ambient occlusion baked into the texture (0 = none)
normal_size = 512    # normal map (PNG): shape of the high mesh + fur relief
normal_strength = 0.8
triangles = 7300       # lod0 body; eyes and teeth add ~400
lods = [1.0, 0.5, 0.25]
texture = 1024
seed = 11
stripe_spacing = 0.085

[sockets]
socket_mouth = { parent = "head", length = 0.04 }

