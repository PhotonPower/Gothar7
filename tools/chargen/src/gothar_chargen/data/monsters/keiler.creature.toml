# Creature "keiler" (F5, own work): old wild boar - replaces the CC0 placeholder (Quaternius pig)
# with the same rig contract: bone names and hierarchy as before (keiler naming with shoulder and
# hip bones, rump = tail stub), plus jaw and ear_l/r (agreed with engine 2026-10-08). Massive
# shoulders with a bristle crest, wedge head, snout disc, tusks curving up, short slim legs with
# hooves; dark grey-brown bristly coat. Built by `gothar-chargen creature keiler`.
#
# Coordinates as in the rig TOMLs (Blender): x = left, -y = forward, z = up, metres. The tool
# moves everything so that root lies on the ground below the pelvis head. `mirror = true` adds the
# right side.

art = "keiler"
material = "fur"
voxel = 0.005
smooth = 10
triangles = 7000
lods = [1.0, 0.5, 0.25]
texture = 1024
seed = 61
ao = 0.6
normal_size = 512
normal_strength = 1.0
eye_colour = "#140d09"
teeth_colour = "#e2d8c2"
tongue_colour = "#6e3c38"

[orientation]          # the head hangs low: up is root -> pelvis
up = ["root", "pelvis"]

[sockets]
socket_mouth = { parent = "head", length = 0.05 }

