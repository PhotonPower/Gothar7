# Creature "brunnenmolch" (F5, own work, dungeon 2026-11-24): a blind giant cave newt, 2.6 m from
# the snout to the tip of the tail - pale pinkish-white skin, a flat broad head with a wide mouth
# and red feathery gill tufts, short splayed legs (three fingers in front, two toes behind) and a
# flat paddle tail. Lurks half under water in the shallows of the cistern and at its banks, snaps
# up at the hero on the jetty and sinks back; slow and vulnerable on land. No eyes: only two dark
# spots under the skin.
# Design: docs/design/monsters.md "Dungeon-Arten".
# Lizard plan (characters-pipeline §7.6): pelvis (hips, carries the hind legs and the tail),
# spine_01..03 forward to the shoulders, neck_01, head, jaw, tail_01..06, legs
# front_/back_upper/lower/foot_l/r (spread sideways), gill_l/r on the head, socket_mouth.
# Built by `gothar-chargen creature brunnenmolch` (blender/build_creature.py, creature.py).
#
# Coordinates as in the rig TOMLs (Blender): x = left, -y = forward, z = up, metres. Sizes are
# half axes.

art = "brunnenmolch"
material = "fur"
voxel = 0.005
smooth = 10
ao = 0.6
normal_size = 512
normal_strength = 0.8
triangles = 7400       # lod0 body (no separate pieces: blind, the tiny teeth are not modelled)
lods = [1.0, 0.5, 0.25]
texture = 1024
seed = 83
stripe_spacing = 0.12

[orientation]                # long and low: pelvis above root, front feet left/right
up = ["root", "pelvis"]
left = ["front_foot_r", "front_foot_l"]

[sockets]
socket_mouth = { parent = "head", length = 0.05 }   # at the front of the wide mouth

