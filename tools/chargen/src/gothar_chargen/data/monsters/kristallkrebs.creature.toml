# Creature "kristallkrebs" (F5, own work, dungeon 2026-11-23): a big cave crab, 1.8 m across the
# legs - a dark slate carapace with pale blue crystals growing on its back that glow in the dark
# (the light gives it away), two big pincers, eight legs, eyes on stalks. Walks sideways; its
# pincers hold fast; the crystals flare and throw part of a spell back.
# Design: docs/design/monsters.md "Dungeon-Arten".
# Arthropod plan (characters-pipeline §7.5): pelvis (middle of the body, carries legs 2-4),
# spine_01 -> neck_01 -> head forwards, abdomen_01 (tucked under the rear), mandible_l/r,
# eye_stalk_l/r, legs leg_1..4_upper/lower/foot_<s> (pair 1 on spine_01), pincers
# arm_upper/lower_<s> -> claw_<s> -> claw_finger_<s> on spine_01; the rigid carrier `crystals`
# holds socket_glow (light of the crystals), carapace_l/r keep the shell rigid. move_axis "x": s_walk/s_run go sideways (+X).
# Built by `gothar-chargen creature kristallkrebs` (blender/build_creature.py, creature.py).
#
# Coordinates as in the rig TOMLs (Blender): x = left, -y = forward, z = up, metres. Sizes are
# half axes.

art = "kristallkrebs"
material = "fur"
voxel = 0.006
smooth = 6
ao = 0.7
normal_size = 512
normal_strength = 1.0
triangles = 6400       # lod0 body; crystals, eyes and pincer tips add ~0.5 k
lods = [1.0, 0.5, 0.25]
texture = 1024
seed = 83
move_axis = "x"
eye_colour = "#0e0d0c"
teeth_colour = "#8fd4ff"          # the crystals (tooth cones) ...
teeth_glow = 0.9                  # ... glow pale blue

[orientation]                # wide and low: pelvis above root, pair 1 left/right
up = ["root", "pelvis"]
left = ["leg_1_foot_r", "leg_1_foot_l"]

[sockets]
socket_mouth = { parent = "head", length = 0.04 }
socket_claw_l = { parent = "claw_l", length = 0.04 }     # tip of the pincer: hit and hold
socket_claw_r = { parent = "claw_r", length = 0.04 }
socket_glow = { parent = "crystals", length = 0.04 }     # light of the crystals (engine)

