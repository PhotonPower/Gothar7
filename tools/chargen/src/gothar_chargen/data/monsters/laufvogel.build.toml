# Build configuration for the "laufvogel" placeholder (F5, large running bird): how the CC0 source
# becomes the contract rig. Source: Quaternius "5 Low poly animals" (Animals Pack), Chick, scaled up,
# CC0 1.0, opengameart.org/content/5-low-poly-animals. Raw files stay below DATA_ROOT.

art = "laufvogel"
source = "Animals Pack by Quaternius/Blends/Chick.blend"   # below DATA_ROOT/characters/monsters
forward = "+X"        # direction the source animal faces (Blender axes)
height = 1.6          # metres: highest point of the mesh after scaling (head)
material = "fur"      # material role (texture contract §2.3; plumage counts as fur)

[colors]              # placeholder look: drab plumage instead of a yellow chick
"Material.001" = "#6b5a48"
"Material.002" = "#3a3028"

[orientation]         # bird: left/right from the feet (no front legs)
left = ["foot_r", "foot_l"]

[bones]               # source bone -> contract name (characters-pipeline.md §7.1, birds)
"Bone" = "pelvis"
"Bone.001" = "spine_01"
"Bone.002" = "neck_01"
"Bone.009" = "head"
"Bone.006" = "thigh_l"
"Bone.007" = "calf_l"
"Bone.008" = "foot_l"
"Bone.003" = "thigh_r"
"Bone.004" = "calf_r"
"Bone.005" = "foot_r"

[sockets]             # sockets at the tail end of a bone, pointing along it (beak tip)
socket_mouth = { parent = "head", length = 0.06 }

[actions]             # source action -> clip source name used by data/clips/laufvogel.toml
"ArmatureAction.002" = "walk"
