# Creature "glemsmahr" (F5, own work): gaunt night hunter of the Glems forest - walks crouched on
# the knuckles of its overlong arms, digitigrade hind legs, flat face with big eyes that glow in
# the light, pointed ears, wide mouth with needle teeth, hairless pale skin with a dark stripe of
# spine knobs. Crouched about 1.5 m, upright 2.3 m. Design: docs/design/monsters.md.
# Rig agreed with engine (2026-10-07, via koordinator): 37 bones incl. sockets, one segment per
# finger, socket_mouth, socket_hand_l/r (claws), socket_eyes (glow effect); emissive eyes.
# Built by `gothar-chargen creature glemsmahr` (blender/build_creature.py, creature.py).
#
# Coordinates as in the rig TOMLs (Blender): x = left, -y = forward, z = up, metres. The tool
# moves everything so that root lies on the ground below the pelvis head. `mirror = true` adds the
# right side.

art = "glemsmahr"
material = "fur"
voxel = 0.005
smooth = 8
triangles = 7000
lods = [1.0, 0.5, 0.25]
texture = 1024
seed = 31
ao = 0.6
normal_size = 512
normal_strength = 0.8
eye_colour = "#4a4632"
eye_glow = 0.35
eye_glow_colour = "#e6dca8"           # pale, yellowish
teeth_colour = "#d6cfba"
tongue_colour = "#5a3036"

[orientation]                # crouched: the head is far forward
up = ["root", "spine_03"]

[sockets]
socket_mouth = { parent = "head", length = 0.04 }
socket_eyes = { parent = "head", length = 0.02 }        # front of the face, between the eyes
socket_hand_l = { parent = "front_foot_l", length = 0.04 }
socket_hand_r = { parent = "front_foot_r", length = 0.04 }

