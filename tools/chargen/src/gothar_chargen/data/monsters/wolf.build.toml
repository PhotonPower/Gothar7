# Build configuration for the "wolf" placeholder (F5): how the CC0 source becomes the contract rig.
# Source: Quaternius "Animated Animales Low Poly" (Animal Pack Vol.2), CC0 1.0,
# opengameart.org/content/animated-animales-low-poly. Raw files stay below DATA_ROOT.

art = "wolf"
source = "Animal Pack Vol.2 by @Quaternius/Blends/Wolf.blend"   # below DATA_ROOT/characters/monsters
forward = "+X"        # direction the source animal faces (Blender axes)
height = 0.85         # metres: highest point of the mesh after scaling (ears)
material = "fur"      # material role (texture contract §2.3)
drop = ["IKFrontRight", "IKFrontLeft", "IKBackRight", "IKBackLeft"]   # helper bones (baked first)

[bones]               # source bone -> contract name (characters-pipeline.md §7)
"Bone" = "pelvis"
"Bone.001" = "spine_01"
"Bone.002" = "neck_01"
"Bone.003" = "head"
"Bone.004" = "tail_01"
"Bone.005" = "tail_02"
"Bone.006" = "tail_03"
"Bone.007" = "tail_04"
"Bone.017" = "front_upper_l"
"Bone.018" = "front_lower_l"
"Bone.019" = "front_foot_l"
"Bone.014" = "front_upper_r"
"Bone.015" = "front_lower_r"
"Bone.016" = "front_foot_r"
"Bone.008" = "back_upper_l"
"Bone.009" = "back_lower_l"
"Bone.010" = "back_foot_l"
"Bone.011" = "back_upper_r"
"Bone.012" = "back_lower_r"
"Bone.013" = "back_foot_r"

[sockets]             # sockets at the tail end of a bone, pointing along it
socket_mouth = { parent = "head", length = 0.06 }

[actions]             # source action -> clip source name used by data/clips/wolf.toml
Idle = "idle"
Walking = "walk"
