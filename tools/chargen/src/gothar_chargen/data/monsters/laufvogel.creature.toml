# Creature "laufvogel" (F5, own work): large flightless runner of the meadows - replaces the CC0
# placeholder (Quaternius chick) with the same rig contract: bird naming thigh/calf/foot, bone names
# as before, plus neck_02, jaw (beak) and wing_l/r (agreed with engine 2026-10-08). Own silhouette,
# no real bird copied: heavy body with slate-blue plumage lying back, rust-red neck ruff, fan crest
# on the head, strong hooked beak, stubby wings, long tail plume, scaly legs with three clawed toes.
# Built by `gothar-chargen creature laufvogel`.
#
# Coordinates as in the rig TOMLs (Blender): x = left, -y = forward, z = up, metres. The tool
# moves everything so that root lies on the ground below the pelvis head. `mirror = true` adds the
# right side.

art = "laufvogel"
material = "fur"
voxel = 0.0045
smooth = 10
triangles = 6500
lods = [1.0, 0.5, 0.25]
texture = 1024
seed = 71
ao = 0.6
normal_size = 512
normal_strength = 0.9
eye_colour = "#d07a20"
teeth_colour = "#2a2420"                # claws

[orientation]          # bird naming: left/right from the feet
left = ["foot_r", "foot_l"]

[sockets]
socket_mouth = { parent = "head", length = 0.05 }

