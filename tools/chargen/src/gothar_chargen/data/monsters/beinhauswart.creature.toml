# Creature "beinhauswart" (F5, own work, dungeon 2026-11-23): the warden of the charnel house - a
# gaunt, stooped grave-digger of unclear kind in a grey shroud with a deep hood, a bony face with
# two green points of light, bony hands; a grave spade in the right hand; the iron lantern with
# green light in the left is a separate item (it_lantern_beinhaus) that engine hangs on
# socket_lantern (npc_hold) and drops in the rage phase. 2.0 m to the top of the hood (stooped).
# Alive, not undead (owner's decision 2026-11-23). Design: docs/design/monsters.md "Dungeon-Arten".
# Humanoid monster rig like the Gatterbock (characters-pipeline §7.1): human reference names with
# `neck_01`, legs `thigh/calf/foot/ball`, no fingers. The shroud is part of the body surface (it
# follows the legs); the spade is rigid plates on the right hand.
# Built by `gothar-chargen creature beinhauswart` (blender/build_creature.py, creature.py).
#
# Coordinates as in the rig TOMLs (Blender): x = left, -y = forward, z = up, metres. Sizes are
# half axes.

art = "beinhauswart"
material = "fur"
voxel = 0.010
smooth = 4
triangles = 4200       # lod0 core; spade and the glowing eyes add ~0.5 k
lods = [1.0, 0.5, 0.25]
texture = 1024
seed = 53
ao = 0.8
normal_size = 512
normal_strength = 0.8
plate_bevel = 0.004
eye_colour = "#1e3a24"
eye_glow = 1.0
eye_glow_colour = "#70ff9a"           # pale green eyes (like the lantern glass)

[orientation]                # upright biped
left = ["foot_r", "foot_l"]
forward = ["foot_l", "ball_l"]

[sockets]
socket_mouth = { parent = "head", length = 0.04 }      # front of the face
socket_hand_l = { parent = "hand_l", length = 0.06 }   # lantern hand
socket_hand_r = { parent = "hand_r", length = 0.06 }   # spade hand: hit point of the shaft
socket_spade = { parent = "spade", length = 0.04 }     # middle of the spade blade: hit point
socket_lantern = { parent = "lantern", length = 0.04 } # lantern bail in the fist, +Y up (npc_hold)

