# Creature "quaderbuckel" (F5, own work): armoured dweller of the old sandstone quarries - low,
# heavy body with plates like hewn sandstone blocks, thick legs, a horny snout with stubby tusks and
# a brow shield the head pulls back under. 1.8 m long, 0.9 m high. Design: docs/design/monsters.md.
# Built by `gothar-chargen creature quaderbuckel` (blender/build_creature.py, creature.py).
#
# Coordinates as in the rig TOMLs (Blender): x = left, -y = forward, z = up, metres. The tool
# moves everything so that root lies on the ground below the pelvis head. `mirror = true` adds the
# right side. Plates are rigid pieces on their bone (plate_shell: rows on an ellipsoid, each plate
# on the nearest of `bones`).

art = "quaderbuckel"
material = "fur"
voxel = 0.006
smooth = 8
triangles = 4600       # lod0 body; plates, teeth, tongue and eyes add ~3.3 k
lods = [1.0, 0.5, 0.25]
texture = 1024
seed = 23
ao = 0.6
normal_size = 512
normal_strength = 0.8
plate_bevel = 0.012
eye_colour = "#1a1208"
teeth_colour = "#c9b48c"               # horn edges
tongue_colour = "#6e3c38"

[orientation]          # the head hangs low and far forward: up is root -> pelvis
up = ["root", "pelvis"]

[sockets]
socket_mouth = { parent = "head", length = 0.04 }
socket_shield = { parent = "brow_shield", length = 0.03 }   # front edge of the brow shield

