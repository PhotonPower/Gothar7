# Creature "wolf" (F5, own work): grey pack wolf - replaces the CC0 placeholder (Quaternius) with the
# same rig contract: bone names, hierarchy and positions as before (symmetric), so pack AI, summon
# and transformation (M12) keep working. Grey coat with a darker saddle, pale face mask and belly,
# ruff, pointed ears, bushy tail. Built by `gothar-chargen creature wolf`.
#
# Coordinates as in the rig TOMLs (Blender): x = left, -y = forward, z = up, metres. The tool
# moves everything so that root lies on the ground below the pelvis head. `mirror = true` adds the
# right side.

art = "wolf"
material = "fur"
voxel = 0.004
smooth = 10
triangles = 7000
lods = [1.0, 0.5, 0.25]
texture = 1024
seed = 53
ao = 0.6
normal_size = 512
normal_strength = 0.9
eye_colour = "#b08428"
teeth_colour = "#e0d8c4"
tongue_colour = "#7a3c40"

[sockets]
socket_mouth = { parent = "head", length = 0.06 }

