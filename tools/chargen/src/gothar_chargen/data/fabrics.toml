# Worn cloth textures (F3n; gothar-chargen fabrics, fabrics.py). Tiles: ambientCG fabrics (CC0) in
# DATA_ROOT/characters/ambientcg/fabric (not in the repository); only the baked textures are versioned,
# under the names the parts already use. wear 0..1: faded, stains, dirty seams and hems (Gothic colony:
# worn; owner decision 2026-10-04 – cleaner figures such as citizens get a lower wear later).
version = 1

[tiles.linen]
source = "Fabric066/Fabric066_1K-JPG_Color.jpg"
size = 0.22

[tiles.fine_weave]
source = "Fabric062/Fabric062_1K-JPG_Color.jpg"
size = 0.18

[tiles.knit]
source = "Fabric068/Fabric068_1K-JPG_Color.jpg"
size = 0.3

[tiles.wool]
source = "Fabric031/Fabric031_1K-JPG_Color.jpg"
size = 0.3

[tiles.canvas]
