# Human reference skeleton (contract: docs/modules/animation.md -> "Referenz-Skelett").
#
# Names, parents and the socket flag are the contract between the figuren and engine tracks.
# head/tail/up describe the bind pose used by the Blender generator (build_reference_rig.py);
# the validator compares other files against the exported human_reference.glb, not against these numbers.
#
# Coordinates: Blender space, metres, Z up, character faces -Y (glTF export: Y up, faces +Z),
# character's left side is +X. Bind pose: T-pose (decision 2026-10-03), palms down.
# up = direction the bone's local Z axis is aligned to (Blender "align roll").

[rig]
name = "human_reference"
height = 1.80
bind_pose = "T"
max_bones = 128
max_influences = 4

# Morph targets allowed on human heads (characters-pipeline.md §6).
morph_targets = [
    "vis_aa", "vis_ee", "vis_ih", "vis_oh", "vis_ou", "vis_mbp", "vis_fv", "vis_l", "vis_rest",
    "blink_l", "blink_r",
    "expr_angry", "expr_friendly", "expr_fear", "expr_pain", "expr_sleep",
]

# Bones in hierarchy order (parent before child). Left side only for paired bones whose
# name ends in "_l"; mirror = true generates the "_r" counterpart (x negated, parent suffix swapped).

[[bone]]
name = "root"
head = [0.0, 0.0, 0.0]
tail = [0.0, -0.20, 0.0]
up = [0.0, 0.0, 1.0]

[[bone]]
name = "pelvis"
parent = "root"
head = [0.0, 0.0, 0.98]
tail = [0.0, 0.0, 1.05]
up = [0.0, -1.0, 0.0]

[[bone]]
name = "spine_01"
parent = "pelvis"
head = [0.0, 0.0, 1.05]
tail = [0.0, 0.0, 1.18]
up = [0.0, -1.0, 0.0]

[[bone]]
name = "spine_02"
parent = "spine_01"
head = [0.0, 0.0, 1.18]
tail = [0.0, 0.0, 1.32]
up = [0.0, -1.0, 0.0]

[[bone]]
name = "spine_03"
parent = "spine_02"
head = [0.0, 0.0, 1.32]
tail = [0.0, 0.0, 1.50]
up = [0.0, -1.0, 0.0]

[[bone]]
name = "neck"
parent = "spine_03"
head = [0.0, 0.0, 1.50]
tail = [0.0, -0.01, 1.61]
up = [0.0, -1.0, 0.0]

[[bone]]
name = "head"
parent = "neck"
head = [0.0, -0.01, 1.61]
tail = [0.0, -0.01, 1.80]
up = [0.0, -1.0, 0.0]

[[bone]]
name = "socket_helmet"
parent = "head"
socket = true
head = [0.0, -0.01, 1.61]
tail = [0.0, -0.01, 1.71]
up = [0.0, -1.0, 0.0]

