[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gothar-chargen"
version = "0.1.0"
description = "Character-track tools for Gothar: reference rig, rig validator, Blender export"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
gothar-chargen = "gothar_chargen.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gothar_chargen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["blender: needs a local Blender installation (skipped otherwise)"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
