# Gebietsdefinition für den Spielort "Leonberg".
# Koordinaten in ETRS89 / UTM 32N (EPSG:25832), Meter.
# Ursprung und Grenzen am LGL-Luftbild (DOP20, Befliegung 2025) geprüft und festgelegt am 2026-10-02.

[source]
crs = "EPSG:25832"

[origin]
# Marktbrunnen (achteckiges Becken) auf dem Leonberger Marktplatz, Geländehöhe ca. 386,9 m NHN.
easting  = 501115.0
northing = 5405347.0
height_reference = "marktplatz"   # Höhe des Ursprungs wird beim Import aus dem DGM1 gelesen

[area.core]          # Altstadt: volle Detailstufe (Gebäude-Generator, Annotationen)
half_extent_m = 350  # deckt die Altstadt (ca. E 500850–501300, N 5405200–5405560) samt Schloss ab

[area.surroundings]  # Umland: nur Gelände + OSM-Grundlage, später frei gestaltet
half_extent_m = 1000

[game_scale]
# Festgelegt 2026-10-03 nach der Begehung (W3, docs/design/leonberg-begehung.md, Entscheidung E3 des
# Projektinhabers über den Koordinator): Maßstab 1:1, keine Gassenverbreiterung.
horizontal = 1.0
vertical   = 1.0
alley_widen_factor = 1.0
