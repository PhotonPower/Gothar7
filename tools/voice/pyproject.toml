[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gothar-voice"
version = "0.1.0"
description = "Voice-line database for Gothar: texts, speaker, direction, takes (TTS/recordings)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
app = ["streamlit>=1.36", "pandas>=2.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
gothar-voice = "gothar_voice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gothar_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
