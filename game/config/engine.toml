# Gothar – Standard-Konfiguration (wird neben die Executable nach config/engine.toml kopiert).
# Eigene Einstellungen gehören in die Benutzer-Konfiguration (config.toml im Benutzerverzeichnis,
# Windows: %APPDATA%\Gothar\Gothar), die diese Datei Schlüssel für Schlüssel überschreibt.

[window]
width = 1600
height = 900
fullscreen = false
# VSync wirkt ab M2 (OpenGL). max_fps begrenzt die Bildrate zusätzlich (0 = unbegrenzt).
vsync = true
max_fps = 240

[camera]
# Debug-Kamera bis zur Spielfigur (M5): Bewegen mit den Laufaktionen, hoch/runter mit jump/sneak,
# schnell mit run, Umsehen mit gehaltener rechter Maustaste.
fov = 70.0               # vertikal, Grad
near = 0.1               # Meter
far = 1500.0             # Meter
mouse_sensitivity = 0.1  # Grad pro Pixel
fly_speed = 10.0         # m/s

[render]
# Shader bei Änderung neu laden (Standard: an im Debug-Build, aus im Release-Build).
# shader_hot_reload = true
# Anisotrope Filterung für Materialtexturen (1 = aus; wird auf den Treiberwert begrenzt).
anisotropy = 8
# Sonnenschatten (Cascaded Shadow Maps): Kaskaden 1–4, Auflösung je Kaskade, Reichweite in Metern.
# 4 x 2048² belegen 64 MB Grafikspeicher; auf schwächeren GPUs shadow_resolution = 1024.
shadow_cascades = 4
shadow_resolution = 2048
shadow_distance = 150.0
# Sichtbarkeit: Objekte weiter als view_distance Meter (nächster Punkt ihrer Bounds) werden nicht gezeichnet; der
# Nebel (unten) deckt bei 400 m schon 98,7 %. Deko-Objekte verschwinden zusätzlich, wenn Radius/Entfernung unter
# size_cull fällt (0.005 ≈ 4 Pixel Radius bei 1600×900); spielrelevante (Mobs, category = "gameplay") nie wegen der
# Größe. 0 schaltet die jeweilige Prüfung ab. Leonberg-Kern von oben: gleiches Bild, 4,2 → 2,9 ms (RTX 3080).
view_distance = 400.0
size_cull = 0.005
# Kaskaden einfärben (rot, grün, blau, gelb) zum Einstellen.
shadow_debug = false
# Tonemapping des HDR-Bildes: "aces" (filmisch, Standard), "reinhard" (neutral), "none" (abschneiden).
tonemap = "aces"
exposure = 1.0
# Distanznebel: kein Nebel bis fog_start (Meter), danach exponentiell-quadratisch; 0.00562 = 90 % bei 300 m.
# fog_density = 0 schaltet ihn ab.
fog_start = 30.0
fog_density = 0.00562
# Debug-Overlay (Achsen, Raster, Bounds, Lichtradien, FPS) beim Start zeigen; umschalten mit der Aktion debug_draw (F2).
debug_draw = false
# ImGui-Debugfenster (Leistung, Kamera, Render-Einstellungen live) beim Start zeigen; umschalten mit debug_ui (F1).
debug_ui = false
# Shader-Verzeichnis, Standard: "shaders" neben der Executable. Zum Live-Bearbeiten der Quellen z. B.
# shader_dir = "C:/dev/Gothar7/engine/render/shaders"

[assets]
# Ordner und Archive im virtuellen Dateisystem (docs/modules/asset.md). Höhere Priorität gewinnt.
# dev_mounts: in Entwicklungs-Builds (CMake G7_DEV_ASSETS) assets/source (0), assets/cooked (10) und
# assets/cooked/*.g7pak (11) des Repos.
dev_mounts = true
# Geänderte Dateien (Texturen, Modelle) im laufenden Spiel neu laden; Standard: an im Debug-, aus im Release-Build.
# hot_reload = true
# Weitere Quellen, relativ zum Spielordner; "*.g7pak" mountet alle Archive eines Ordners:
# [[assets.mount]]
# path = "data/*.g7pak"
# priority = 20
# mount_point = ""

[input]
# "classic" (Gothic-artig: Aktionstaste + Richtung) oder "modern" (Maus-Angriff, E zum Benutzen)
scheme = "classic"
stick_deadzone = 0.2

# Eingabenamen: Tasten nach US-Layout ("W", "LeftCtrl", "Grave", "1", "F5"),
# Maus "MouseLeft"/"MouseRight"/"MouseMiddle"/"MouseX1"/"MouseX2",
# Gamepad "PadSouth"/"PadEast"/"PadWest"/"PadNorth"/"PadLeftShoulder"/"PadRightShoulder"/
#         "PadLeftStick"/"PadRightStick"/"PadBack"/"PadStart"/"PadDpadUp"/"PadDpadDown"/"PadDpadLeft"/"PadDpadRight".
# Leere Liste = Aktion in diesem Schema nicht belegt.

[bindings.classic]
move_forward = ["Up", "W", "PadDpadUp"]
move_back = ["Down", "S", "PadDpadDown"]
turn_left = ["Left", "A", "PadDpadLeft"]
turn_right = ["Right", "D", "PadDpadRight"]
strafe_left = ["Q", "PadLeftShoulder"]
strafe_right = ["E", "PadRightShoulder"]
action = ["LeftCtrl", "PadWest"]
attack = []
use = []
jump = ["LeftAlt", "PadSouth"]
run = ["LeftShift", "PadLeftStick"]
sneak = ["X", "PadRightStick"]
draw_weapon = ["Space", "PadNorth"]
draw_magic = ["1", "PadEast"]
inventory = ["Tab", "PadBack"]
log = ["N"]
status = ["B"]
map = ["M"]
quick_save = ["F5"]
quick_load = ["F9"]
console = ["Grave"]
pause = ["Escape", "PadStart"]
debug_draw = ["F2"]
debug_ui = ["F1"]

[bindings.modern]
move_forward = ["W", "PadDpadUp"]
move_back = ["S", "PadDpadDown"]
turn_left = []
turn_right = []
strafe_left = ["A", "PadDpadLeft", "PadLeftShoulder"]
strafe_right = ["D", "PadDpadRight", "PadRightShoulder"]
action = []
attack = ["MouseLeft", "PadEast"]
use = ["E", "PadWest"]
jump = ["Space", "PadSouth"]
run = ["LeftShift", "PadLeftStick"]
sneak = ["LeftCtrl", "PadRightStick"]
draw_weapon = ["R", "PadNorth"]
draw_magic = ["F"]
inventory = ["Tab", "PadBack"]
log = ["J"]
status = ["C"]
map = ["M"]
quick_save = ["F5"]
quick_load = ["F9"]
console = ["Grave"]
pause = ["Escape", "PadStart"]
debug_draw = ["F2"]
debug_ui = ["F1"]
